<script>
(function(){
/* =====================================================================
   Grade 4 Computer · Final revision, Term 1
   Unit 1: L1 My desktop, L2 Files and folders, L3 Computer settings, L4 Protect my computer
   Unit 2: L1 Format a paragraph
   From the lessons (book pages 9–67) and the school sheets CW1, CW2, HW1, HW2.
   Question: {l: lesson 1–5 (5 = Unit 2 L1), s: drawn picture (SC) or p: photo from that lesson's img folder,
              q, o: [answers], c: right answer (default 0), k: keep the order, x: why}
   ===================================================================== */

/* ---------- drawing helpers ---------- */
const em=(x,y,s,c,ex='')=>`<text class="emo" x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${ex}>${c}</text>`;
const tx=(x,y,t,c='lbl',a='middle')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="central">${t}</text>`;
const ar=(x1,y1,x2,y2,c='ink',w=4)=>`<line class="st-${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#ah-${c})"/>`;
const SKY='<rect class="f-sky" width="320" height="180"/>';
const CARD='<rect class="f-card" width="320" height="180"/>';
// put an icon (an <svg> string) inside the picture
const nest=(svg,x,y,s,style='')=>String(svg).replace('<svg ',`<svg x="${x}" y="${y}" width="${s}" height="${s}" ${style?`style="${style}"`:''} `);
const SCA=(WinSim.icon('docx',true).match(/<svg[\s\S]*?<\/svg>/g)||[])[1]||'';
// a file icon of Mini Windows centred on x,y; sc = with the shortcut arrow
const fi=(t,x,y,s=56,sc)=>nest(WinSim.ICONS[t],x-s/2,y-s/2,s)+(sc?nest(SCA,x-s/2,y+s*.12,s*.38):'');
// a button of Mini Word: icon, optional ▾
const wic=n=>WordSim.icon(n).replace(/^<span[^>]*>/,'').replace(/<\/span>$/,'');
const chev=(x,y)=>`<path d="M${x-5},${y-3} L${x},${y+3} L${x+5},${y-3}" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
const wb=(n,x,y,dd)=>{const w=dd?96:66;return `<rect x="${x-w/2}" y="${y-30}" width="${w}" height="60" rx="14" fill="#fff" stroke="#9aa0a8" stroke-width="2.5"/>`+nest(wic(n),dd?x-38:x-21,y-21,42,'color:#222')+(dd?chev(x+28,y):'')};
// a paragraph drawn as grey lines
const para=(x,y,w,n,gap=12,first=0,cls='f-ink')=>{let s='';for(let i=0;i<n;i++){const ind=i===0?first:0;const ww=i===n-1?w*.6:w;s+=`<rect class="${cls}" x="${x+ind}" y="${y+i*gap}" width="${ww-ind}" height="5" rx="2.5" opacity=".55"/>`}return s};
const key=(x,y,t,w=56,hi)=>`<rect class="${hi?'f-ke':'f-card'}" x="${x-w/2}" y="${y-22}" width="${w}" height="44" rx="8"/><rect class="st-ink" x="${x-w/2}" y="${y-22}" width="${w}" height="44" rx="8" fill="none" stroke-width="2.5"/>${tx(x,y,t,'lbl-big')}`;
const win=(x,y,w,h,title)=>`<rect class="f-card" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><rect class="st-ink" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke-width="2.5"/>${title?`<line class="st-ink" x1="${x}" y1="${y+24}" x2="${x+w}" y2="${y+24}" stroke-width="2"/>`+tx(x+10,y+12,title,'lbl','start'):''}`;
const big=(x,y,t,ex='')=>`<text class="lbl-big" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" style="font-size:30px" ${ex}>${t}</text>`;

const SC={
desk:()=>`<rect fill="#2f6fb5" width="320" height="180"/><rect fill="#1d4f8a" y="152" width="320" height="28"/>${fi('folder',44,40,46)}<text x="44" y="72" text-anchor="middle" font-size="11" fill="#fff">Lessons</text>${fi('docx',44,104,46,1)}<text x="44" y="136" text-anchor="middle" font-size="11" fill="#fff">Shortcut</text>${fi('zip',112,40,46)}<text x="112" y="72" text-anchor="middle" font-size="11" fill="#fff">Lessons.zip</text>${fi('bin',112,104,46)}<text x="112" y="136" text-anchor="middle" font-size="11" fill="#fff">Recycle Bin</text>${fi('start',120,166,22)}${fi('search',148,166,22)}${fi('explorer',176,166,22)}${fi('shield',204,166,22)}<text x="300" y="166" text-anchor="end" font-size="11" fill="#fff">3:26 AM</text>${nest(WinSim.ICONS.speaker,240,157,18)}${em(240,80,58,'🧑‍💻')}`,

story:()=>SKY+`${em(90,96,70,'🧒')}${em(150,118,40,'✍️')}${ar(186,96,226,96)}${fi('docx',262,92,72)}${tx(160,26,'writing a story','lbl-big')}`,

ways:()=>SKY+`${fi('search',70,80,64)}${fi('explorer',160,80,64)}${em(250,80,56,'🔎')}${tx(70,130,'Search button')}${tx(160,130,'File Explorer')}${tx(250,130,'filters')}${tx(160,26,'Find a lost file','lbl-big')}`,

const LESSONS=[{n:0,l:'All lessons'},{n:1,l:'L1 · My desktop'},{n:2,l:'L2 · Files & folders'},{n:3,l:'L3 · Settings'},{n:4,l:'L4 · Protect'},{n:5,l:'Unit 2 · Paragraph'}];

const pool=()=>({mc:MC.filter(q=>!lesIdx||q.l===lesIdx),mt:MT.filter(q=>!lesIdx||q.l===lesIdx)});
const LENS=[{mc:8,mt:2,l:'Quick · 10'},{mc:16,mt:4,l:'Normal · 20'},{mc:0,mt:0,l:'All'}];
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let lenIdx=1,lesIdx=0;
try{const v=localStorage.getItem('cq-len');if(v!==null&&LENS[+v])lenIdx=+v}catch(e){}
try{const v=localStorage.getItem('cq-lesson');if(v!==null&&LESSONS[+v])lesIdx=+v}catch(e){}

const S={list:[],i:0,score:0,max:0,miss:[]};
const app=document.getElementById('app');
const {esc,shuf,pick,star}=Kit;
const bolt='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="#1B2440"/></svg>';
const scene=(k,q)=>q&&q.p?`<img class="scene pic fit" src="../../computer/${PHOTO[q.l]}/${q.p}.jpg" alt="Picture for the question">`:`<div class="scene" role="img" aria-label="Picture for the question"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">${SC[k]()}</svg></div>`;

function start(){
  const L=LENS[lenIdx],P=pool();
  const mc=shuf(P.mc).slice(0,L.mc||P.mc.length).map(q=>({type:'mc',...q}));
  const mt=shuf(P.mt).slice(0,L.mt||P.mt.length).map(q=>({type:'mt',...q}));
  let list=shuf(mc.concat(mt));
  // avoid two matching rounds in a row when possible
  for(let i=1;i<list.length;i++){if(list[i].type==='mt'&&list[i-1].type==='mt'){const j=list.findIndex((q,k)=>k>i&&q.type==='mc');if(j>0)[list[i],list[j]]=[list[j],list[i]]}}
  S.list=list;S.i=0;S.score=0;S.miss=[];
  S.max=list.reduce((t,q)=>t+(q.type==='mc'?1:q.p.length),0);
  render();
}

function hud(){
  const pct=Math.round(S.i/S.list.length*100);
  return `<div class="hud"><span class="qnum">Question ${S.i+1} of ${S.list.length}</span><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div><span class="score" aria-label="Points">${bolt}<b id="pts">${S.score}</b></span></div>`;
}

function render(){
  if(!S.list.length) return home();
  if(S.i>=S.list.length) return end();
  const q=S.list[S.i];
  q.type==='mc'?renderMC(q):renderMT(q);
  window.scrollTo({top:0,behavior:'smooth'});
}

function home(){
  const P=pool(),n=P.mc.length+P.mt.length;
  app.innerHTML=`<section class="card pop">
    <div class="topbar"><a class="back" href="../../../index.html">← All games</a><span class="eyebrow">Grade 4 Computer · Final revision</span></div>
    <h1 class="hero-title"><span class="p">Computer</span> <span class="k">Quest</span></h1>
    ${scene('desk')}
    <p class="howto">Ready? Look at each picture, then choose the right answer. In matching rounds, tap a word and then tap its meaning. The questions are mixed up every time you play.</p>
    <div class="chips"><span class="chip pe">My desktop</span><span class="chip ke">Files &amp; folders</span><span class="chip">Computer settings</span><span class="chip ht">Protect my computer</span><span class="chip pe">Format a paragraph</span></div>
    <div class="row"><span class="eyebrow">Which lessons?</span><div class="seg" role="group" aria-label="Lessons">${LESSONS.map((l,i)=>`<button type="button" id="les-${i}" data-les="${i}" aria-pressed="${i===lesIdx}">${l.l}</button>`).join('')}</div></div>
    <div class="row"><span class="eyebrow">How many questions?</span><div class="seg" role="group" aria-label="Number of questions">${LENS.map((l,i)=>`<button type="button" id="len-${i}" data-len="${i}" aria-pressed="${i===lenIdx}">${i===LENS.length-1?'All · '+n:l.l}</button>`).join('')}</div></div>
    <div class="row"><button class="btn big" id="startBtn" type="button">Start</button></div>
  </section>`;
  app.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{lenIdx=+b.dataset.len;store('cq-len',lenIdx);home()});
  app.querySelectorAll('[data-les]').forEach(b=>b.onclick=()=>{lesIdx=+b.dataset.les;store('cq-lesson',lesIdx);home()});
  document.getElementById('startBtn').onclick=start;
}

function renderMC(q){
  let opts=q.o.map((t,i)=>({t,ok:i===(q.c||0)}));
  if(!q.k) opts=shuf(opts);
  const long=opts.some(o=>o.t.length>34);
  app.innerHTML=`${hud()}<section class="card pop">
    <span class="qtype mc">${q.o===TF||q.o===YN?'True or false':'Choose the answer'}</span>
    ${scene(q.s,q)}
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts ${long?'long':''}">${opts.map((o,i)=>`<button type="button" class="opt" id="opt-${i}" data-i="${i}"><span class="L">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="fbx"></div>
  </section>`;
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    btns.forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(o.ok){S.score++}else{b.classList.add('wrong');S.miss.push({q:q.q,your:o.t,right:opts.find(z=>z.ok).t})}
    document.getElementById('pts').textContent=S.score;
    document.getElementById('fbx').innerHTML=`<div class="fb ${o.ok?'ok':'no'}"><b>${o.ok?pick(['Correct!','Great job!','You got it!','Nice work!']):'Not quite.'}</b><span>${o.ok?'':'The answer is <strong>'+esc(opts.find(z=>z.ok).t)+'</strong>. '}${esc(q.x)}</span></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn next" id="nextBtn" type="button">${S.i+1<S.list.length?'Next':'See my score'}</button></div>`;
    const n=document.getElementById('nextBtn');n.onclick=()=>{S.i++;render()};n.focus({preventScroll:true});
  });
}

function renderMT(q){
  const left=shuf(q.p.map((p,i)=>({i,ic:p[0],t:p[1]})));
  const right=shuf(q.p.map((p,i)=>({i,t:p[2]})));
  const pair={}; // leftIdx -> rightIdx
  let sel=null, checked=false;
  app.innerHTML=`${hud()}<section class="card pop">
    <span class="qtype mt">Matching · ${q.p.length} points</span>
    <p class="qtext">${esc(q.t)}</p>
    <p class="hint">Tap a word on the left, then tap its meaning on the right. Tap again to undo.</p>
    <div class="match"><div class="mcol" id="colL"></div><div class="mcol" id="colR"></div></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my matches</button></div></div>
  </section>`;
  const colL=document.getElementById('colL'),colR=document.getElementById('colR');
  function draw(){
    colL.innerHTML=left.map((l,k)=>{const p=pair[l.i]!==undefined;const ok=checked&&pair[l.i]===l.i;const cls=checked?(ok?'ok':'no'):(sel===l.i?'sel':'');
      return `<button type="button" class="mi ${cls}" id="ml-${k}" data-l="${l.i}" ${checked?'disabled':''}><span class="ic">${l.ic}</span><span class="tx">${esc(l.t)}${checked&&!ok?`<span class="fix">→ ${esc(q.p[l.i][2])}</span>`:''}</span>${p?`<span class="tag" style="background:${PAIRC[k%PAIRC.length]}">${k+1}</span>`:''}</button>`}).join('');
    colR.innerHTML=right.map((r,k)=>{const li=Object.keys(pair).find(x=>pair[x]===r.i);const lk=li!==undefined?left.findIndex(x=>x.i===+li):-1;const cls=checked&&li!==undefined?(+li===r.i?'ok':'no'):'';
      return `<button type="button" class="mi ${cls}" id="mr-${k}" data-r="${r.i}" ${checked?'disabled':''}><span class="tx">${esc(r.t)}</span>${lk>=0?`<span class="tag" style="background:${PAIRC[lk%PAIRC.length]}">${lk+1}</span>`:''}</button>`}).join('');
    colL.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const li=+b.dataset.l;if(pair[li]!==undefined){delete pair[li];sel=li}else sel=(sel===li?null:li);draw()});
    colR.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ri=+b.dataset.r;const owner=Object.keys(pair).find(x=>pair[x]===ri);
      if(sel===null){if(owner!==undefined){delete pair[owner];draw()}return}
      if(owner!==undefined)delete pair[owner];pair[sel]=ri;sel=null;draw()});
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=Object.keys(pair).length<q.p.length;
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    checked=true;let got=0;
    q.p.forEach((p,i)=>{if(pair[i]===i)got++;else S.miss.push({q:'Match: '+p[1],your:q.p[pair[i]][2],right:p[2]})});
    S.score+=got;document.getElementById('pts').textContent=S.score;draw();
    const all=got===q.p.length;
    document.getElementById('fbx').innerHTML=`<div class="fb ${all?'ok':'no'}"><b>${all?'All matched!':got+' of '+q.p.length+' correct'}</b><span>${all?'Every pair is right. Great job!':'Check the green and red boxes. The red ones show the right meaning under the word.'}</span></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn next" id="nextBtn" type="button">${S.i+1<S.list.length?'Next':'See my score'}</button></div>`;
    const n=document.getElementById('nextBtn');n.onclick=()=>{S.i++;render()};n.focus({preventScroll:true});
  };
}

function end(){
  const pct=Math.round(S.score/S.max*100);
  const st=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const msg=pct===100?'Perfect score! You are ready for the exam.':pct>=90?'Excellent! Almost perfect.':pct>=70?'Good work! Look at the review below and play again.':pct>=50?'Not bad. Read the review below, then try again.':'Keep practicing. Read the review below and play again.';
  app.innerHTML=`<section class="card pop">
    <span class="eyebrow">Your score</span>
    <div class="big-score">${S.score}<small> / ${S.max} points</small></div>
    <div class="stars">${[0,1,2].map(i=>star(i<st)).join('')}</div>
    <h2>${pct}% · ${msg}</h2>
    <div class="row"><button class="btn big" id="againBtn" type="button">Play again</button><button class="btn ghost" id="homeBtn" type="button">Back to start</button></div>
  </section>
  ${S.miss.length?`<section class="card"><h3>Let's review (${S.miss.length})</h3><ul class="review">${S.miss.map(m=>`<li><div class="q">${esc(m.q)}</div><div class="a">You chose: <s>${esc(m.your)}</s><br>Right answer: <em>${esc(m.right)}</em></div></li>`).join('')}</ul></section>`:''}`;
  document.getElementById('againBtn').onclick=start;
  document.getElementById('homeBtn').onclick=()=>{S.list=[];home()};
  window.scrollTo({top:0,behavior:'smooth'});
}

Quiz.watch(app);
home();
})();
</script>
</body></html>
