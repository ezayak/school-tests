<body>

<svg class="defs" aria-hidden="true"><defs>
  <marker id="ah-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker>
  <marker id="ah-ke" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ke"/></marker>
  <marker id="ah-pe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-pe"/></marker>
  <marker id="ah-heat" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-heat"/></marker>
  <marker id="ah-cool" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cool"/></marker>
  <marker id="ah-hl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-hl"/></marker>
</defs></svg>
<link rel="stylesheet" href="../../../landscape.css" data-landscape="1">

<script src="../../../shared/common.js"></script>

<script>
/* =====================================================================
   WORD LIST — to make a new spelling game, copy this file and change
   only this LIST block.
   item fields:
     w    : the word or sentence (exactly as it should be spelled)
     type : "word" (default) or "sentence"
     pic  : a drawing name from PICS below, OR
     img  : a picture file, e.g. "images/toad.png" (AI-generated pictures work great)
     emoji: a single emoji used as the picture
     tr   : translations shown under the picture, e.g. {uk:"…", ar:"…"}
   ===================================================================== */
const LIST={
  title:"Unit 1 · Week 3",
  heading:"Dictation:",
  subtitle:"Grade 4 English · Dictation",
  lang:"en-US",                      // voice language
  pattern:"Long e: e · ee · e_e · ie · ey · ea · y · ei",
  langs:{uk:"Українська",ar:"العربية"},
  items:[
    {w:"zebra",    pic:"zebra",    mark:[1,1], tr:{uk:"зебра",ar:"حمار وحشي"}},
    {w:"deed",     pic:"deed",     tr:{uk:"вчинок",ar:"فِعل"}},
    {w:"concrete", pic:"concrete", tr:{uk:"бетон",ar:"خرسانة"}},
    {w:"belief",   pic:"belief",   tr:{uk:"віра, переконання",ar:"اعتقاد"}},
    {w:"honey",    pic:"honey",    tr:{uk:"мед",ar:"عسل"}},
    {w:"breathe",  pic:"breathe",  tr:{uk:"дихати",ar:"يتنفّس"}},
    {w:"family",   pic:"family",   mark:[5,1], tr:{uk:"сім'я",ar:"عائلة"}},
    {w:"receive",  pic:"receive",  tr:{uk:"отримувати",ar:"يستلم"}},
    {w:"The zebra had a lot of stripes.", type:"sentence", key:"zebra", pic:"zebra2", tr:{uk:"У зебри було багато смужок.",ar:"كان للحمار الوحشي خطوط كثيرة."}},
    {w:"Are you sorry for that deed?", type:"sentence", key:"deed", pic:"deed", tr:{uk:"Ти шкодуєш про той вчинок?",ar:"هل أنت آسف على ذلك الفعل؟"}},
    {w:"The sidewalk is made of concrete.", type:"sentence", key:"concrete", pic:"sidewalk", tr:{uk:"Тротуар зроблений з бетону.",ar:"الرصيف مصنوع من الخرسانة."}},
    {w:"Kevin thinks it is beyond belief.", type:"sentence", key:"belief", pic:"wow", tr:{uk:"Кевін думає, що в це неможливо повірити.",ar:"يعتقد كيفن أن هذا لا يُصدَّق."}},
    {w:"Do you want honey in your tea?", type:"sentence", key:"honey", pic:"honeytea", tr:{uk:"Хочеш мед у чай?",ar:"هل تريد عسلًا في شايك؟"}},
    {w:"People can't breathe under water.", type:"sentence", key:"breathe", pic:"underwater", tr:{uk:"Люди не можуть дихати під водою.",ar:"لا يستطيع الناس التنفّس تحت الماء."}},
    {w:"Let's go home to your family.", type:"sentence", key:"family", pic:"home", tr:{uk:"Ходімо додому, до твоєї сім'ї.",ar:"لنذهب إلى البيت، إلى عائلتك."}},
    {w:"I was happy to receive a letter from my friend.", type:"sentence", key:"receive", pic:"letter", tr:{uk:"Я був радий отримати листа від друга.",ar:"كنت سعيدًا باستلام رسالة من صديقي."}},
  ]
};

(function(){
/* ---------- drawing helpers ---------- */
const em=(x,y,s,c,ex='')=>`<text class="emo" x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${ex}>${c}</text>`;
const tx=(x,y,t,c='lbl',a='middle')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="central">${t}</text>`;
const wv=(x,y,len,amp,per,c='wave',w=3)=>{let d=`M${x},${y}`;for(let t=1;t<=len;t+=2){d+=` L${x+t},${(y+amp*Math.sin(t/per*2*Math.PI)).toFixed(1)}`}return `<path class="st-${c}" d="${d}" stroke-width="${w}" stroke-linecap="round"/>`};
const ml=(x,y,d=1,c='ink')=>[0,1,2].map(i=>`<line class="st-${c}" x1="${x}" y1="${y-10+i*10}" x2="${x+d*(14+(i%2)*10)}" y2="${y-10+i*10}" stroke-width="3" stroke-linecap="round"/>`).join('');
const SKY='<rect class="f-sky" width="320" height="180"/>';
const G=(y=150,c='ground')=>`<rect class="f-${c}" y="${y}" width="320" height="${180-y}"/>`;
const bubble=(x,y,t,w=90)=>`<rect class="f-card" x="${x-w/2}" y="${y-18}" width="${w}" height="36" rx="16"/><rect class="st-ink" x="${x-w/2}" y="${y-18}" width="${w}" height="36" rx="16" stroke-width="2"/><path class="st-ink" d="M${x-10},${y+18} L${x-16},${y+30} L${x+4},${y+18}" stroke-width="2"/>${tx(x,y,t,'lbl-big')}`;

const PICS={
zebra:()=>SKY+G(150,'grass')+`${em(160,92,104,'🦓')}`,
zebra2:()=>SKY+G(140,'wheat')+`${em(110,96,90,'🦓')}${em(230,104,70,'🦓')}${em(270,36,32,'☀️')}`,
deed:()=>SKY+G(150,'wood')+`${em(220,96,80,'😳')}<path class="f-cool" d="M60,150 L76,118 L92,132 L104,108 L120,150Z"/><path class="f-cool" d="M126,150 L138,124 L150,140 L160,150Z"/>${em(96,80,30,'💥')}`,
concrete:()=>SKY+G(150)+`<rect class="f-metal" x="50" y="40" width="220" height="110" rx="4"/>${[...Array(26)].map((_,i)=>`<circle class="f-ink" cx="${62+(i*37)%200}" cy="${52+(i*23)%90}" r="${1.5+(i%3)}" opacity=".25"/>`).join('')}<path class="st-ink" d="M140,40 L150,70 L138,96 L152,130" stroke-width="2" opacity=".5"/>${em(286,130,34,'🏗️')}`,
belief:()=>SKY+G(150)+`${em(120,104,80,'🧒')}<ellipse class="f-card" cx="230" cy="54" rx="60" ry="36"/><ellipse class="st-ink" cx="230" cy="54" rx="60" ry="36" stroke-width="2"/><circle class="f-card" cx="172" cy="96" r="8"/><circle class="st-ink" cx="172" cy="96" r="8" stroke-width="2"/>${em(214,54,34,'⭐')}${em(250,54,30,'💖')}`,
honey:()=>SKY+G(150,'wood')+`${em(140,96,96,'🍯')}${em(240,56,40,'🐝')}${em(270,96,30,'🐝')}`,
breathe:()=>SKY+G(150)+`${em(110,96,90,'🧒')}${em(210,80,50,'🌬️')}<path class="st-cool" d="M150,90 C180,80 200,100 230,92" stroke-width="3"/>${em(270,110,40,'🫁')}`,
family:()=>SKY+G(150)+`${em(70,98,64,'👨')}${em(130,98,64,'👩')}${em(190,112,46,'👦')}${em(240,112,46,'👧')}${em(160,34,28,'❤️')}`,
receive:()=>SKY+G(150)+`${em(110,96,90,'📬')}${em(220,74,54,'✉️')}<path class="st-ke" d="M200,96 C180,116 160,116 146,104" stroke-width="3" marker-end="url(#ah-ke)"/>`,
sidewalk:()=>SKY+`<rect class="f-grass" y="90" width="320" height="30"/><rect class="f-metal" y="120" width="320" height="60"/>${[40,110,180,250].map(x=>`<line class="st-ink" x1="${x}" y1="120" x2="${x-14}" y2="180" stroke-width="2" opacity=".35"/>`).join('')}${em(150,100,56,'🚶')}${em(270,70,46,'🏠')}${em(50,70,40,'🌳')}`,
wow:()=>SKY+G(150)+`${em(110,98,92,'😲')}${em(220,72,56,'🤯')}${em(270,130,30,'✨')}${em(50,40,26,'✨')}`,
honeytea:()=>SKY+G(150,'wood')+`${em(110,100,80,'🍵')}${em(214,96,80,'🍯')}${em(258,46,30,'🐝')}`,
underwater:()=>`<rect class="f-water" width="320" height="180"/>${[...Array(7)].map((_,i)=>`<circle class="st-card" cx="${170+(i%3)*10}" cy="${70-i*9}" r="${3+i%3}" stroke-width="2"/>`).join('')}${em(150,106,80,'🤿')}${em(60,140,34,'🐠')}${em(270,60,34,'🐟')}${em(260,150,30,'🪸')}`,
home:()=>SKY+G(150)+`${em(230,92,96,'🏡')}${em(70,112,46,'🧒')}${em(118,112,46,'👧')}<path class="st-ke" d="M140,120 C160,120 170,110 178,104" stroke-width="3" marker-end="url(#ah-ke)"/>`,
letter:()=>SKY+G(150)+`${em(110,100,86,'😄')}${em(220,90,72,'💌')}${em(270,40,26,'✨')}`,
};
const drawPic=(it,cls='scene')=>{
  if(it.img)return `<div class="${cls}" role="img" aria-label="Picture"><img src="${esc(it.img)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  const inner=it.pic&&PICS[it.pic]?PICS[it.pic]():SKY+em(160,92,96,it.emoji||'❓');
  return `<div class="${cls}" role="img" aria-label="Picture"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">${inner}</svg></div>`};

/* ---------- utilities ---------- */
const app=document.getElementById('app');
const {esc,shuf,pick,star}=Kit;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const WORDS=LIST.items.filter(i=>i.type!=='sentence');
const SENTS=LIST.items.filter(i=>i.type==='sentence');
const bolt='<svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="#1B2440"/></svg>';
let trLang=store.get('sp-tr','off'); if(trLang!=='off'&&!(LIST.langs||{})[trLang])trLang='off';
let slow=store.get('sp-voice','normal')==='slow';

const trHTML=it=>{if(trLang==='off'||!it.tr||!it.tr[trLang])return '';const rtl=['ar','he','fa','ur'].includes(trLang);return `<div class="tr" dir="${rtl?'rtl':'ltr'}" lang="${trLang}">${esc(it.tr[trLang])}</div>`};

/* ---------- voice ---------- */
const TTS='speechSynthesis' in window;
let voice=null;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();const L=LIST.lang.toLowerCase(),P=L.split('-')[0];
  voice=vs.find(v=>v.lang.toLowerCase()===L&&v.localService)||vs.find(v=>v.lang.toLowerCase()===L)||vs.find(v=>v.lang.toLowerCase().startsWith(P))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,forceSlow){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LIST.lang;if(voice)u.voice=voice;u.rate=(forceSlow??slow)?0.55:0.9;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
const spoken=it=>it.type==='sentence'?it.w:it.w; // could add pauses later

/* ---------- long-vowel pattern highlight ---------- */
function marked(w,it){
  if(it&&it.mark){const [i,n]=it.mark;return esc(w.slice(0,i))+`<span class="m">${esc(w.slice(i,i+n))}</span>`+esc(w.slice(i+n))}
  const e=esc(w);
  if(/\s/.test(w))return e;
  let m;
  if((m=w.match(/eigh|oa|ow|ou|ai|ay|ey|ee|ea|ie|ei|igh|oe|ue|ew/)))return esc(w.slice(0,m.index))+`<span class="m">${esc(m[0])}</span>`+esc(w.slice(m.index+m[0].length));
  if(/^[a-z]*[aeiou][^aeiou]e$/i.test(w)){const i=w.length-3;return esc(w.slice(0,i))+`<span class="m">${esc(w[i])}</span>`+esc(w.slice(i+1,-1))+`<span class="m">e</span>`}
  if((m=w.match(/old|olt|ost|oll/)))return esc(w.slice(0,m.index))+`<span class="m">o</span>`+esc(w.slice(m.index+1));
  return e;
}

// underline the key word inside a sentence (item.key)
function keyed(it){if(!it.key)return esc(it.w);const i=it.w.toLowerCase().indexOf(it.key.toLowerCase());if(i<0)return esc(it.w);return esc(it.w.slice(0,i))+`<span class="m">${esc(it.w.slice(i,i+it.key.length))}</span>`+esc(it.w.slice(i+it.key.length))}

/* ---------- home ---------- */
const MODES=[
 {k:'learn',ic:'📇',t:'Learn',d:'Flash cards: picture with word, or picture only'},
 {k:'match',ic:'🧩',t:'Match',d:'Match each picture to its word'},
 {k:'listen',ic:'🎧',t:'Listen & spell',d:'Hear words and/or sentences, then type them'},
 {k:'build',ic:'🔤',t:'Build the word',d:'Put the letters in order: words or whole sentences'},
];
function home(){
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const langs=Object.entries(LIST.langs||{});
  app.innerHTML=`<section class="card pop">
    <div class="topbar"><div class="toplinks"><a class="back" href="../../../index.html">← All games</a><a class="back" href="index.html">English</a></div><span class="eyebrow">${esc(LIST.subtitle)}</span></div>
    <h1 class="hero-title"><span class="p">${esc(LIST.heading||"Spelling:")}</span> <span class="k">${esc(LIST.title)}</span></h1>
    <div class="thumbs">${WORDS.slice(0,10).map(it=>drawPic(it)).join('')}</div>
    <p class="howto">Ready? Pick a mode. ${LIST.pattern?`<span class="pat">${esc(LIST.pattern)}</span>`:''}</p>
    <div class="modes">${MODES.map(m=>`<button type="button" class="mode" id="mode-${m.k}" data-m="${m.k}"><span class="mi-ic">${m.ic}</span><b>${m.t}</b><small>${m.d}</small></button>`).join('')}</div>
    <div class="opts-row">
      ${langs.length?`<div class="og"><span class="lab">Translation</span><div class="seg" role="group" aria-label="Translation">${[['off','Off'],...langs].map(([k,n])=>`<button type="button" id="tr-${k}" data-tr="${k}" aria-pressed="${trLang===k}" title="${esc(n)}" aria-label="${esc(n)}">${k==='off'?'Off':esc(({uk:'UA'})[k]||k.toUpperCase())}</button>`).join('')}</div></div>`:''}
      <div class="og og-right"><span class="lab">Voice</span><div class="seg" role="group" aria-label="Voice speed"><button type="button" id="sp-norm" data-sp="0" aria-pressed="${!slow}">Normal</button><button type="button" id="sp-slow" data-sp="1" aria-pressed="${slow}">🐢 Slow</button></div></div>
    </div>
    ${TTS?'':'<p class="note">This browser cannot speak words aloud, so “Listen & spell” shows the picture instead.</p>'}
  </section>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
  app.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{trLang=b.dataset.tr;store.set('sp-tr',trLang);home()});
  app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{slow=b.dataset.sp==='1';store.set('sp-voice',slow?'slow':'normal');home()});
}

/* ---------- shared game state ---------- */
const S={mode:null,list:[],i:0,score:0,max:0,miss:[]};
const MODE_NAME={learn:'Learn',match:'Match',listen:'Listen & spell',build:'Build the word'};
function hud(label){
  const pct=Math.round(S.i/Math.max(1,S.list.length)*100);
  return `<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to modes">←</button><span class="qnum">${label}</span><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div>${S.mode==='learn'?'':`<span class="score" aria-label="Points">${bolt}<b id="pts">${S.score}</b></span>`}</div>`;
}
function bindHome(){const h=document.getElementById('homeBtn');if(h)h.onclick=home}
function startMode(m,opt){
  S.mode=m;S.i=0;S.score=0;S.miss=[];
  if(m==='learn'){S.list=LIST.items.slice();S.learnSet='all';S.showWord=store.get('sp-show','1')==='1';return learn()}
  if(m==='match'){const w=shuf(WORDS);S.list=[];for(let i=0;i<w.length;i+=5)S.list.push(w.slice(i,i+5));if(S.list.length>1&&S.list[S.list.length-1].length<3){const last=S.list.pop();S.list[S.list.length-1].push(...last)}S.max=WORDS.length;return match()}
  if(m==='listen'){if(SENTS.length&&!opt)return chooseKind('listen');const k=opt||'words';S.kind=k;S.list=k==='words'?shuf(WORDS):k==='sentences'?shuf(SENTS):shuf(WORDS).concat(shuf(SENTS));S.max=S.list.length;return listen()}
  if(m==='build'){if(SENTS.length&&!opt)return chooseKind('build');const k=opt||'words';S.kind=k;S.list=k==='words'?shuf(WORDS):k==='sentences'?shuf(SENTS):shuf(WORDS).concat(shuf(SENTS));S.max=S.list.length;return build()}
}
function chooseKind(m){
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const opts=[['words','🔤','Words',`${WORDS.length} words`],['sentences','📝','Sentences',`${SENTS.length} sentences`],['both','⭐','Both',`${WORDS.length+SENTS.length} in total`]];
  app.innerHTML=`<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to modes">←</button><span class="qnum">${esc(MODE_NAME[m])}</span></div>
  <section class="card pop">
    <p class="qtext">What do you want to practise?</p>
    <div class="modes">${opts.map(([k,ic,t,d])=>`<button type="button" class="mode" id="lsk-${k}" data-k="${k}"><span class="mi-ic">${ic}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>
  </section>`;
  bindHome();
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>startMode(m,b.dataset.k));
}
function next(){S.i++;if(S.i>=S.list.length)return end();({match,listen,build})[S.mode]()}
function fb(ok,html){return `<div class="fb ${ok?'ok':'no'}"><b>${ok?pick(['Correct!','Great job!','You got it!','Super!']):'Not quite.'}</b><span>${html}</span></div><div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn next" id="nextBtn" type="button">${S.i+1<S.list.length?'Next':'See my score'}</button></div>`}
function bindNext(){const n=document.getElementById('nextBtn');n.onclick=next;n.focus({preventScroll:true})}

/* ---------- LEARN ---------- */
function learn(){
  const set=S.learnSet==='words'?WORDS:S.learnSet==='sentences'?SENTS:LIST.items;
  if(S.i>=set.length)S.i=0; if(S.i<0)S.i=set.length-1;
  const it=set[S.i];S.list=set;S.revealed=false;
  const sent=it.type==='sentence';
  app.innerHTML=`${hud(`Card ${S.i+1} of ${set.length}`)}<section class="card pop fc">
    <div class="opts-row" style="justify-content:center">
      <div class="seg" role="group" aria-label="Cards">${[['all','All'],['words','Words'],['sentences','Sentences']].filter(([k])=>k!=='sentences'||SENTS.length).map(([k,n])=>`<button type="button" id="ls-${k}" data-ls="${k}" aria-pressed="${S.learnSet===k}">${n}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="Show word"><button type="button" id="sw-1" data-sw="1" aria-pressed="${S.showWord}">Picture + word</button><button type="button" id="sw-0" data-sw="0" aria-pressed="${!S.showWord}">Picture only</button></div>
    </div>
    ${drawPic(it)}
    ${trHTML(it)}
    <div id="wordBox">${S.showWord?`<div class="fc-word ${sent?'sent':''}">${sent?keyed(it):marked(it.w,it)}</div>`:`<button type="button" class="fc-hidden" id="reveal">Tap to see the ${sent?'sentence':'word'}</button>`}</div>
    <div class="audio"><button type="button" class="abtn" id="say1"><span class="e">🔊</span> Listen</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    <div class="nav"><button type="button" class="btn ghost" id="prevBtn">← Back</button><button type="button" class="btn" id="nextCard">Next →</button></div>
  </section>`;
  bindHome();
  app.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{S.learnSet=b.dataset.ls;S.i=0;learn()});
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{S.showWord=b.dataset.sw==='1';store.set('sp-show',S.showWord?'1':'0');learn()});
  const rv=document.getElementById('reveal');if(rv)rv.onclick=()=>{document.getElementById('wordBox').innerHTML=`<div class="fc-word ${sent?'sent':''}">${sent?keyed(it):marked(it.w,it)}</div>`;say(spoken(it),false)};
  document.getElementById('say1').onclick=()=>say(spoken(it),false);
  document.getElementById('say2').onclick=()=>say(spoken(it),true);
  document.getElementById('prevBtn').onclick=()=>{S.i--;learn()};
  document.getElementById('nextCard').onclick=()=>{S.i++;learn()};
}

/* ---------- MATCH (words only) ---------- */
const PAIRC=['var(--ke)','var(--pe)','var(--cool)','var(--heat)','var(--green)','var(--ink)'];
function match(){
  const round=S.list[S.i];
  const left=shuf(round.map((it,i)=>({i,it})));const right=shuf(round.map((it,i)=>({i,w:it.w})));
  const pair={};let sel=null,checked=false;
  app.innerHTML=`${hud(`Round ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mt">Match · ${round.length} points</span>
    <p class="qtext">Match each picture to its word.</p>
    <p class="hint">Tap a picture, then tap its word. Tap again to undo.</p>
    <div class="match"><div class="mcol" id="colL"></div><div class="mcol" id="colR"></div></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my matches</button></div></div>
  </section>`;
  bindHome();
  const colL=document.getElementById('colL'),colR=document.getElementById('colR');
  function draw(){
    colL.innerHTML=left.map((l,k)=>{const p=pair[l.i]!==undefined;const ok=checked&&pair[l.i]===l.i;const cls=checked?(ok?'ok':'no'):(sel===l.i?'sel':'');
      return `<button type="button" class="mi ${cls}" id="ml-${k}" data-l="${l.i}" ${checked?'disabled':''} aria-label="Picture ${k+1}"><span class="pic">${drawPic(l.it)}${trHTML(l.it)}${checked&&!ok?`<span class="fix">→ ${esc(l.it.w)}</span>`:''}</span>${p?`<span class="tag" style="background:${PAIRC[k%PAIRC.length]}">${k+1}</span>`:''}</button>`}).join('');
    colR.innerHTML=right.map((r,k)=>{const li=Object.keys(pair).find(x=>pair[x]===r.i);const lk=li!==undefined?left.findIndex(x=>x.i===+li):-1;const cls=checked&&li!==undefined?(+li===r.i?'ok':'no'):'';
      return `<button type="button" class="mi word ${cls}" id="mr-${k}" data-r="${r.i}" ${checked?'disabled':''}><span class="tx">${esc(r.w)}</span>${lk>=0?`<span class="tag" style="background:${PAIRC[lk%PAIRC.length]}">${lk+1}</span>`:''}</button>`}).join('');
    colL.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const li=+b.dataset.l;if(pair[li]!==undefined){delete pair[li];sel=li}else sel=(sel===li?null:li);draw()});
    colR.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ri=+b.dataset.r;const owner=Object.keys(pair).find(x=>pair[x]===ri);
      if(sel===null){if(owner!==undefined){delete pair[owner];draw()}else say(round[ri].w,false);return}
      if(owner!==undefined)delete pair[owner];pair[sel]=ri;sel=null;draw()});
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=Object.keys(pair).length<round.length;
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    checked=true;let got=0;
    round.forEach((it,i)=>{if(pair[i]===i)got++;else S.miss.push({q:'Picture of “'+it.w+'”',your:round[pair[i]].w,right:it.w})});
    S.score+=got;document.getElementById('pts').textContent=S.score;draw();
    document.getElementById('fbx').innerHTML=fb(got===round.length,got===round.length?'Every pair is right!':`${got} of ${round.length} correct. The red ones show the right word.`);bindNext();
  };
}

/* ---------- LISTEN & SPELL ---------- */
const norm=s=>s.trim().replace(/\s+/g,' ').replace(/[’‘]/g,"'");
const normLoose=s=>norm(s).toLowerCase().replace(/[.,!?;:"]/g,'').trim();
function diffHTML(typed,right){
  const a=typed,b=right;let out='';
  for(let i=0;i<b.length;i++){const ok=a[i]!==undefined&&a[i].toLowerCase()===b[i].toLowerCase();out+=`<span class="${ok?'ok':'bad'}">${esc(b[i])===' '?'&nbsp;':esc(b[i])}</span>`}
  return out;
}
function listen(){
  const it=S.list[S.i];const sent=it.type==='sentence';let hint=!TTS;
  app.innerHTML=`${hud(`${sent?'Sentence':'Word'} ${S.i+1} of ${S.list.length}`)}<section class="card pop fc">
    <span class="qtype dr">Listen & spell</span>
    <p class="qtext">${sent?'Listen and write the sentence.':'Listen and spell the word.'}</p>
    <div class="audio"><button type="button" class="abtn big" id="say1"><span class="e">🔊</span> Play</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    <div id="hintBox" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px">${hint?drawPic(it,'scene ls')+trHTML(it):''}</div>
    ${sent?'':`<div class="dots" aria-label="${it.w.length} letters">${'_ '.repeat(it.w.length).trim()}</div>`}
    <input class="spell-in" id="spell" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…" aria-label="Your spelling">
    <div class="row" style="justify-content:center;gap:10px">${hint?'':'<button type="button" class="btn ghost" id="hintBtn">🖼️ Show picture</button>'}<button type="button" class="btn" id="checkBtn">Check</button></div>
    <div id="fbx" style="width:100%;display:flex;flex-direction:column;gap:10px"></div>
  </section>`;
  bindHome();
  document.getElementById('say1').onclick=()=>say(spoken(it));
  document.getElementById('say2').onclick=()=>say(spoken(it),true);
  const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>{document.getElementById('hintBox').innerHTML=drawPic(it,'scene ls')+trHTML(it);hb.remove()};
  const inp=document.getElementById('spell');inp.focus({preventScroll:true});
  setTimeout(()=>say(spoken(it)),350);
  let done=false;
  const check=()=>{
    if(done)return;const v=inp.value;if(!v.trim()){inp.focus();return}
    done=true;inp.disabled=true;{const cb=document.getElementById('checkBtn');if(cb&&cb.parentElement)cb.parentElement.remove();const d=document.querySelector('.fc .dots');if(d)d.remove();}
    const strict=norm(v)===norm(it.w), loose=normLoose(v)===normLoose(it.w);
    const ok=sent?loose:strict||normLoose(v)===normLoose(it.w);
    if(ok)S.score++;else S.miss.push({q:(sent?'Sentence':'Word')+' (listen)',your:v,right:it.w});
    document.getElementById('pts').textContent=S.score;
    let tip='';if(ok&&sent&&!strict)tip=' Remember the capital letter at the start and the full stop at the end.';
    document.getElementById('fbx').innerHTML=(ok?'':`<div class="diff">${diffHTML(norm(v),it.w)}</div>`)+fb(ok,ok?`${esc(it.w)}${tip}`:`The correct spelling is <strong>${esc(it.w)}</strong>. Letters in red are the ones to fix.`);
    if(!ok||!hint)document.getElementById('hintBox').innerHTML=drawPic(it,'scene ls')+trHTML(it);
    const hb2=document.getElementById('hintBtn');if(hb2)hb2.remove();
    bindNext();
  };
  document.getElementById('checkBtn').onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
}

/* ---------- BUILD THE WORD (drag letters) ---------- */
function build(){
  const it=S.list[S.i];const sent=it.type==='sentence';
  const mix=w=>{let b=shuf(w.split('').map((t,i)=>({t,i})));for(let n=0;n<6&&w.length>1&&b.map(x=>x.t).join('')===w;n++)b=shuf(b);return b};
  // each word gets its own line and bank; trailing punctuation is fixed, not built
  const W=(sent?it.w.split(' '):[it.w]).map(c=>{const [,w,p]=sent?c.match(/^(.*?)([.,!?;:]*)$/):[0,c,''];return {w,p,line:[],bank:mix(w)}});
  let act=-1,line=[],bank=[];let done=false;
  const sel=a=>{act=a;line=W[a].line;bank=W[a].bank};
  if(!sent)sel(0);
  app.innerHTML=`${hud(`${sent?'Sentence':'Word'} ${S.i+1} of ${S.list.length}`)}<section class="card pop fc">
    <span class="qtype dr">Build the ${sent?'sentence':'word'}</span>
    ${drawPic(it,'scene small')}${trHTML(it)}
    <div class="audio"><button type="button" class="abtn" id="say1"><span class="e">🔊</span> Listen</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    ${sent?'<div class="sent-row" id="sent" aria-label="Sentence"></div>':''}
    <div class="slots" id="line" aria-label="Your word"></div>
    <div class="letters" id="bank" aria-label="Letters"></div>
    <p class="hint">${sent?'Tap a word in the sentence, then drag its letters onto the line, or tap them.':'Drag the letters onto the line, or tap them.'}</p>
    <div id="fbx" style="width:100%;display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:center"><button class="btn" id="checkBtn" type="button" disabled>Check my ${sent?'sentence':'word'}</button></div></div>
  </section>`;
  bindHome();
  document.getElementById('say1').onclick=()=>say(it.w,false);
  document.getElementById('say2').onclick=()=>say(it.w,true);
  const L=document.getElementById('line'),B=document.getElementById('bank'),SR=document.getElementById('sent');
  const built=x=>x.line.map(l=>l.t).join('');
  function draw(){
    if(sent){
      SR.innerHTML=W.map((x,k)=>`<span class="wgrp"><button type="button" class="wbox${k===act?' sel':''}${done?(built(x)===x.w?' ok':' no'):''}" id="wb-${k}" data-w="${k}" aria-label="Word ${k+1}, ${x.w.length} letters" aria-pressed="${k===act}" ${done?'disabled':''}>${x.w.split('').map((_,j)=>`<span>${x.line[j]?esc(x.line[j].t):''}</span>`).join('')}</button>${x.p?`<span class="punct">${esc(x.p)}</span>`:''}</span>`).join('');
      SR.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{sel(+b.dataset.w);say(W[act].w,false);draw()});
      L.style.display=B.style.display=done?'none':'';
    }
    L.innerHTML=line.length?line.map((w,k)=>`<button type="button" class="tile let" id="tl-${k}" data-from="line" data-k="${k}">${esc(w.t)}</button>`).join(''):`<span class="ph">${act<0?'Tap a word in the sentence':'Drop the letters here'}</span>`;
    B.innerHTML=bank.map((w,k)=>`<button type="button" class="tile let" id="tb-${k}" data-from="bank" data-k="${k}">${esc(w.t)}</button>`).join('');
    if(done){L.querySelectorAll('.tile').forEach(t=>t.disabled=true);return}
    document.querySelectorAll('#line .tile,#bank .tile').forEach(bindTile);
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=W.some(x=>x.bank.length);
  }
  function move(from,k,to,idx){const src=from==='line'?line:bank;const [w]=src.splice(k,1);const dst=to==='line'?line:bank;
    if(idx!=null&&from===to&&idx>k)idx--;if(idx==null||idx>dst.length)idx=dst.length;dst.splice(idx,0,w);draw()}
  function insertIndex(x,y){let idx=0;for(const t of L.querySelectorAll('.tile')){const r=t.getBoundingClientRect();if(y<r.top-4)break;if(y<=r.bottom+4&&x<r.left+r.width/2)break;idx++}return idx}
  function bindTile(el){
    el.onpointerdown=e=>{
      if(done)return;e.preventDefault();
      const from=el.dataset.from,k=+el.dataset.k,sx=e.clientX,sy=e.clientY;let ghost=null;const r=el.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const inLine=ev=>{const lr=L.getBoundingClientRect();return ev.clientX>=lr.left&&ev.clientX<=lr.right&&ev.clientY>=lr.top-10&&ev.clientY<=lr.bottom+10};
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=el.cloneNode(true);ghost.classList.add('drag');ghost.removeAttribute('id');document.body.appendChild(ghost);el.classList.add('ghost')}
        if(ghost){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';L.classList.toggle('over',inLine(ev))}};
      const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);L.classList.remove('over');
        if(!ghost){from==='bank'?move('bank',k,'line',null):move('line',k,'bank',null);return}
        ghost.remove();el.classList.remove('ghost');
        if(inLine(ev))move(from,k,'line',insertIndex(ev.clientX,ev.clientY));else if(from==='line')move('line',k,'bank',null);else draw()};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    };
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const from=el.dataset.from,k=+el.dataset.k;from==='bank'?move('bank',k,'line',null):move('line',k,'bank',null)}};
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    done=true;const mine=W.map(x=>built(x)+x.p).join(' ');const ok=mine===it.w;
    if(ok)S.score++;else S.miss.push({q:sent?'Build the sentence':'Build the word',your:mine,right:it.w});
    document.getElementById('pts').textContent=S.score;L.classList.add(ok?'ok':'no');draw();
    document.getElementById('fbx').innerHTML=fb(ok,ok?`<strong>${esc(it.w)}</strong>`:`The correct spelling is <strong>${esc(it.w)}</strong>${sent?'':'.'}`);
    if(ok)say(it.w,false);
    bindNext();
  };
}

/* ---------- END ---------- */
function end(){
  const pct=Math.round(S.score/Math.max(1,S.max)*100);const st=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const msg=pct===100?'Perfect spelling!':pct>=90?'Excellent!':pct>=70?'Good work! Practise the words below.':'Keep practising. Try the Learn cards, then play again.';
  app.innerHTML=`<section class="card pop">
    <span class="eyebrow">${MODE_NAME[S.mode]} · your score</span>
    <div class="big-score">${S.score}<small> / ${S.max} points</small></div>
    <div class="stars">${[0,1,2].map(i=>star(i<st)).join('')}</div>
    <h2>${pct}% · ${msg}</h2>
    <div class="row"><button class="btn big" id="againBtn" type="button">Play again</button><button class="btn ghost" id="modesBtn" type="button">Other modes</button></div>
  </section>
  ${S.miss.length?`<section class="card"><h3>Let's review (${S.miss.length})</h3><ul class="review">${S.miss.map(m=>`<li><div class="q">${esc(m.q)}</div><div class="a">You wrote: <s>${esc(m.your)}</s><br>Right spelling: <em>${esc(m.right)}</em></div></li>`).join('')}</ul></section>`:''}`;
  document.getElementById('againBtn').onclick=()=>startMode(S.mode,S.kind);
  document.getElementById('modesBtn').onclick=home;
  window.scrollTo({top:0,behavior:'smooth'});
}

home();
})();
</script>
