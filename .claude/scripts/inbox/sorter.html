<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School inbox</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inbox" />
    <!-- A tool page served by sorter.py, not part of the app: its styles stay here. -->
    <style>
      :root {
        --bg: #f4f3ef;
        --card: #fff;
        --soft: #fafaf8;
        --ink: #1b1b1a;
        --ink2: #3a3936;
        --muted: #5f5e5a;
        --line: #e2e0da;
        --line2: #efeeea;
        --field: #c9c6be;
        --accent: #1f4fd1;
        --accent-soft: #e8eefc;
        --use: #1e6b3a;
        --use-soft: #e3f2e7;
        --skip: #5f5e5a;
        --ans: #a85400;
        --other: #5b3fa8;
        --later: #6b4e00;
        --later-soft: #fff1c2;
        --fix: #8a4200;
        --fix-soft: #fdefd9;
        --fix-line: #f1d2a6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --card: #222327;
          --soft: #1c1d20;
          --ink: #e8e6e3;
          --ink2: #c9c7c3;
          --muted: #9aa0a6;
          --line: #3a3b40;
          --line2: #2e2f33;
          --field: #4a4b50;
          --accent: #7aa2ff;
          --accent-soft: #24304d;
          --use: #4ade80;
          --use-soft: #1d3326;
          --skip: #8b9097;
          --ans: #f59e4b;
          --other: #a78bfa;
          --later: #f5d36b;
          --later-soft: #3a3115;
          --fix: #f5a65b;
          --fix-soft: #3a2a17;
          --fix-line: #5c4123;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 24px;
        min-height: 56px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      #totals {
        flex: 1;
        color: var(--muted);
        font-size: 13px;
      }
      #saved {
        color: var(--use);
        font-size: 13px;
        font-weight: 600;
      }
      .wrap {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      nav {
        flex: 0 0 240px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .kid {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .kid h3 {
        margin: 0;
        padding: 0 8px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink2);
      }
      .kid h3 span {
        width: 26px;
        height: 26px;
        border-radius: 13px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      nav button {
        min-height: 52px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        border: 2px solid transparent;
        border-radius: 10px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button.on {
        background: var(--card);
        border-color: var(--accent);
      }
      nav small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      nav small.ok {
        color: var(--use);
        font-weight: 600;
      }
      nav small.fix {
        color: var(--fix);
        font-weight: 600;
      }
      .count {
        flex: none;
        min-width: 28px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        flex: 1;
        min-width: 0;
      }
      main > h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }
      .kid > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .banner,
      .back {
        display: none;
      }
      .notes {
        background: var(--card);
        border: 1px solid var(--fix-line);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .notes .top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        padding: 12px 20px;
        background: var(--fix-soft);
      }
      .notes h2 {
        flex: 1 0 auto;
        margin: 0;
        font-size: 15px;
      }
      .notes .top span {
        font-size: 13px;
        color: var(--fix);
      }
      .notes .list {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .note {
        display: flex;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }
      .note:has(input:checked) {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .note input {
        flex: none;
        width: 20px;
        height: 20px;
        min-height: 0;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      .note > span {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .note b {
        font-size: 16px;
      }
      .note time {
        margin-left: 10px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      .note .seen {
        padding: 5px 9px;
        border-radius: 6px;
        background: var(--bg);
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note a {
        align-self: flex-start;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
      }
      .notes .go {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px;
      }
      .notes .go label {
        flex: 1 1 260px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      /* Tablet and phone: two screens, the subject list (no #hash) and one subject (#subject-id) */
      @media (max-width: 1100px) {
        .wrap {
          padding: 20px;
        }
        body.list main,
        body.list #bar {
          display: none !important;
        }
        body:not(.list) nav {
          display: none;
        }
        nav {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          align-items: start;
          gap: 24px;
        }
        .kid {
          gap: 10px;
        }
        .kid h3 {
          padding: 0 4px;
        }
        .kid > div {
          gap: 0;
          background: var(--card);
          border: 1px solid var(--line);
          border-radius: 12px;
          overflow: hidden;
        }
        .kid button {
          width: 100%;
          min-height: 68px;
          padding: 12px 16px;
          border: none;
          border-bottom: 1px solid var(--line2);
          border-radius: 0;
          font-size: 17px;
        }
        .kid button.on {
          border-color: var(--line2);
        }
        .kid button > span:first-child {
          flex: 1;
        }
        .kid button:last-child {
          border-bottom: none;
        }
        nav small {
          font-size: 14px;
        }
        .kid button::after {
          content: "›";
          color: var(--muted);
          font-size: 22px;
        }
        .banner {
          grid-column: 1 / -1;
          display: flex;
          align-items: center;
          gap: 14px;
          min-height: 64px;
          padding: 12px 18px;
          border-radius: 12px;
          border: 1px solid var(--fix-line);
          background: var(--fix-soft);
          color: var(--ink);
          font: inherit;
          text-align: left;
          cursor: pointer;
        }
        .banner b {
          display: block;
          font-size: 17px;
        }
        .banner small {
          color: var(--fix);
          font-size: 14px;
        }
        .banner::after {
          content: "Review ›";
          margin-left: auto;
          color: var(--fix);
          font-weight: 600;
        }
        .back {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 48px;
          height: 48px;
          margin-left: -12px;
          border: none;
          background: none;
          color: var(--ink);
          font-size: 30px;
          cursor: pointer;
        }
        main > h1 {
          display: flex;
          align-items: center;
          gap: 4px;
        }
      }
      @media (max-width: 760px) {
        header {
          padding: 10px 16px;
        }
        .wrap {
          padding: 12px 16px;
        }
        nav {
          grid-template-columns: 1fr;
        }
        .kid button {
          min-height: 60px;
          font-size: 16px;
        }
      }
      .file {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .file.skipped {
        opacity: 0.55;
      }
      .file .head {
        padding: 16px 20px;
      }
      .file .top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .file .top > div {
        flex: 1;
        min-width: 0;
      }
      .fold {
        flex: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        white-space: nowrap;
        cursor: pointer;
      }
      .file.folded .ticks,
      .file.folded .pages {
        display: none;
      }
      .file h2 {
        font-size: 16px;
        margin: 0 0 2px;
        overflow-wrap: anywhere;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .fields label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        font-weight: 400;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--field);
        border-radius: 8px;
        padding: 0 12px;
        min-height: 40px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        padding: 9px 12px;
        resize: vertical;
      }
      .fields textarea {
        min-height: 40px;
        height: 40px;
      }
      .ticks {
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: var(--soft);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
      }
      .ticks button {
        font: inherit;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .ticks .n-pick {
        color: var(--accent);
      }
      .ticks .n-keep {
        color: var(--later);
      }
      .pages {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
        gap: 14px;
        padding: 16px 20px 20px;
      }
      .page {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .page.picked {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .page .checks {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line2);
      }
      .page .checks .pick {
        min-height: 32px;
        margin: 0;
      }
      .page .checks .keep input {
        accent-color: var(--later);
      }
      .page .thumb {
        position: relative;
        padding: 8px;
      }
      .page img {
        display: block;
        width: 100%;
        height: 170px;
        object-fit: contain;
        cursor: zoom-in;
        background: #fff;
        border-radius: 4px;
      }
      .page[data-s="skip"] img {
        opacity: 0.35;
      }
      .tag {
        position: absolute;
        top: 12px;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
      }
      .tag.role {
        left: 12px;
        color: #fff;
        background: var(--use);
      }
      .page[data-s="skip"] .tag.role {
        background: var(--skip);
      }
      .page[data-s="answers"] .tag.role {
        background: var(--ans);
      }
      .page[data-s="other"] .tag.role {
        background: var(--other);
      }
      .tag.later {
        right: 12px;
        color: var(--later);
        background: var(--later-soft);
      }
      .page .n {
        padding: 0 10px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      .chips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 0 8px 8px;
      }
      .chips button {
        font: 600 12px system-ui;
        min-height: 36px;
        padding: 0 2px;
        white-space: nowrap;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink2);
        cursor: pointer;
      }
      .chips button.on {
        --c: var(--use);
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .chips button.on[data-v="skip"] {
        --c: var(--skip);
      }
      .chips button.on[data-v="answers"] {
        --c: var(--ans);
      }
      .chips button.on[data-v="other"] {
        --c: var(--other);
      }
      .page .extra {
        padding: 0 8px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .page .extra textarea {
        font-size: 13px;
        min-height: 36px;
      }
      .single {
        padding: 12px 20px 16px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row input {
        flex: 1 1 180px;
      }
      .btn.plain {
        border-color: var(--field);
        background: var(--card);
        color: var(--ink);
      }
      .empty {
        color: var(--muted);
        padding: 30px 0;
      }
      .pick {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 3px;
      }
      .pick input {
        width: 20px;
        height: 20px;
        min-height: 0;
        margin: 0;
        accent-color: var(--accent);
      }
      /* The build panel: on the right on a wide screen; on a tablet or phone a bar at the bottom opens it as a sheet */
      aside {
        flex: 0 0 340px;
        position: sticky;
        top: 72px;
        max-height: calc(100vh - 88px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      aside:empty {
        display: none;
      }
      .build,
      .recent {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .build {
        border: 2px solid var(--accent);
      }
      .build .over {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .build h2,
      .recent h2 {
        font-size: 18px;
        margin: 0;
      }
      .recent h2 {
        font-size: 15px;
      }
      .build .sum {
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--bg);
        font-size: 13px;
        font-weight: 600;
      }
      .build .sum small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .build label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      .modes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .modes button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        min-height: 40px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink2);
        cursor: pointer;
      }
      .modes button.on {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .build .btn {
        min-height: 44px;
        font-size: 15px;
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .sheet-head {
        display: none;
      }
      #bar,
      #shade {
        display: none;
      }
      @media (max-width: 1100px) {
        aside {
          display: none;
        }
        body.has-bar .wrap {
          padding-bottom: 110px;
        }
        body.has-bar #bar {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 3;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 12px 24px 20px;
          background: var(--card);
          border-top: 1px solid var(--line);
          box-shadow: 0 -6px 20px rgba(20, 20, 19, 0.08);
        }
        #bar div {
          flex: 1;
          min-width: 0;
          font-size: 16px;
          font-weight: 700;
        }
        #bar small {
          display: block;
          font-size: 13px;
          font-weight: 400;
          color: var(--muted);
        }
        #bar .btn {
          min-height: 52px;
          padding: 0 28px;
          border-radius: 26px;
          font-size: 16px;
        }
        body.open #shade {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 4;
          background: rgba(0, 0, 0, 0.4);
        }
        body.open aside {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          align-items: start;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          top: auto;
          z-index: 5;
          max-height: 85vh;
          padding: 0 24px 28px;
          background: var(--card);
          border-radius: 24px 24px 0 0;
        }
        body.open aside .build,
        body.open aside .recent {
          border: none;
          padding: 0;
        }
        .sheet-head {
          grid-column: 1 / -1;
          position: sticky;
          top: 0;
          z-index: 1;
          display: flex;
          justify-content: flex-end;
          padding: 10px 0 0;
          background: var(--card);
        }
        .sheet-head button {
          width: 48px;
          height: 48px;
          border: none;
          background: none;
          color: var(--ink);
          font-size: 24px;
          cursor: pointer;
        }
      }
      @media (max-width: 760px) {
        body.has-bar #bar {
          padding: 10px 16px 16px;
        }
        #bar .btn {
          padding: 0 20px;
        }
        body.open aside {
          padding: 0 16px 20px;
        }
      }
      .jobs {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
      }
      .jobs:empty::before {
        content: "No builds yet.";
        color: var(--muted);
      }
      .jobs .job {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .jobs .meta {
        margin: 0;
      }
      .jobs .job b {
        font-size: 14px;
      }
      .status {
        align-self: flex-start;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .status.pushed {
        background: var(--use-soft);
        color: var(--use);
      }
      .status.failed {
        background: var(--fix-soft);
        color: var(--fix);
      }
      .job {
        border-top: 1px solid var(--line);
        padding: 6px 0;
      }
      .job pre {
        margin: 4px 0 0;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 12px;
      }
      #big {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
      }
      #big img {
        max-width: 96vw;
        max-height: 96vh;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📥 School inbox</h1>
      <span id="totals"></span>
      <span id="saved"></span>
    </header>
    <div class="wrap">
      <nav id="nav"></nav>
      <main id="main"><p class="empty">Loading…</p></main>
      <aside id="side" aria-label="Build lesson"></aside>
    </div>
    <div id="bar">
      <div><span id="bar-n"></span><small id="bar-k"></small></div>
      <button class="btn" onclick="sheet(true)">Build lesson</button>
    </div>
    <div id="shade" onclick="sheet(false)"></div>
    <div id="big"><img alt="" /></div>
    <datalist id="targets"></datalist>
    <script>
      const KINDS = [
        ["", "What is it?"],
        ["lesson", "Lesson pages / slides"],
        ["classwork", "Classwork"],
        ["homework", "Homework"],
        ["test", "Test / quiz"],
        ["key", "Answer key / model answers"],
        ["video", "Video"],
        ["skip", "Skip: nothing to build"],
      ];
      const STATES = [
        ["", "Use"],
        ["skip", "Skip"],
        ["answers", "Answers"],
        ["other", "Other lesson"],
      ];
      let data = { subjects: [] };
      let current = null;
      const timers = {};
      const $ = (tag, attrs = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else if (k === "text") e.textContent = v;
          else e.setAttribute(k, v);
        }
        e.append(...kids);
        return e;
      };

      async function load() {
        const r = await fetch("/api/inbox");
        data = await r.json();
        route();
      }

      // #subject-id in the address: which subject is open. No hash on a tablet or phone: the subject list.
      function route() {
        const id = decodeURIComponent(location.hash.slice(1));
        document.body.classList.toggle("list", !id);
        sheet(false);
        if (data.subjects.some((s) => s.id === id)) current = id;
        if (!data.subjects.some((s) => s.id === current))
          current = data.subjects[0]?.id ?? null;
        render();
      }

      function openSubject(id) {
        if (location.hash.slice(1) === id) route();
        else location.hash = id;
        window.scrollTo(0, 0);
      }

      function save(file) {
        const f = findFile(file);
        clearTimeout(timers[file]);
        document.getElementById("saved").textContent = "…";
        timers[file] = setTimeout(async () => {
          const note = clean(f.note);
          await fetch("/api/note", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file, note }),
          });
          document.getElementById("saved").textContent = "Saved ✓";
        }, 500);
      }

      function clean(n) {
        const out = {};
        for (const k of ["target", "kind", "text"]) if (n[k]) out[k] = n[k];
        const pages = {};
        for (const [p, v] of Object.entries(n.pages || {})) {
          const pv = {};
          for (const k of ["s", "target", "text", "pick", "used", "keep"])
            if (v[k]) pv[k] = v[k];
          if (Object.keys(pv).length) pages[p] = pv;
        }
        if (Object.keys(pages).length) out.pages = pages;
        return out;
      }

      function findFile(file) {
        for (const s of data.subjects)
          for (const f of s.files) if (f.file === file) return f;
      }

      function render() {
        const nav = document.getElementById("nav");
        nav.replaceChildren();
        const kids = {};
        for (const s of data.subjects) {
          if (!kids[s.kid]) {
            kids[s.kid] = $("div");
            nav.append(
              $(
                "div",
                { class: "kid" },
                $(
                  "h3",
                  {},
                  $("span", { text: s.kid.charAt(0) }),
                  $("b", { text: s.kid }),
                ),
                kids[s.kid],
              ),
            );
          }
          const sorted = s.files.filter(
            (f) => f.note.kind || f.note.target,
          ).length;
          // One line under the subject name: what to do next there
          const state = s.reviews.length
            ? [`${s.reviews.length} to fix`, "fix"]
            : s.ready
              ? ["Ready to build", "ok"]
              : s.files.some((f) => !f.pictures.length && f.ext === "pdf")
                ? ["Needs page pictures", ""]
                : sorted
                  ? [`${sorted} of ${s.files.length} sorted`, ""]
                  : ["Not sorted yet", ""];
          if (s.reviews.length && sorted) state[0] += ` · ${sorted} sorted`;
          kids[s.kid].append(
            $(
              "button",
              {
                class: s.id === current ? "on" : "",
                onclick: () => openSubject(s.id),
              },
              $(
                "span",
                {},
                s.name,
                $("small", { class: state[1], text: state[0] }),
              ),
              s.files.length
                ? $("span", { class: "count", text: s.files.length })
                : "",
            ),
          );
        }
        // Tablet / phone list: a banner on top for the review notes
        const withNotes = data.subjects.filter((x) => x.reviews.length);
        if (withNotes.length) {
          const n = withNotes.reduce((a, x) => a + x.reviews.length, 0);
          nav.prepend(
            $(
              "button",
              { class: "banner", onclick: () => openSubject(withNotes[0].id) },
              $(
                "span",
                {},
                $("b", { text: `✎ ${n} note${n === 1 ? "" : "s"} to fix` }),
                $("small", {
                  text: withNotes.map((x) => `${x.kid} · ${x.name}`).join(", "),
                }),
              ),
            ),
          );
        }
        const all = (k) => data.subjects.reduce((n, s) => n + s[k].length, 0);
        document.getElementById("totals").textContent = [
          `${all("files")} new files`,
          all("reviews") && `${all("reviews")} to fix`,
        ]
          .filter(Boolean)
          .join(" · ");
        const main = document.getElementById("main");
        main.replaceChildren();
        const s = data.subjects.find((x) => x.id === current);
        if (s)
          main.append(
            $(
              "h1",
              {},
              $("button", {
                class: "back",
                "aria-label": "Back to subjects",
                text: "‹",
                onclick: () => (location.hash = ""),
              }),
              `${s.kid} · ${s.name}`,
            ),
          );
        if (data.otherReviews.length)
          main.append(
            $("p", {
              class: "meta",
              text: `✎ ${data.otherReviews.length} review note(s) on pages of no subject here (${[...new Set(data.otherReviews.map((x) => x.page))].join(", ")}): fix them in a Claude session («fix review notes»).`,
            }),
          );
        if (!s) {
          main.append($("p", { class: "empty", text: "No new files. 🎉" }));
          document.getElementById("side").replaceChildren();
          document.body.classList.remove("has-bar", "open");
          return;
        }
        if (s.reviews.length) main.append(reviewCard(s));
        const targets = new Set();
        for (const f of s.files) {
          f.hints.forEach((h) => targets.add(h));
          if (f.note.target) targets.add(f.note.target);
        }
        document
          .getElementById("targets")
          .replaceChildren(
            ...[...targets].map((t) => $("option", { value: t })),
          );
        if (s.files.some((f) => !f.pictures.length)) {
          const busy = s.preparing === "running";
          const btn = $("button", {
            class: "btn",
            text: busy ? "Preparing… (pages and OCR)" : "Prepare page pictures",
            onclick: async () => {
              btn.disabled = true;
              btn.textContent = "Preparing… (pages and OCR)";
              await fetch("/api/prep", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subject: s.id }),
              });
              poll();
            },
          });
          btn.disabled = busy;
          const err =
            s.preparing && s.preparing.startsWith("error")
              ? " " + s.preparing
              : "";
          main.append($("p", {}, btn, err));
        }
        for (const f of s.files) main.append(fileCard(f));
        const side = document.getElementById("side");
        side.replaceChildren();
        document.body.classList.toggle("has-bar", !!s.files.length);
        if (!s.files.length) sheet(false);
        if (s.files.length) side.append(...buildBar(s));
        else main.append(recentCard(s)); // Only review notes: no build panel, but the jobs (the fixes) still show
      }

      // The review notes written in the app (review mode) on this subject's pages; «Fix notes» runs build.py on the ticked ones.
      const APP = "https://ezayak.github.io/school-tests/"; // the app, where the notes' pages are
      const fixPicks = {}; // note id -> ticked (all ticked at first), kept while the page is open
      function reviewCard(s) {
        const btn = $("button", { class: "btn" });
        const picked = () => s.reviews.filter((x) => fixPicks[x.id] !== false);
        const label = () => {
          const n = picked().length;
          btn.textContent = `🛠 Fix ${n} note${n === 1 ? "" : "s"}`;
          btn.disabled = !n;
        };
        const text = $("input", {
          type: "text",
          placeholder: "e.g. same fix for every reading game",
        });
        const list = s.reviews.map((x) => {
          const tick = $("input", {
            type: "checkbox",
            onchange: (e) => {
              fixPicks[x.id] = e.target.checked;
              label();
            },
          });
          tick.checked = fixPicks[x.id] !== false;
          return $(
            "label",
            { class: "note" },
            tick,
            $(
              "span",
              {},
              $(
                "span",
                {},
                $("b", { text: x.title || x.page, dir: "auto" }),
                $("time", { text: x.at }),
              ),
              x.item
                ? $("span", {
                    class: "seen",
                    text: "Seen on: " + x.item,
                    dir: "auto",
                  })
                : "",
              $("span", { text: x.text, dir: "auto" }),
              $("a", {
                href: APP + x.page,
                target: "_blank",
                rel: "noopener",
                text: "Open the lesson",
              }),
            ),
          );
        });
        btn.onclick = async () => {
          const ids = picked().map((x) => x.id);
          if (
            !confirm(
              `Fix ${ids.length} note(s)?\nClaude fixes them, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/fix", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ids, text: text.value }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else text.value = "";
          label();
          loadJobs(s.id);
        };
        label();
        return $(
          "section",
          { class: "notes" },
          $(
            "div",
            { class: "top" },
            $("h2", { text: "✎ Notes to fix" }),
            $("span", { text: "Tick the notes Claude should fix now" }),
          ),
          $(
            "div",
            { class: "list" },
            ...list,
            $(
              "div",
              { class: "go" },
              $(
                "label",
                {},
                "What to do (optional, for all ticked notes)",
                text,
              ),
              btn,
            ),
          ),
        );
      }

      // The «Create / Update lesson» bar: what to build, sent to /api/build; build.py runs it.
      const builds = {}; // subject id -> {mode, target, text}, kept while the page is open
      let countLine = null;
      let jobsBox = null;

      function ticked(s) {
        let pages = 0;
        let files = 0;
        let kept = 0;
        for (const f of s.files) {
          const ps = Object.values(f.note.pages || {});
          const n = ps.filter((p) => p.pick).length;
          pages += n;
          if (n) files++;
          kept += ps.filter((p) => p.keep).length;
        }
        return { pages, files, kept };
      }

      function updateBuild() {
        const s = data.subjects.find((x) => x.id === current);
        if (!s || !countLine) return;
        const t = ticked(s);
        countLine.replaceChildren(
          t.pages
            ? `${t.pages} page${t.pages > 1 ? "s" : ""} ticked in ${t.files} file${t.files > 1 ? "s" : ""}: only these are used.`
            : "No page ticked: all new files of this subject are used (with your notes).",
          $("small", {
            text: t.kept
              ? `${t.kept} kept for later · notes are sent too`
              : "Notes are sent too",
          }),
        );
        document.getElementById("bar-n").textContent = t.pages
          ? `${t.pages} page${t.pages > 1 ? "s" : ""} ticked`
          : "No page ticked: all files";
        document.getElementById("bar-k").textContent = t.kept
          ? `${t.kept} kept for later`
          : `${s.kid} · ${s.name}`;
      }

      // The bottom sheet on a tablet or phone (the panel stays on the right on a wide screen)
      function sheet(open) {
        document.body.classList.toggle("open", open);
      }

      function buildBar(s) {
        const b =
          builds[s.id] ||
          (builds[s.id] = { mode: "new", target: "", text: "" });
        const btn = $("button", { class: "btn" });
        const label = () => {
          btn.textContent =
            b.mode === "new" ? "🛠 Create lesson" : "🛠 Update lesson";
          btn.disabled = !b.target.trim();
        };
        const modes = $("div", { class: "modes" });
        for (const [v, t] of [
          ["new", "New lesson"],
          ["update", "Update a lesson"],
        ]) {
          modes.append(
            $("button", {
              type: "button",
              "data-v": v,
              class: b.mode === v ? "on" : "",
              "aria-pressed": b.mode === v,
              text: t,
              onclick: () => {
                b.mode = v;
                modes.querySelectorAll("button").forEach((m) => {
                  m.classList.toggle("on", m.dataset.v === v);
                  m.setAttribute("aria-pressed", m.dataset.v === v);
                });
                label();
              },
            }),
          );
        }
        const target = $("input", {
          list: "targets",
          placeholder: "e.g. Lesson 4-3, الدرس 5",
          value: b.target,
          oninput: (e) => {
            b.target = e.target.value;
            label();
          },
        });
        const text = $("textarea", {
          rows: 3,
          placeholder: "e.g. only the story and the words, exercises next time",
          oninput: (e) => (b.text = e.target.value),
        });
        text.value = b.text;
        btn.onclick = async () => {
          const t = ticked(s);
          const what = t.pages ? `${t.pages} ticked pages` : "all new files";
          const verb = b.mode === "new" ? "Create" : "Update";
          if (
            !confirm(
              `${verb} "${b.target}" from ${what}?\nClaude builds it, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/build", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ...b }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else {
            b.text = "";
            text.value = "";
          }
          label();
          loadJobs(s.id);
        };
        label();
        countLine = $("div", { class: "sum" });
        const card = $(
          "section",
          { class: "build" },
          $(
            "div",
            {},
            $("div", { class: "over", text: "Build" }),
            $("h2", { text: `${s.kid} · ${s.name}` }),
          ),
          countLine,
          $("label", {}, "Where should it go?", modes),
          $("label", {}, "Which lesson", target),
          $("label", {}, "What to do (optional)", text),
          btn,
          $("div", {
            class: "hint",
            text: 'Fill in "Which lesson" to start. You can keep sorting while it builds.',
          }),
        );
        updateBuild();
        const head = $(
          "div",
          { class: "sheet-head" },
          $("button", {
            type: "button",
            "aria-label": "Close",
            text: "✕",
            onclick: () => sheet(false),
          }),
        );
        return [head, card, recentCard(s)];
      }

      // Recent builds and fixes of this subject (build.py's jobs), refreshed while one runs
      function recentCard(s) {
        jobsBox = $("div", { class: "jobs" });
        loadJobs(s.id);
        return $(
          "section",
          { class: "recent" },
          $("h2", { text: "Recent builds" }),
          jobsBox,
        );
      }

      const STATUS = {
        queued: "⏳ Waiting",
        running: "🛠 Building",
        checking: "🔍 Checking",
        pushed: "Live",
        failed: "Failed",
      };
      let jobsTimer = null;

      async function loadJobs(subject) {
        clearTimeout(jobsTimer);
        const r = await fetch("/api/jobs/" + encodeURIComponent(subject));
        const { jobs } = await r.json();
        if (subject !== current || !jobsBox) return;
        jobsBox.replaceChildren(
          ...jobs.map((j) => {
            const kind = { new: "New", update: "Update", fix: "Fix" }[j.mode];
            const box = $(
              "div",
              { class: "job" },
              $(
                "div",
                { class: "meta" },
                $("span", {
                  class: "status " + j.status,
                  text: STATUS[j.status] || j.status,
                }),
                ` ${kind} · ${j.created}`,
              ),
              $("b", { text: j.target, dir: "auto" }),
            );
            if (j.result) box.append($("div", { text: j.result, dir: "auto" }));
            if (j.tail.length && j.status !== "pushed")
              box.append($("pre", { text: j.tail.join("\n") }));
            return box;
          }),
        );
        if (jobs.some((j) => !["pushed", "failed"].includes(j.status)))
          jobsTimer = setTimeout(() => loadJobs(subject), 5000);
      }

      const unfolded = new Set(); // files whose pages show; every file starts folded
      function fileCard(f) {
        f.note.pages = f.note.pages || {};
        const name = f.file.split("/").pop();
        const card = $("section", {
          class:
            "file" +
            (f.note.kind === "skip" ? " skipped" : "") +
            (f.pictures.length && !unfolded.has(f.file) ? " folded" : ""),
        });
        // Fold / unfold the page pictures (the file's information stays)
        const fold = $("button", {
          type: "button",
          class: "fold",
          onclick: () => {
            if (unfolded.has(f.file)) unfolded.delete(f.file);
            else unfolded.add(f.file);
            card.classList.toggle("folded", !unfolded.has(f.file));
            foldLabel();
          },
        });
        const foldLabel = () => {
          const open = unfolded.has(f.file);
          const n = f.pictures.length;
          const ticked = Object.values(f.note.pages).filter(
            (p) => p.pick,
          ).length;
          fold.textContent = open
            ? "Hide pages ▴"
            : `Show ${n} page${n === 1 ? "" : "s"}${ticked ? ` · ${ticked} ticked` : ""} ▾`;
          fold.setAttribute("aria-expanded", open);
        };
        const meta = [
          f.date,
          f.kind,
          f.pages ? f.pages + " p." : "",
          ...f.hints,
        ]
          .filter(Boolean)
          .join(" · ");
        const kind = $("select", {
          onchange: (e) => {
            f.note.kind = e.target.value;
            card.classList.toggle("skipped", f.note.kind === "skip");
            save(f.file);
          },
        });
        for (const [v, t] of KINDS) {
          const o = $("option", { value: v, text: t });
          if ((f.note.kind || "") === v) o.selected = true;
          kind.append(o);
        }
        const target = $("input", {
          list: "targets",
          placeholder: "e.g. Lesson 4-3, Unit 2 Week 5",
          value: f.note.target || "",
          oninput: (e) => {
            f.note.target = e.target.value;
            save(f.file);
          },
        });
        const text = $("textarea", {
          placeholder: "What the teacher said, words you can read…",
          oninput: (e) => {
            f.note.text = e.target.value;
            save(f.file);
          },
        });
        text.value = f.note.text || "";
        card.append(
          $(
            "div",
            { class: "head" },
            $(
              "div",
              { class: "top" },
              $(
                "div",
                {},
                $("h2", { text: name, dir: "auto" }),
                $("div", {
                  class: "meta",
                  text:
                    f.file.split("/").slice(0, -1).join(" / ") + " · " + meta,
                }),
              ),
              f.pictures.length ? fold : "",
            ),
            $(
              "div",
              { class: "fields" },
              $("label", {}, "Goes to", target),
              $("label", {}, "What is it?", kind),
              $("label", {}, "Note for Claude", text),
            ),
          ),
        );
        if (f.pictures.length) {
          const grid = $("div", { class: "pages" });
          // The bar above the pages: tick all / none and how many are ticked or kept
          const nPick = $("span", { class: "n-pick" });
          const nKeep = $("span", { class: "n-keep" });
          const recount = () => {
            const ps = Object.values(f.note.pages);
            nPick.textContent = `${ps.filter((p) => p.pick).length} for this lesson`;
            const k = ps.filter((p) => p.keep).length;
            nKeep.textContent = k ? `${k} kept for later` : "";
            foldLabel();
          };
          f.pictures.forEach((pic, i) =>
            grid.append(pageBox(f, pic, i + 1, recount)),
          );
          const tickAll = (on) => {
            f.pictures.forEach((_, i) => {
              const pn = f.note.pages[i + 1] || (f.note.pages[i + 1] = {});
              pn.pick = on;
            });
            save(f.file);
            render();
          };
          recount();
          card.append(
            $(
              "div",
              { class: "ticks" },
              f.pictures.length > 1
                ? $("button", {
                    text: "☑ Tick all",
                    onclick: () => tickAll(true),
                  })
                : "",
              f.pictures.length > 1
                ? $("button", {
                    text: "☐ Tick none",
                    onclick: () => tickAll(false),
                  })
                : "",
              nPick,
              nKeep,
            ),
            grid,
          );
        } else if (f.ext !== "pdf") {
          // A video or photo has no page pictures: one tick for the whole file (kept as page 1)
          const pn = f.note.pages[1] || (f.note.pages[1] = {});
          const tick = $("input", {
            type: "checkbox",
            onchange: (e) => {
              pn.pick = e.target.checked;
              save(f.file);
              updateBuild();
            },
          });
          tick.checked = !!pn.pick;
          card.append(
            $(
              "div",
              { class: "single" },
              $(
                "label",
                { class: "pick" },
                tick,
                pn.used ? `Use again (used: ${pn.used})` : "Use for the lesson",
              ),
            ),
          );
        }
        return card;
      }

      function pageBox(f, pic, n, recount) {
        const pn = f.note.pages[n] || (f.note.pages[n] = {});
        const box = $("div", {
          class: "page" + (pn.pick ? " picked" : ""),
          "data-s": pn.s || "",
        });
        const tick = $("input", {
          type: "checkbox",
          onchange: (e) => {
            pn.pick = e.target.checked;
            box.classList.toggle("picked", pn.pick);
            save(f.file);
            updateBuild();
            recount();
          },
        });
        tick.checked = !!pn.pick;
        const later = $("span", { class: "tag later", text: "Later" });
        later.hidden = !pn.keep;
        const keep = $("input", {
          type: "checkbox",
          onchange: (e) => {
            pn.keep = e.target.checked;
            later.hidden = !pn.keep;
            save(f.file);
            recount();
            updateBuild();
          },
        });
        keep.checked = !!pn.keep;
        box.append(
          $(
            "div",
            { class: "checks" },
            $(
              "label",
              { class: "pick" },
              tick,
              pn.used ? `Use again (used: ${pn.used})` : "Use for the lesson",
            ),
            $("label", { class: "pick keep" }, keep, "Keep for later"),
          ),
        );
        const role = $("span", { class: "tag role" });
        const showRole = () =>
          (role.textContent = STATES.find((x) => x[0] === (pn.s || ""))[1]);
        showRole();
        const extra = $("div", { class: "extra" });
        const drawExtra = () => {
          extra.replaceChildren();
          if (pn.s === "other")
            extra.append(
              $("input", {
                list: "targets",
                placeholder: "Which lesson?",
                value: pn.target || "",
                oninput: (e) => {
                  pn.target = e.target.value;
                  save(f.file);
                },
              }),
            );
          const t = $("textarea", {
            placeholder: "Note for this page",
            oninput: (e) => {
              pn.text = e.target.value;
              save(f.file);
            },
          });
          t.value = pn.text || "";
          extra.append(t);
        };
        const chips = $("div", { class: "chips" });
        for (const [v, t] of STATES) {
          chips.append(
            $("button", {
              class: (pn.s || "") === v ? "on" : "",
              "data-v": v,
              "aria-pressed": (pn.s || "") === v,
              text: t,
              onclick: () => {
                pn.s = v;
                box.dataset.s = v;
                chips.querySelectorAll("button").forEach((b, i) => {
                  b.classList.toggle("on", STATES[i][0] === v);
                  b.setAttribute("aria-pressed", STATES[i][0] === v);
                });
                showRole();
                drawExtra();
                save(f.file);
              },
            }),
          );
        }
        drawExtra();
        box.append(
          $(
            "div",
            { class: "thumb" },
            $("img", {
              src: "/img/" + pic.split("/").map(encodeURIComponent).join("/"),
              loading: "lazy",
              alt: "page " + n,
              onclick: (e) => {
                const big = document.getElementById("big");
                big.querySelector("img").src = e.target.src;
                big.style.display = "flex";
              },
            }),
            role,
            later,
          ),
          $("div", {
            class: "n",
            text: f.pictures.length > 1 ? "Page " + n : "",
          }),
          chips,
          extra,
        );
        return box;
      }

      async function poll() {
        await load();
        const s = data.subjects.find((x) => x.id === current);
        if (s && s.preparing === "running") setTimeout(poll, 3000);
      }

      window.addEventListener("hashchange", route);
      document.getElementById("big").onclick = (e) =>
        (e.currentTarget.style.display = "none");
      load();
    </script>
  </body>
</html>
