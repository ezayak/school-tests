<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School inbox</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inbox" />
    <!-- A tool page served by sorter.py, not part of the app: its styles stay here. -->
    <style>
      :root {
        --bg: #f4f3ef;
        --card: #fff;
        --soft: #fafaf8;
        --ink: #1b1b1a;
        --ink2: #3a3936;
        --muted: #5f5e5a;
        --line: #e2e0da;
        --line2: #efeeea;
        --field: #c9c6be;
        --accent: #1f4fd1;
        --accent-soft: #e8eefc;
        --use: #1e6b3a;
        --use-soft: #e3f2e7;
        --skip: #5f5e5a;
        --ans: #a85400;
        --other: #5b3fa8;
        --later: #6b4e00;
        --later-soft: #fff1c2;
        --fix: #8a4200;
        --fix-soft: #fdefd9;
        --fix-line: #f1d2a6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --card: #222327;
          --soft: #1c1d20;
          --ink: #e8e6e3;
          --ink2: #c9c7c3;
          --muted: #9aa0a6;
          --line: #3a3b40;
          --line2: #2e2f33;
          --field: #4a4b50;
          --accent: #7aa2ff;
          --accent-soft: #24304d;
          --use: #4ade80;
          --use-soft: #1d3326;
          --skip: #8b9097;
          --ans: #f59e4b;
          --other: #a78bfa;
          --later: #f5d36b;
          --later-soft: #3a3115;
          --fix: #f5a65b;
          --fix-soft: #3a2a17;
          --fix-line: #5c4123;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 24px;
        min-height: 56px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      #totals {
        flex: 1;
        color: var(--muted);
        font-size: 13px;
      }
      #saved {
        color: var(--use);
        font-size: 13px;
        font-weight: 600;
      }
      .wrap {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      nav {
        flex: 0 0 240px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .kid {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .kid h3 {
        margin: 0;
        padding: 0 8px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink2);
      }
      .kid h3 span {
        width: 26px;
        height: 26px;
        border-radius: 13px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      nav button {
        min-height: 52px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        border: 2px solid transparent;
        border-radius: 10px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button.on {
        background: var(--card);
        border-color: var(--accent);
      }
      nav small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      nav small.ok {
        color: var(--use);
        font-weight: 600;
      }
      nav small.fix {
        color: var(--fix);
        font-weight: 600;
      }
      .count {
        flex: none;
        min-width: 28px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        flex: 1;
        min-width: 0;
      }
      main > h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }
      @media (max-width: 760px) {
        header {
          padding: 10px 16px;
        }
        .wrap {
          flex-direction: column;
          padding: 12px 16px;
          gap: 16px;
        }
        nav {
          flex: none;
          align-self: stretch;
          flex-direction: row;
          gap: 12px;
          overflow-x: auto;
        }
        .kid {
          flex-direction: row;
          align-items: center;
        }
        .kid h3 {
          padding: 0;
        }
        .kid h3 b {
          display: none;
        }
        nav button {
          flex: 0 0 auto;
        }
      }
      .file {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .file.skipped {
        opacity: 0.55;
      }
      .file .head {
        padding: 16px 20px;
      }
      .file h2 {
        font-size: 16px;
        margin: 0 0 2px;
        overflow-wrap: anywhere;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .fields label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        font-weight: 400;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--field);
        border-radius: 8px;
        padding: 0 12px;
        min-height: 40px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        padding: 9px 12px;
        resize: vertical;
      }
      .fields textarea {
        min-height: 40px;
        height: 40px;
      }
      .ticks {
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: var(--soft);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
      }
      .ticks button {
        font: inherit;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .ticks .n-pick {
        color: var(--accent);
      }
      .ticks .n-keep {
        color: var(--later);
      }
      .pages {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
        gap: 14px;
        padding: 16px 20px 20px;
      }
      .page {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .page.picked {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .page .checks {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line2);
      }
      .page .checks .pick {
        min-height: 32px;
        margin: 0;
      }
      .page .checks .keep input {
        accent-color: var(--later);
      }
      .page .thumb {
        position: relative;
        padding: 8px;
      }
      .page img {
        display: block;
        width: 100%;
        height: 170px;
        object-fit: contain;
        cursor: zoom-in;
        background: #fff;
        border-radius: 4px;
      }
      .page[data-s="skip"] img {
        opacity: 0.35;
      }
      .tag {
        position: absolute;
        top: 12px;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
      }
      .tag.role {
        left: 12px;
        color: #fff;
        background: var(--use);
      }
      .page[data-s="skip"] .tag.role {
        background: var(--skip);
      }
      .page[data-s="answers"] .tag.role {
        background: var(--ans);
      }
      .page[data-s="other"] .tag.role {
        background: var(--other);
      }
      .tag.later {
        right: 12px;
        color: var(--later);
        background: var(--later-soft);
      }
      .page .n {
        padding: 0 10px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      .chips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 0 8px 8px;
      }
      .chips button {
        font: 600 12px system-ui;
        min-height: 36px;
        padding: 0 2px;
        white-space: nowrap;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink2);
        cursor: pointer;
      }
      .chips button.on {
        --c: var(--use);
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .chips button.on[data-v="skip"] {
        --c: var(--skip);
      }
      .chips button.on[data-v="answers"] {
        --c: var(--ans);
      }
      .chips button.on[data-v="other"] {
        --c: var(--other);
      }
      .page .extra {
        padding: 0 8px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .page .extra textarea {
        font-size: 13px;
        min-height: 36px;
      }
      .single {
        padding: 12px 20px 16px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row input {
        flex: 1 1 180px;
      }
      .pad {
        padding: 16px 20px;
      }
      .btn.plain {
        border-color: var(--field);
        background: var(--card);
        color: var(--ink);
      }
      .empty {
        color: var(--muted);
        padding: 30px 0;
      }
      .pick {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 3px;
      }
      .pick input {
        width: 20px;
        height: 20px;
        min-height: 0;
        margin: 0;
        accent-color: var(--accent);
      }
      .build {
        position: sticky;
        bottom: 0;
        z-index: 2;
        background: var(--card);
        border: 2px solid var(--accent);
        border-radius: 10px;
        padding: 12px;
        margin-top: 8px;
      }
      .build h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .build .btn:disabled {
        opacity: 0.5;
      }
      .jobs {
        margin-top: 10px;
        font-size: 13px;
      }
      .job {
        border-top: 1px solid var(--line);
        padding: 6px 0;
      }
      .job pre {
        margin: 4px 0 0;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 12px;
      }
      #big {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
      }
      #big img {
        max-width: 96vw;
        max-height: 96vh;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📥 School inbox</h1>
      <span id="totals"></span>
      <span id="saved"></span>
    </header>
    <div class="wrap">
      <nav id="nav"></nav>
      <main id="main"><p class="empty">Loading…</p></main>
    </div>
    <div id="big"><img alt="" /></div>
    <datalist id="targets"></datalist>
    <script>
      const KINDS = [
        ["", "What is it?"],
        ["lesson", "Lesson pages / slides"],
        ["classwork", "Classwork"],
        ["homework", "Homework"],
        ["test", "Test / quiz"],
        ["key", "Answer key / model answers"],
        ["video", "Video"],
        ["skip", "Skip: nothing to build"],
      ];
      const STATES = [
        ["", "Use"],
        ["skip", "Skip"],
        ["answers", "Answers"],
        ["other", "Other lesson"],
      ];
      let data = { subjects: [] };
      let current = null;
      const timers = {};
      const $ = (tag, attrs = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else if (k === "text") e.textContent = v;
          else e.setAttribute(k, v);
        }
        e.append(...kids);
        return e;
      };

      async function load() {
        const r = await fetch("/api/inbox");
        data = await r.json();
        if (!data.subjects.some((s) => s.id === current))
          current = data.subjects[0]?.id ?? null;
        render();
      }

      function save(file) {
        const f = findFile(file);
        clearTimeout(timers[file]);
        document.getElementById("saved").textContent = "…";
        timers[file] = setTimeout(async () => {
          const note = clean(f.note);
          await fetch("/api/note", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file, note }),
          });
          document.getElementById("saved").textContent = "Saved ✓";
        }, 500);
      }

      function clean(n) {
        const out = {};
        for (const k of ["target", "kind", "text"]) if (n[k]) out[k] = n[k];
        const pages = {};
        for (const [p, v] of Object.entries(n.pages || {})) {
          const pv = {};
          for (const k of ["s", "target", "text", "pick", "used", "keep"])
            if (v[k]) pv[k] = v[k];
          if (Object.keys(pv).length) pages[p] = pv;
        }
        if (Object.keys(pages).length) out.pages = pages;
        return out;
      }

      function findFile(file) {
        for (const s of data.subjects)
          for (const f of s.files) if (f.file === file) return f;
      }

      function render() {
        const nav = document.getElementById("nav");
        nav.replaceChildren();
        const kids = {};
        for (const s of data.subjects) {
          if (!kids[s.kid]) {
            kids[s.kid] = $(
              "div",
              { class: "kid" },
              $(
                "h3",
                {},
                $("span", { text: s.kid.charAt(0) }),
                $("b", { text: s.kid }),
              ),
            );
            nav.append(kids[s.kid]);
          }
          const sorted = s.files.filter(
            (f) => f.note.kind || f.note.target,
          ).length;
          // One line under the subject name: what to do next there
          const state = s.reviews.length
            ? [`${s.reviews.length} to fix`, "fix"]
            : s.ready
              ? ["Ready to build", "ok"]
              : s.files.some((f) => !f.pictures.length && f.ext === "pdf")
                ? ["Needs page pictures", ""]
                : sorted
                  ? [`${sorted} of ${s.files.length} sorted`, ""]
                  : ["Not sorted yet", ""];
          if (s.reviews.length && sorted) state[0] += ` · ${sorted} sorted`;
          kids[s.kid].append(
            $(
              "button",
              {
                class: s.id === current ? "on" : "",
                onclick: () => {
                  current = s.id;
                  render();
                },
              },
              $(
                "span",
                {},
                s.name,
                $("small", { class: state[1], text: state[0] }),
              ),
              s.files.length
                ? $("span", { class: "count", text: s.files.length })
                : "",
            ),
          );
        }
        const all = (k) => data.subjects.reduce((n, s) => n + s[k].length, 0);
        document.getElementById("totals").textContent = [
          `${all("files")} new files`,
          all("reviews") && `${all("reviews")} to fix`,
        ]
          .filter(Boolean)
          .join(" · ");
        const main = document.getElementById("main");
        main.replaceChildren();
        const s = data.subjects.find((x) => x.id === current);
        if (s) main.append($("h1", { text: `${s.kid} · ${s.name}` }));
        if (data.otherReviews.length)
          main.append(
            $("p", {
              class: "meta",
              text: `✎ ${data.otherReviews.length} review note(s) on pages of no subject here (${[...new Set(data.otherReviews.map((x) => x.page))].join(", ")}): fix them in a Claude session («fix review notes»).`,
            }),
          );
        if (!s) {
          main.append($("p", { class: "empty", text: "No new files. 🎉" }));
          return;
        }
        if (s.reviews.length) main.append(reviewCard(s));
        const targets = new Set();
        for (const f of s.files) {
          f.hints.forEach((h) => targets.add(h));
          if (f.note.target) targets.add(f.note.target);
        }
        document
          .getElementById("targets")
          .replaceChildren(
            ...[...targets].map((t) => $("option", { value: t })),
          );
        if (s.files.some((f) => !f.pictures.length)) {
          const busy = s.preparing === "running";
          const btn = $("button", {
            class: "btn",
            text: busy ? "Preparing… (pages and OCR)" : "Prepare page pictures",
            onclick: async () => {
              btn.disabled = true;
              btn.textContent = "Preparing… (pages and OCR)";
              await fetch("/api/prep", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subject: s.id }),
              });
              poll();
            },
          });
          btn.disabled = busy;
          const err =
            s.preparing && s.preparing.startsWith("error")
              ? " " + s.preparing
              : "";
          main.append($("p", {}, btn, err));
        }
        for (const f of s.files) main.append(fileCard(f));
        if (s.files.length) main.append(buildBar(s));
        else {
          // Only review notes: no build bar, but the jobs (the fixes) still show
          jobsBox = $("div", { class: "jobs" });
          main.append($("section", { class: "build" }, jobsBox));
          loadJobs(s.id);
        }
      }

      // The review notes written in the app (review mode) on this subject's pages; «Fix notes» runs build.py on the ticked ones.
      const fixPicks = {}; // note id -> ticked (all ticked at first), kept while the page is open
      function reviewCard(s) {
        const btn = $("button", { class: "btn" });
        const picked = () => s.reviews.filter((x) => fixPicks[x.id] !== false);
        const label = () => {
          const n = picked().length;
          btn.textContent = `🛠 Fix ${n} note${n === 1 ? "" : "s"}`;
          btn.disabled = !n;
        };
        const text = $("textarea", {
          placeholder: "What to do (optional), for all ticked notes",
        });
        const list = s.reviews.map((x) => {
          const tick = $("input", {
            type: "checkbox",
            onchange: (e) => {
              fixPicks[x.id] = e.target.checked;
              label();
            },
          });
          tick.checked = fixPicks[x.id] !== false;
          return $(
            "div",
            { class: "job" },
            $(
              "label",
              { class: "pick" },
              tick,
              `${x.title || x.page} · ${x.at}`,
            ),
            x.item
              ? $("div", {
                  class: "meta",
                  text: "On screen: " + x.item,
                  dir: "auto",
                })
              : "",
            $("div", { text: x.text, dir: "auto" }),
          );
        });
        btn.onclick = async () => {
          const ids = picked().map((x) => x.id);
          if (
            !confirm(
              `Fix ${ids.length} note(s)?\nClaude fixes them, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/fix", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ids, text: text.value }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else text.value = "";
          label();
          loadJobs(s.id);
        };
        label();
        return $(
          "section",
          { class: "file pad" },
          $("h2", { text: "✎ Review notes to fix" }),
          ...list,
          text,
          btn,
        );
      }

      // The «Create / Update lesson» bar: what to build, sent to /api/build; build.py runs it.
      const builds = {}; // subject id -> {mode, target, text}, kept while the page is open
      let countLine = null;
      let jobsBox = null;

      function ticked(s) {
        let pages = 0;
        let files = 0;
        for (const f of s.files) {
          const n = Object.values(f.note.pages || {}).filter(
            (p) => p.pick,
          ).length;
          pages += n;
          if (n) files++;
        }
        return { pages, files };
      }

      function updateBuild() {
        const s = data.subjects.find((x) => x.id === current);
        if (!s || !countLine) return;
        const t = ticked(s);
        countLine.textContent = t.pages
          ? `${t.pages} page${t.pages > 1 ? "s" : ""} ticked in ${t.files} file${t.files > 1 ? "s" : ""}: only these are used.`
          : "No page ticked: all new files of this subject are used (with your notes).";
      }

      function buildBar(s) {
        const b =
          builds[s.id] ||
          (builds[s.id] = { mode: "new", target: "", text: "" });
        const btn = $("button", { class: "btn" });
        const label = () => {
          btn.textContent =
            b.mode === "new" ? "🛠 Create lesson" : "🛠 Update lesson";
          btn.disabled = !b.target.trim();
        };
        const mode = $("select", {
          onchange: (e) => {
            b.mode = e.target.value;
            label();
          },
        });
        for (const [v, t] of [
          ["new", "New lesson"],
          ["update", "Update a lesson"],
        ]) {
          const o = $("option", { value: v, text: t });
          if (b.mode === v) o.selected = true;
          mode.append(o);
        }
        const target = $("input", {
          list: "targets",
          placeholder: "Which lesson (e.g. Lesson 4-3, الدرس 5)",
          value: b.target,
          oninput: (e) => {
            b.target = e.target.value;
            label();
          },
        });
        const text = $("textarea", {
          placeholder:
            "What to do (optional): e.g. only the story and the words, exercises next time",
          oninput: (e) => (b.text = e.target.value),
        });
        text.value = b.text;
        btn.onclick = async () => {
          const t = ticked(s);
          const what = t.pages ? `${t.pages} ticked pages` : "all new files";
          const verb = b.mode === "new" ? "Create" : "Update";
          if (
            !confirm(
              `${verb} "${b.target}" from ${what}?\nClaude builds it, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/build", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ...b }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else b.text = "";
          label();
          loadJobs(s.id);
        };
        label();
        countLine = $("div", { class: "meta" });
        jobsBox = $("div", { class: "jobs" });
        const bar = $(
          "section",
          { class: "build" },
          $("h2", { text: `Build ${s.kid} · ${s.name}` }),
          $("div", { class: "row" }, mode, target),
          text,
          countLine,
          btn,
          jobsBox,
        );
        updateBuild();
        loadJobs(s.id);
        return bar;
      }

      const STATUS = {
        queued: "⏳ waiting",
        running: "🛠 building",
        checking: "🔍 checking",
        pushed: "✅ live",
        failed: "❌ failed",
      };
      let jobsTimer = null;

      async function loadJobs(subject) {
        clearTimeout(jobsTimer);
        const r = await fetch("/api/jobs/" + encodeURIComponent(subject));
        const { jobs } = await r.json();
        if (subject !== current || !jobsBox) return;
        jobsBox.replaceChildren(
          ...jobs.map((j) => {
            const head = `${STATUS[j.status] || j.status} · ${{ new: "new", update: "update", fix: "fix" }[j.mode]} “${j.target}” · ${j.created}`;
            const box = $("div", { class: "job" }, $("div", { text: head }));
            if (j.result) box.append($("div", { text: j.result, dir: "auto" }));
            if (j.tail.length && j.status !== "pushed")
              box.append($("pre", { text: j.tail.join("\n") }));
            return box;
          }),
        );
        if (jobs.some((j) => !["pushed", "failed"].includes(j.status)))
          jobsTimer = setTimeout(() => loadJobs(subject), 5000);
      }

      function fileCard(f) {
        f.note.pages = f.note.pages || {};
        const name = f.file.split("/").pop();
        const card = $("section", {
          class: "file" + (f.note.kind === "skip" ? " skipped" : ""),
        });
        const meta = [
          f.date,
          f.kind,
          f.pages ? f.pages + " p." : "",
          ...f.hints,
        ]
          .filter(Boolean)
          .join(" · ");
        const kind = $("select", {
          onchange: (e) => {
            f.note.kind = e.target.value;
            card.classList.toggle("skipped", f.note.kind === "skip");
            save(f.file);
          },
        });
        for (const [v, t] of KINDS) {
          const o = $("option", { value: v, text: t });
          if ((f.note.kind || "") === v) o.selected = true;
          kind.append(o);
        }
        const target = $("input", {
          list: "targets",
          placeholder: "e.g. Lesson 4-3, Unit 2 Week 5",
          value: f.note.target || "",
          oninput: (e) => {
            f.note.target = e.target.value;
            save(f.file);
          },
        });
        const text = $("textarea", {
          placeholder: "What the teacher said, words you can read…",
          oninput: (e) => {
            f.note.text = e.target.value;
            save(f.file);
          },
        });
        text.value = f.note.text || "";
        card.append(
          $(
            "div",
            { class: "head" },
            $("h2", { text: name, dir: "auto" }),
            $("div", {
              class: "meta",
              text: f.file.split("/").slice(0, -1).join(" / ") + " · " + meta,
            }),
            $(
              "div",
              { class: "fields" },
              $("label", {}, "Goes to", target),
              $("label", {}, "What is it?", kind),
              $("label", {}, "Note for Claude", text),
            ),
          ),
        );
        if (f.pictures.length) {
          const grid = $("div", { class: "pages" });
          // The bar above the pages: tick all / none and how many are ticked or kept
          const nPick = $("span", { class: "n-pick" });
          const nKeep = $("span", { class: "n-keep" });
          const recount = () => {
            const ps = Object.values(f.note.pages);
            nPick.textContent = `${ps.filter((p) => p.pick).length} for this lesson`;
            const k = ps.filter((p) => p.keep).length;
            nKeep.textContent = k ? `${k} kept for later` : "";
          };
          f.pictures.forEach((pic, i) =>
            grid.append(pageBox(f, pic, i + 1, recount)),
          );
          const tickAll = (on) => {
            f.pictures.forEach((_, i) => {
              const pn = f.note.pages[i + 1] || (f.note.pages[i + 1] = {});
              pn.pick = on;
            });
            save(f.file);
            render();
          };
          recount();
          card.append(
            $(
              "div",
              { class: "ticks" },
              f.pictures.length > 1
                ? $("button", {
                    text: "☑ Tick all",
                    onclick: () => tickAll(true),
                  })
                : "",
              f.pictures.length > 1
                ? $("button", {
                    text: "☐ Tick none",
                    onclick: () => tickAll(false),
                  })
                : "",
              nPick,
              nKeep,
            ),
            grid,
          );
        } else if (f.ext !== "pdf") {
          // A video or photo has no page pictures: one tick for the whole file (kept as page 1)
          const pn = f.note.pages[1] || (f.note.pages[1] = {});
          const tick = $("input", {
            type: "checkbox",
            onchange: (e) => {
              pn.pick = e.target.checked;
              save(f.file);
              updateBuild();
            },
          });
          tick.checked = !!pn.pick;
          card.append(
            $(
              "div",
              { class: "single" },
              $(
                "label",
                { class: "pick" },
                tick,
                pn.used ? `Use again (used: ${pn.used})` : "Use for the lesson",
              ),
            ),
          );
        }
        return card;
      }

      function pageBox(f, pic, n, recount) {
        const pn = f.note.pages[n] || (f.note.pages[n] = {});
        const box = $("div", {
          class: "page" + (pn.pick ? " picked" : ""),
          "data-s": pn.s || "",
        });
        const tick = $("input", {
          type: "checkbox",
          onchange: (e) => {
            pn.pick = e.target.checked;
            box.classList.toggle("picked", pn.pick);
            save(f.file);
            updateBuild();
            recount();
          },
        });
        tick.checked = !!pn.pick;
        const later = $("span", { class: "tag later", text: "Later" });
        later.hidden = !pn.keep;
        const keep = $("input", {
          type: "checkbox",
          onchange: (e) => {
            pn.keep = e.target.checked;
            later.hidden = !pn.keep;
            save(f.file);
            recount();
          },
        });
        keep.checked = !!pn.keep;
        box.append(
          $(
            "div",
            { class: "checks" },
            $(
              "label",
              { class: "pick" },
              tick,
              pn.used ? `Use again (used: ${pn.used})` : "Use for the lesson",
            ),
            $("label", { class: "pick keep" }, keep, "Keep for later"),
          ),
        );
        const role = $("span", { class: "tag role" });
        const showRole = () =>
          (role.textContent = STATES.find((x) => x[0] === (pn.s || ""))[1]);
        showRole();
        const extra = $("div", { class: "extra" });
        const drawExtra = () => {
          extra.replaceChildren();
          if (pn.s === "other")
            extra.append(
              $("input", {
                list: "targets",
                placeholder: "Which lesson?",
                value: pn.target || "",
                oninput: (e) => {
                  pn.target = e.target.value;
                  save(f.file);
                },
              }),
            );
          const t = $("textarea", {
            placeholder: "Note for this page",
            oninput: (e) => {
              pn.text = e.target.value;
              save(f.file);
            },
          });
          t.value = pn.text || "";
          extra.append(t);
        };
        const chips = $("div", { class: "chips" });
        for (const [v, t] of STATES) {
          chips.append(
            $("button", {
              class: (pn.s || "") === v ? "on" : "",
              "data-v": v,
              "aria-pressed": (pn.s || "") === v,
              text: t,
              onclick: () => {
                pn.s = v;
                box.dataset.s = v;
                chips.querySelectorAll("button").forEach((b, i) => {
                  b.classList.toggle("on", STATES[i][0] === v);
                  b.setAttribute("aria-pressed", STATES[i][0] === v);
                });
                showRole();
                drawExtra();
                save(f.file);
              },
            }),
          );
        }
        drawExtra();
        box.append(
          $(
            "div",
            { class: "thumb" },
            $("img", {
              src: "/img/" + pic.split("/").map(encodeURIComponent).join("/"),
              loading: "lazy",
              alt: "page " + n,
              onclick: (e) => {
                const big = document.getElementById("big");
                big.querySelector("img").src = e.target.src;
                big.style.display = "flex";
              },
            }),
            role,
            later,
          ),
          $("div", {
            class: "n",
            text: f.pictures.length > 1 ? "Page " + n : "",
          }),
          chips,
          extra,
        );
        return box;
      }

      async function poll() {
        await load();
        const s = data.subjects.find((x) => x.id === current);
        if (s && s.preparing === "running") setTimeout(poll, 3000);
      }

      document.getElementById("big").onclick = (e) =>
        (e.currentTarget.style.display = "none");
      load();
    </script>
  </body>
</html>
