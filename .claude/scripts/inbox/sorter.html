<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School inbox</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inbox" />
    <!-- A tool page served by sorter.py, not part of the app: its styles stay here. -->
    <style>
      :root {
        --bg: #f4f3ef;
        --card: #fff;
        --soft: #fafaf8;
        --ink: #1b1b1a;
        --ink2: #3a3936;
        --muted: #5f5e5a;
        --line: #e2e0da;
        --line2: #efeeea;
        --field: #c9c6be;
        --accent: #1f4fd1;
        --accent-soft: #e8eefc;
        --use: #1e6b3a;
        --use-soft: #e3f2e7;
        --ans: #a85400;
        --later: #6b4e00;
        --later-soft: #fff1c2;
        --fix: #8a4200;
        --fix-soft: #fdefd9;
        --fix-line: #f1d2a6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --card: #222327;
          --soft: #1c1d20;
          --ink: #e8e6e3;
          --ink2: #c9c7c3;
          --muted: #9aa0a6;
          --line: #3a3b40;
          --line2: #2e2f33;
          --field: #4a4b50;
          --accent: #7aa2ff;
          --accent-soft: #24304d;
          --use: #4ade80;
          --use-soft: #1d3326;
          --ans: #f59e4b;
          --later: #f5d36b;
          --later-soft: #3a3115;
          --fix: #f5a65b;
          --fix-soft: #3a2a17;
          --fix-line: #5c4123;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 24px;
        min-height: 56px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      #totals {
        flex: 1;
        color: var(--muted);
        font-size: 13px;
      }
      #saved {
        color: var(--use);
        font-size: 13px;
        font-weight: 600;
      }
      .wrap {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      nav {
        flex: 0 0 240px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .kid {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .kid h3 {
        margin: 0;
        padding: 0 8px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink2);
      }
      .kid h3 span {
        width: 26px;
        height: 26px;
        border-radius: 13px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      nav button {
        min-height: 52px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        border: 2px solid transparent;
        border-radius: 10px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button.on {
        background: var(--card);
        border-color: var(--accent);
      }
      nav small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      nav small.ok {
        color: var(--use);
        font-weight: 600;
      }
      nav small.fix {
        color: var(--fix);
        font-weight: 600;
      }
      .count {
        flex: none;
        min-width: 28px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        flex: 1;
        min-width: 0;
      }
      main > h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }
      .kid > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .banner,
      .back {
        display: none;
      }
      .notes {
        background: var(--card);
        border: 1px solid var(--fix-line);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .notes .top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        padding: 12px 20px;
        background: var(--fix-soft);
      }
      .notes h2 {
        flex: 1 0 auto;
        margin: 0;
        font-size: 15px;
      }
      .notes .top span {
        font-size: 13px;
        color: var(--fix);
      }
      .notes .list {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .note {
        display: flex;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }
      .note:has(input:checked) {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .note input {
        flex: none;
        width: 20px;
        height: 20px;
        min-height: 0;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      .note > span {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .note b {
        font-size: 16px;
      }
      .note time {
        margin-left: 10px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      .note .seen {
        padding: 5px 9px;
        border-radius: 6px;
        background: var(--bg);
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note a {
        align-self: flex-start;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
      }
      .note .acts {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .note .decline {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .notes .go {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px;
      }
      .notes .go label {
        flex: 1 1 260px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      /* Tablet and phone: two screens, the subject list (no #hash) and one subject (#subject-id) */
      @media (max-width: 1100px) {
        .wrap {
          padding: 20px;
        }
        body.list main,
        body.list #bar {
          display: none !important;
        }
        body:not(.list) nav {
          display: none;
        }
        nav {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          align-items: start;
          gap: 24px;
        }
        .kid {
          gap: 10px;
        }
        .kid h3 {
          padding: 0 4px;
        }
        .kid > div {
          gap: 0;
          background: var(--card);
          border: 1px solid var(--line);
          border-radius: 12px;
          overflow: hidden;
        }
        .kid button {
          width: 100%;
          min-height: 68px;
          padding: 12px 16px;
          border: none;
          border-bottom: 1px solid var(--line2);
          border-radius: 0;
          font-size: 17px;
        }
        .kid button.on {
          border-color: var(--line2);
        }
        .kid button > span:first-child {
          flex: 1;
        }
        .kid button:last-child {
          border-bottom: none;
        }
        nav small {
          font-size: 14px;
        }
        .kid button::after {
          content: "›";
          color: var(--muted);
          font-size: 22px;
        }
        .banner {
          grid-column: 1 / -1;
          display: flex;
          align-items: center;
          gap: 14px;
          min-height: 64px;
          padding: 12px 18px;
          border-radius: 12px;
          border: 1px solid var(--fix-line);
          background: var(--fix-soft);
          color: var(--ink);
          font: inherit;
          text-align: left;
          cursor: pointer;
        }
        .banner b {
          display: block;
          font-size: 17px;
        }
        .banner small {
          color: var(--fix);
          font-size: 14px;
        }
        .banner::after {
          content: "Review ›";
          margin-left: auto;
          color: var(--fix);
          font-weight: 600;
        }
        .back {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 48px;
          height: 48px;
          margin-left: -12px;
          border: none;
          background: none;
          color: var(--ink);
          font-size: 30px;
          cursor: pointer;
        }
        main > h1 {
          display: flex;
          align-items: center;
          gap: 4px;
        }
      }
      @media (max-width: 760px) {
        header {
          padding: 10px 16px;
        }
        .wrap {
          padding: 12px 16px;
        }
        nav {
          grid-template-columns: 1fr;
        }
        .kid button {
          min-height: 60px;
          font-size: 16px;
        }
      }
      .file {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .file.skipped {
        opacity: 0.55;
      }
      .file .head {
        padding: 12px 20px 16px;
      }
      /* The file name on a coloured bar the width of the card, the fold button in the same row */
      .file .top {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 8px 12px 8px 20px;
        background: var(--accent-soft);
        border-bottom: 1px solid var(--line);
      }
      .fold {
        flex: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        white-space: nowrap;
        cursor: pointer;
      }
      .file.folded .ticks,
      .file.folded .pages {
        display: none;
      }
      .file h2 {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .fields label.wide {
        grid-column: 1 / -1;
      }
      .fields label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        font-weight: 400;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--field);
        border-radius: 8px;
        padding: 0 12px;
        min-height: 40px;
        min-width: 0;
      }
      textarea {
        width: 100%;
        padding: 9px 12px;
        resize: vertical;
      }
      .fields textarea {
        min-height: 40px;
        height: 40px;
      }
      .ticks {
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: var(--soft);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
      }
      .ticks button {
        font: inherit;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .ticks .n-pick {
        color: var(--accent);
      }
      .ticks .n-keep {
        color: var(--later);
      }
      .pages {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
        gap: 14px;
        padding: 16px 20px 20px;
      }
      .page {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .page.picked {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .page .thumb {
        position: relative;
        padding: 8px;
      }
      .page img {
        display: block;
        width: 100%;
        height: 170px;
        object-fit: contain;
        cursor: zoom-in;
        background: #fff;
        border-radius: 4px;
      }
      /* The tags on the picture: the same colours as the chips that are on */
      .tags {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        pointer-events: none;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: var(--c);
      }
      .tag[data-v="pick"],
      .chips button[data-v="pick"] {
        --c: var(--accent);
      }
      .tag[data-v="keep"],
      .chips button[data-v="keep"] {
        --c: var(--later);
      }
      .tag[data-v="answers"],
      .chips button[data-v="answers"] {
        --c: var(--ans);
      }
      .tag[data-v="keep"] {
        color: var(--later);
        background: var(--later-soft);
      }
      .page .n {
        padding: 0 10px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
      }
      .chips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 0 8px 8px;
      }
      .chips button {
        font: 600 12px system-ui;
        min-height: 36px;
        padding: 0 2px;
        white-space: nowrap;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink2);
        cursor: pointer;
      }
      .chips button[data-v="pick"] {
        grid-column: 1 / -1;
      }
      .chips button.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .chips button.on[data-v="keep"] {
        color: var(--later);
        background: var(--later-soft);
      }
      .single .chips {
        max-width: 260px;
        padding: 0;
      }
      .page .extra {
        padding: 0 8px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .page .extra textarea {
        font-size: 13px;
        min-height: 36px;
      }
      .single {
        padding: 12px 20px 16px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row input {
        flex: 1 1 180px;
      }
      .btn.plain {
        border-color: var(--field);
        background: var(--card);
        color: var(--ink);
      }
      .file-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .empty {
        color: var(--muted);
        padding: 30px 0;
      }
      /* «+ Add an old file»: a used file back into the subject's list */
      nav button.add-old {
        border: 1px dashed var(--field);
        margin-top: 8px;
      }
      #old {
        width: min(1100px, calc(100vw - 32px));
        height: min(88vh, 820px);
        padding: 16px;
        border: 0;
        border-radius: 12px;
        background: var(--card);
        color: var(--ink);
      }
      #old[open] {
        display: flex;
        flex-direction: column;
      }
      /* the preview on the left, the subject, search and list on the right; on a phone the preview on top */
      #old .cols {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 16px;
      }
      #old .pv,
      #old .choose {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #old .pv {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
        padding: 10px;
      }
      #old .pv .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      #old .pv .bar div {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      #old .pv .bar small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      #old .shots {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #old .shots img {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      #old .list button.on {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      @media (max-width: 760px) {
        #old .cols {
          grid-template-columns: 1fr;
          grid-template-rows: 45% 1fr;
        }
      }
      #old::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      #old .head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #old h2 {
        flex: 1;
        margin: 0;
        font-size: 18px;
      }
      #old select,
      #old input {
        width: 100%;
        margin-bottom: 8px;
      }
      #old .list {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: auto;
      }
      #old .list button {
        flex: none;
        display: block;
        min-height: 48px;
        padding: 6px 10px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      #old .list small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .tag-old {
        flex: none;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--later-soft);
        color: var(--later);
      }
      /* The build panel: on the right on a wide screen; on a tablet or phone a bar at the bottom opens it as a sheet */
      aside {
        flex: 0 0 340px;
        position: sticky;
        top: 72px;
        max-height: calc(100vh - 88px);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      aside:empty {
        display: none;
      }
      .build,
      .recent {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .build {
        flex: none;
        border: 2px solid var(--accent);
      }
      /* Recent builds scroll inside the card (its title and ⤢ stay on top) */
      .recent {
        min-height: 180px;
        overflow-y: auto;
      }
      main .recent {
        max-height: 70vh;
      }
      .recent .card-head {
        position: sticky;
        top: -18px;
        z-index: 1;
        margin: -18px -18px 0;
        padding: 18px 18px 8px;
        background: var(--card);
      }
      .build .over {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .build h2,
      .recent h2 {
        font-size: 18px;
        margin: 0;
      }
      .recent h2 {
        font-size: 15px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-head > :first-child {
        flex: 1;
        min-width: 0;
      }
      .expand,
      #big .close {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid var(--field);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .expand svg,
      #big .close svg {
        width: 20px;
        height: 20px;
      }
      /* A card of the build panel opened as a popup (⤢): almost the whole screen, over a dimmed page */
      body.full {
        overflow: hidden;
      }
      body.full #shade {
        display: block;
        position: fixed;
        inset: 0;

      @media (max-width: 760px) {

      .jobs {

    </style>
  </head>
  <body>
    <header>
      <h1>📥 School inbox</h1>
      <span id="totals"></span>
      <span id="saved"></span>
    </header>
    <div class="wrap">
      <nav id="nav"></nav>
      <main id="main"><p class="empty">Loading…</p></main>
      <aside id="side" aria-label="Build lesson"></aside>
    </div>
    <div id="bar">
      <div><span id="bar-n"></span><small id="bar-k"></small></div>
      <button class="btn" onclick="sheet(true)">Build lesson</button>
    </div>
    <div id="shade" onclick="full ? fullScreen('') : sheet(false)"></div>
    <div id="big" hidden role="dialog" aria-modal="true"></div>
    <dialog id="old"></dialog>
    <datalist id="targets"></datalist>
    <script>
      const KINDS = [
        ["", "What is it?"],
        ["lesson", "Lesson pages / slides"],
        ["classwork", "Classwork"],
        ["homework", "Homework"],
        ["test", "Test / quiz"],
        ["revision", "Revision / exam memo"],
        ["key", "Answer key / model answers"],
        ["video", "Video"],
        ["skip", "Skip: nothing to build"],
      ];
      // The chips under each page: [field in the note, chip, tag on the picture]
      const PAGE_CHIPS = [
        ["pick", "This lesson", "This lesson"],
        ["keep", "Later", "Later"],
        ["answers", "Answers", "Answers"],
      ];
      let data = { subjects: [] };
      let current = null;
      const timers = {};
      const $ = (tag, attrs = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else if (k === "text") e.textContent = v;
          else e.setAttribute(k, v);
        }
        e.append(...kids);
        return e;
      };

      async function load() {
        const r = await fetch("/api/inbox");
        data = await r.json();
        route();
      }

      // #subject-id in the address: which subject is open. No hash on a tablet or phone: the subject list.
      function route() {
        const id = decodeURIComponent(location.hash.slice(1));
        document.body.classList.toggle("list", !id);
        sheet(false);
        if (data.subjects.some((s) => s.id === id)) current = id;
        if (!data.subjects.some((s) => s.id === current))
          current = data.subjects[0]?.id ?? null;
        render();
      }

      function openSubject(id) {
        if (location.hash.slice(1) === id) route();
        else location.hash = id;
        window.scrollTo(0, 0);
      }

      function save(file) {
        const f = findFile(file);
        clearTimeout(timers[file]);
        document.getElementById("saved").textContent = "…";
        timers[file] = setTimeout(async () => {
          const note = clean(f.note);
          await fetch("/api/note", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file, note }),
          });
          document.getElementById("saved").textContent = "Saved ✓";
        }, 500);
      }

      function clean(n) {
        const out = {};
        for (const k of ["target", "kind", "text"]) if (n[k]) out[k] = n[k];
        const pages = {};
        for (const [p, v] of Object.entries(n.pages || {})) {
          const pv = {};
          for (const k of ["pick", "keep", "answers", "target", "text", "used"])
            if (v[k]) pv[k] = v[k];
          if (Object.keys(pv).length) pages[p] = pv;
        }
        if (Object.keys(pages).length) out.pages = pages;
        return out;
      }

      function findFile(file) {
        for (const s of data.subjects)
          for (const f of s.files) if (f.file === file) return f;
      }

      function render() {
        const nav = document.getElementById("nav");
        nav.replaceChildren();
        const kids = {};
        for (const s of data.subjects) {
          if (!kids[s.kid]) {
            kids[s.kid] = $("div");
            nav.append(
              $(
                "div",
                { class: "kid" },
                $(
                  "h3",
                  {},
                  $("span", { text: s.kid.charAt(0) }),
                  $("b", { text: s.kid }),
                ),
                kids[s.kid],
              ),
            );
          }
          const sorted = s.files.filter(
            (f) => f.note.kind || f.note.target,
          ).length;
          // One line under the subject name: what to do next there
          const state = s.reviews.length
            ? [`${s.reviews.length} to fix`, "fix"]
            : !s.files.length
              ? ["Nothing new · revision", ""]
              : s.ready
                ? ["Ready to build", "ok"]
                : s.files.some((f) => !f.pictures.length && f.ext === "pdf")
                  ? ["Needs page pictures", ""]
                  : sorted
                    ? [`${sorted} of ${s.files.length} sorted`, ""]
                    : ["Not sorted yet", ""];
          if (s.reviews.length && sorted) state[0] += ` · ${sorted} sorted`;
          kids[s.kid].append(
            $(
              "button",
              {
                class: s.id === current ? "on" : "",
                onclick: () => openSubject(s.id),
              },
              $(
                "span",
                {},
                s.name,
                $("small", { class: state[1], text: state[0] }),
              ),
              s.files.length
                ? $("span", { class: "count", text: s.files.length })
                : "",
            ),
          );
        }
        nav.append(
          $(
            "button",
            { class: "add-old", onclick: () => addOld() },
            $(
              "span",
              {},
              "+ Add an old file",
              $("small", { text: "already used, for a new lesson" }),
            ),
          ),
        );
        // Tablet / phone list: a banner on top for the review notes
        const withNotes = data.subjects.filter((x) => x.reviews.length);
        if (withNotes.length) {
          const n = withNotes.reduce((a, x) => a + x.reviews.length, 0);
          nav.prepend(
            $(
              "button",
              { class: "banner", onclick: () => openSubject(withNotes[0].id) },
              $(
                "span",
                {},
                $("b", { text: `✎ ${n} note${n === 1 ? "" : "s"} to fix` }),
                $("small", {
                  text: withNotes.map((x) => `${x.kid} · ${x.name}`).join(", "),
                }),
              ),
            ),
          );
        }
        const all = (k) => data.subjects.reduce((n, s) => n + s[k].length, 0);
        document.getElementById("totals").textContent = [
          `${all("files")} new files`,
          all("reviews") && `${all("reviews")} to fix`,
        ]
          .filter(Boolean)
          .join(" · ");
        const main = document.getElementById("main");
        main.replaceChildren();
        const s = data.subjects.find((x) => x.id === current);
        if (s)
          main.append(
            $(
              "h1",
              {},
              $("button", {
                class: "back",
                "aria-label": "Back to subjects",
                text: "‹",
                onclick: () => (location.hash = ""),
              }),
              `${s.kid} · ${s.name}`,
            ),
          );
        if (data.otherReviews.length)
          main.append(
            $("p", {
              class: "meta",
              text: `✎ ${data.otherReviews.length} review note(s) on pages of no subject here (${[...new Set(data.otherReviews.map((x) => x.page))].join(", ")}): fix them in a Claude session («fix review notes»).`,
            }),
          );
        if (!s) {
          main.append($("p", { class: "empty", text: "No new files. 🎉" }));
          document.getElementById("side").replaceChildren();
          document.body.classList.remove("has-bar", "open");
          return;
        }
        const skipped = s.files.filter((f) => f.note.kind === "skip").length;
        main.append(
          $(
            "p",
            { class: "file-acts" },
            $("button", {
              class: "btn plain",
              text: "+ Add an old file",
              onclick: () => addOld(s.id),
            }),
            skipped
              ? $("button", {
                  class: "btn plain",
                  text: `🗑 Remove ${skipped} skipped file${skipped === 1 ? "" : "s"}`,
                  onclick: () => removeSkipped(s, skipped),
                })
              : "",
          ),
        );
        if (s.reviews.length) main.append(reviewCard(s));
        const targets = new Set();
        for (const f of s.files) {
          f.hints.forEach((h) => targets.add(h));
          if (f.note.target) targets.add(f.note.target);
        }
        document
          .getElementById("targets")
          .replaceChildren(
            ...[...targets].map((t) => $("option", { value: t })),
          );
        if (s.files.some((f) => !f.pictures.length)) {
          const busy = s.preparing === "running";
          const btn = $("button", {
            class: "btn",
            text: busy ? "Preparing… (pages and OCR)" : "Prepare page pictures",
            onclick: async () => {
              btn.disabled = true;
              btn.textContent = "Preparing… (pages and OCR)";
              await fetch("/api/prep", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subject: s.id }),
              });
              poll();
            },
          });
          btn.disabled = busy;
          const err =
            s.preparing && s.preparing.startsWith("error")
              ? " " + s.preparing
              : "";
          main.append($("p", {}, btn, err));
        }
        for (const f of s.files) main.append(fileCard(f));
        const side = document.getElementById("side");
        side.replaceChildren();
        document.body.classList.add("has-bar");
        if (!s.files.length)
          main.append(
            $("p", {
              class: "empty",
              text: "No new files. A revision can still be built from the lessons already in the app (Build → Revision from lessons).",
            }),
          );
        side.append(...buildBar(s));
        fullScreen(full);
      }

      // The review notes written in the app (review mode) on this subject's pages; «Fix notes» runs build.py on the ticked ones.
      const APP = "https://ezayak.github.io/school-tests/"; // the app, where the notes' pages are
      const fixPicks = {}; // note id -> ticked (all ticked at first), kept while the page is open
      function reviewCard(s) {
        const btn = $("button", { class: "btn" });
        const picked = () => s.reviews.filter((x) => fixPicks[x.id] !== false);
        const label = () => {
          const n = picked().length;
          btn.textContent = `🛠 Fix ${n} note${n === 1 ? "" : "s"}`;
          btn.disabled = !n;
        };
        const text = $("input", {
          type: "text",
          placeholder: "e.g. same fix for every reading game",
        });
        const list = s.reviews.map((x) => {
          const tick = $("input", {
            type: "checkbox",
            onchange: (e) => {
              fixPicks[x.id] = e.target.checked;
              label();
            },
          });
          tick.checked = fixPicks[x.id] !== false;
          return $(
            "label",
            { class: "note" },
            tick,
            $(
              "span",
              {},
              $(
                "span",
                {},
                $("b", { text: x.title || x.page, dir: "auto" }),
                $("time", { text: x.at }),
              ),
              x.item
                ? $("span", {
                    class: "seen",
                    text: "Seen on: " + x.item,
                    dir: "auto",
                  })
                : "",
              $("span", { text: x.text, dir: "auto" }),
              $(
                "span",
                { class: "acts" },
                $("a", {
                  href: APP + x.page,
                  target: "_blank",
                  rel: "noopener",
                  text: "Open the lesson",
                }),
                $("button", {
                  type: "button",
                  class: "decline",
                  text: "✕ Decline",
                  title: "Take this note off the list without fixing it",
                  onclick: (e) => decline(e, x),
                }),
              ),
            ),
          );
        });
        btn.onclick = async () => {
          const ids = picked().map((x) => x.id);
          if (
            !confirm(
              `Fix ${ids.length} note(s)?\nClaude fixes them, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/fix", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ids, text: text.value }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else text.value = "";
          label();
          loadJobs(s.id);
        };
        label();
        return $(
          "section",
          { class: "notes" },
          $(
            "div",
            { class: "top" },
            $("h2", { text: "✎ Notes to fix" }),
            $("span", { text: "Tick the notes Claude should fix now" }),
          ),
          $(
            "div",
            { class: "list" },
            ...list,
            $(
              "div",
              { class: "go" },
              $(
                "label",
                {},
                "What to do (optional, for all ticked notes)",
                text,
              ),
              btn,
            ),
          ),
        );
      }

      // ✕ Decline: a note turned down (a duplicate…), closed without a fix
      async function decline(e, x) {
        e.preventDefault(); // not a tap on the note's tick
        if (
          !confirm("Decline this note?\nIt leaves the list; nothing is fixed.")
        )
          return;
        await fetch("/api/decline", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: [x.id] }),
        });
        await load();
      }

      // «Remove skipped files»: the files marked «Skip: nothing to build» leave the list (they count as used)
      async function removeSkipped(s, n) {
        if (
          !confirm(
            `Remove ${n} skipped file${n === 1 ? "" : "s"} from the list?\n«+ Add an old file» brings one back.`,
          )
        )
          return;
        await fetch("/api/remove-skipped", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject: s.id }),
        });
        await load();
      }

      // The «Create / Update lesson» bar: what to build, sent to /api/build; build.py runs it.
      const builds = {}; // subject id -> {mode, target, text}, kept while the page is open
      let countLine = null;
      let jobsBox = null;

      function ticked(s) {
        let pages = 0;
        let files = 0;
        let kept = 0;
        for (const f of s.files) {
          const ps = Object.values(f.note.pages || {});
          const n = ps.filter((p) => p.pick).length;
          pages += n;
          if (n) files++;
          kept += ps.filter((p) => p.keep).length;
        }
        return { pages, files, kept };
      }

      function updateBuild() {
        const s = data.subjects.find((x) => x.id === current);
        if (!s || !countLine) return;
        const t = ticked(s);
        const rev = (builds[s.id] || {}).mode === "revision";
        countLine.replaceChildren(
          t.pages
            ? `${t.pages} page${t.pages > 1 ? "s" : ""} on «This lesson» in ${t.files} file${t.files > 1 ? "s" : ""}: only these are used.`
            : rev
              ? "No page on «This lesson»: built only from the lessons you name, no files."
              : "No page on «This lesson»: all new files of this subject are used (with your notes).",
          $("small", {
            text: t.kept
              ? `${t.kept} kept for later · notes are sent too`
              : "Notes are sent too",
          }),
        );
        document.getElementById("bar-n").textContent = t.pages
          ? `${t.pages} page${t.pages > 1 ? "s" : ""} for this lesson`
          : rev
            ? "Revision from lessons"
            : "No page chosen: all files";
        document.getElementById("bar-k").textContent = t.kept
          ? `${t.kept} kept for later`
          : `${s.kid} · ${s.name}`;
      }

      // The bottom sheet on a tablet or phone (the panel stays on the right on a wide screen)
      function sheet(open) {
        document.body.classList.toggle("open", open);
        if (!open) fullScreen("");
      }

      // The build card or recent builds in a big popup: ⤢ opens, ✕, Esc or a tap outside closes. Kept when the page redraws.
      let full = "";
      const ICON_OPEN =
        '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3h5v5M8 17H3v-5M17 3l-6 6M3 17l6-6"/></svg>';
      const ICON_CLOSE =
        '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>';
      function expandButton(name) {
        return $("button", {
          type: "button",
          class: "expand",
          "data-full": name,
          onclick: () => fullScreen(full === name ? "" : name),
        });
      }
      function fullScreen(name) {
        full = name;
        document.body.classList.toggle("full", !!name);
        for (const b of document.querySelectorAll(".expand")) {
          const on = b.dataset.full === name;
          b.closest("section").classList.toggle("full", on);
          b.innerHTML = on ? ICON_CLOSE : ICON_OPEN;
          b.setAttribute("aria-label", on ? "Close" : "Open big");
        }
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && full) fullScreen("");
      });

      function buildBar(s) {
        const b =
          builds[s.id] ||
          (builds[s.id] = {
            mode: s.files.length ? "new" : "revision",
            target: "",
            text: "",
          });
        const btn = $("button", { class: "btn" });
        const PH = {
          lesson: [
            "e.g. Lesson 4-3, الدرس 5",
            "e.g. only the story and the words, exercises next time",
            "What to do (optional)",
          ],
          revision: [
            "e.g. Mid-term 2 revision (Term 2)",
            "e.g. Lessons 2-1 to 2-4 and 3-1, only the words and the questions",
            "Which lessons (and what to do)",
          ],
        };
        const label = () => {
          const rev = b.mode === "revision";
          btn.textContent = {
            new: "🛠 Create lesson",
            update: "🛠 Update lesson",
            revision: "🛠 Create revision",
          }[b.mode];
          btn.disabled = !b.target.trim() || (rev && !b.text.trim());
          const [pt, px, lx] = PH[rev ? "revision" : "lesson"];
          target.placeholder = pt;
          text.placeholder = px;
          textLabel.firstChild.textContent = lx;
          targetLabel.firstChild.textContent = rev
            ? "Name of the revision"
            : "Which lesson";
          hint.textContent = rev
            ? "Fill in its name and the lessons to start. You can keep sorting while it builds."
            : 'Fill in "Which lesson" to start. You can keep sorting while it builds.';
          updateBuild();
        };
        const modes = $("div", { class: "modes" });
        for (const [v, t] of [
          ["new", "New lesson"],
          ["update", "Update a lesson"],
          ["revision", "Revision from lessons"],
        ]) {
          modes.append(
            $("button", {
              type: "button",
              "data-v": v,
              class: b.mode === v ? "on" : "",
              "aria-pressed": b.mode === v,
              text: t,
              onclick: () => {
                b.mode = v;
                modes.querySelectorAll("button").forEach((m) => {
                  m.classList.toggle("on", m.dataset.v === v);
                  m.setAttribute("aria-pressed", m.dataset.v === v);
                });
                label();
              },
            }),
          );
        }
        const target = $("input", {
          list: "targets",
          placeholder: "e.g. Lesson 4-3, الدرس 5",
          value: b.target,
          oninput: (e) => {
            b.target = e.target.value;
            label();
          },
        });
        const text = $("textarea", {
          rows: 3,
          oninput: (e) => {
            b.text = e.target.value;
            label();
          },
        });
        const hint = $("div", { class: "hint" });
        const targetLabel = $("label", {}, "Which lesson", target);
        const textLabel = $("label", {}, "What to do (optional)", text);
        text.value = b.text;
        btn.onclick = async () => {
          const t = ticked(s);
          const what = t.pages
            ? `${t.pages} pages for this lesson`
            : b.mode === "revision"
              ? "the lessons you named"
              : "all new files";
          const verb = b.mode === "update" ? "Update" : "Create";
          if (
            !confirm(
              `${verb} "${b.target}" from ${what}?\nClaude builds it, checks it and pushes it live.`,
            )
          )
            return;
          btn.disabled = true;
          const r = await fetch("/api/build", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: s.id, ...b }),
          });
          if (!r.ok) alert((await r.json()).error || "Not sent");
          else {
            b.text = "";
            text.value = "";
          }
          label();
          loadJobs(s.id);
        };
        countLine = $("div", { class: "sum" });
        const card = $(
          "section",
          { class: "build" },
          $(
            "div",
            { class: "card-head" },
            $(
              "div",
              {},
              $("div", { class: "over", text: "Build" }),
              $("h2", { text: `${s.kid} · ${s.name}` }),
            ),
            expandButton("build"),
          ),
          countLine,
          $("label", {}, "Where should it go?", modes),
          targetLabel,
          textLabel,
          btn,
          hint,
        );
        label();
        const head = $(
          "div",
          { class: "sheet-head" },
          $("button", {
            type: "button",
            "aria-label": "Close",
            text: "✕",
            onclick: () => sheet(false),
          }),
        );
        return [head, card, recentCard(s)];
      }

      // Recent builds and fixes of this subject (build.py's jobs), refreshed while one runs
      function recentCard(s) {
        jobsBox = $("div", { class: "jobs" });
        loadJobs(s.id);
        return $(
          "section",
          { class: "recent" },
          $(
            "div",
            { class: "card-head" },
            $("h2", { text: "Recent builds" }),
            expandButton("recent"),
          ),
          jobsBox,
        );
      }

      const STATUS = {
        queued: "⏳ Waiting",
        running: "🛠 Building",
        checking: "🔍 Checking",
        pushed: "Live",
        failed: "Failed",
      };
      let jobsTimer = null;

      // navigator.clipboard needs https or localhost; the home-network address is plain http.
      async function copyText(text, btn) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const t = $("textarea", { readonly: "" });
          t.value = text;
          document.body.append(t);
          t.select();
          document.execCommand("copy");
          t.remove();
        }
        const was = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(() => (btn.textContent = was), 1500);
      }

      async function loadJobs(subject) {
        clearTimeout(jobsTimer);
        const r = await fetch("/api/jobs/" + encodeURIComponent(subject));
        const { jobs } = await r.json();
        if (subject !== current || !jobsBox) return;
        jobsBox.replaceChildren(
          ...jobs.map((j) => {
            const kind = {
              new: "New",
              update: "Update",
              revision: "Revision",
              fix: "Fix",
            }[j.mode];
            const box = $(
              "div",
              { class: "job" },
              $(
                "div",
                { class: "meta" },
                $("span", {
                  class: "status " + j.status,
                  text: STATUS[j.status] || j.status,
                }),
                ` ${kind} · ${j.created}`,
              ),
              $("b", { text: j.target, dir: "auto" }),
            );
            for (const p of j.problems || [])
              box.append(
                $("div", { class: "problem", text: "✗ " + p, dir: "auto" }),
              );
            if (j.result) box.append($("div", { text: j.result, dir: "auto" }));
            if (j.status === "failed" && j.worktree)
              box.append(
                $("div", {
                  class: "kept",
                  text:
                    `Kept: ${j.worktree} (branch ${j.branch || "build/" + j.id})` +
                    (j.resume
                      ? `\nContinue in a normal chat:\n${j.resume}`
                      : ""),
                }),
              );
            if (j.status === "failed" && j.resume)
              box.append(
                $("button", {
                  class: "btn plain copy",
                  text: "📋 Copy command",
                  onclick: (e) => copyText(j.resume, e.currentTarget),
                }),
              );
            if (j.tail.length && j.status !== "pushed")
              box.append($("pre", { text: j.tail.join("\n") }));
            return box;
          }),
        );
        if (jobs.some((j) => !["pushed", "failed"].includes(j.status)))
          jobsTimer = setTimeout(() => loadJobs(subject), 5000);
      }

      const unfolded = new Set(); // files whose pages show; every file starts folded
      // «+ Add an old file»: a file already used for a lesson goes back into its subject's list, to build with again.
      // inbox.py done (after the lesson) or ✕ Take out on its card removes it.
      const oldBox = document.getElementById("old");
      function addOld(sid) {
        const pick = $(
          "select",
          { "aria-label": "Subject", onchange: () => list() },
          ...data.all.map((x) =>
            $("option", { value: x.id, text: `${x.kid} · ${x.name}` }),
          ),
        );
        pick.value = sid || current || data.all[0]?.id;
        const find = $("input", {
          type: "search",
          placeholder: "Search: name or date (20261105)",
          oninput: () => show(),
        });
        const box = $("div", { class: "list" });
        const pv = $("div", { class: "pv" });
        let files = [];
        let chosen = null;
        // A tap on a file: its pages on the left, and the Add button there
        const see = async (f, item) => {
          chosen = f;
          box
            .querySelectorAll("button.on")
            .forEach((b) => b.classList.remove("on"));
          item.classList.add("on");
          const add = $("button", {
            type: "button",
            class: "btn",
            text: "+ Add",
            onclick: () => reopen(pick.value, f, true),
          });
          const shots = $(
            "div",
            { class: "shots" },
            $("p", { class: "empty", text: "Loading the preview…" }),
          );
          const info = $("small", {
            text: f.split("/").slice(0, -1).join(" / "),
          });
          pv.replaceChildren(
            $(
              "div",
              { class: "bar" },
              $(
                "div",
                { dir: "auto" },
                $("b", { text: f.split("/").pop() }),
                info,
              ),
              add,
            ),
            shots,
          );
          const r = await fetch(
            `/api/preview?subject=${encodeURIComponent(pick.value)}&file=${encodeURIComponent(f)}`,
          );
          if (chosen !== f) return; // another file was tapped meanwhile
          const got = r.ok ? await r.json() : { pictures: [] };
          if (
            got.pages &&
            got.pages > got.pictures.length &&
            got.pictures.length
          )
            info.textContent += ` · first ${got.pictures.length} of ${got.pages} pages`;
          else if (got.pages) info.textContent += ` · ${got.pages} p.`;
          shots.replaceChildren(
            ...(got.pictures.length
              ? got.pictures.map((src, i) =>
                  $("img", {
                    src:
                      "/img/" +
                      src.split("/").map(encodeURIComponent).join("/"),
                    alt: `page ${i + 1}`,
                    loading: "lazy",
                  }),
                )
              : [
                  $("p", { class: "empty", text: "No preview for this file." }),
                ]),
          );
        };
        const hint = () =>
          pv.replaceChildren(
            $("p", { class: "empty", text: "Tap a file to see it here." }),
          );
        const show = () => {
          const q = find.value.trim().toLowerCase();
          const hits = files.filter((f) => f.toLowerCase().includes(q));
          box.replaceChildren(
            ...(hits.length
              ? hits.slice(0, 200).map((f) =>
                  $(
                    "button",
                    {
                      type: "button",
                      dir: "auto",
                      class: f === chosen ? "on" : "",
                      onclick: (e) => see(f, e.currentTarget),
                    },
                    $("b", { text: f.split("/").pop() }),
                    $("small", { text: f.split("/").slice(0, -1).join(" / ") }),
                  ),
                )
              : [
                  $("p", {
                    class: "empty",
                    text: files.length
                      ? "Nothing found."
                      : "No used files here.",
                  }),
                ]),
          );
        };
        const list = async () => {
          box.replaceChildren($("p", { class: "empty", text: "Loading…" }));
          const r = await fetch("/api/used/" + encodeURIComponent(pick.value));
          files = (await r.json()).files;
          chosen = null;
          hint();
          show();
        };
        oldBox.replaceChildren(
          $(
            "div",
            { class: "head" },
            $("h2", { text: "Add an old file" }),
            $("button", {
              type: "button",
              class: "btn plain",
              text: "✕",
              "aria-label": "Close",
              onclick: () => oldBox.close(),
            }),
          ),
          $("p", {
            class: "meta",
            text: "A file already used for a lesson, back into the list to build with again. Tap a file to see it, then + Add.",
          }),
          $(
            "div",
            { class: "cols" },
            pv,
            $("div", { class: "choose" }, pick, find, box),
          ),
        );
        oldBox.showModal();
        list();
      }
      oldBox.addEventListener("click", (e) => {
        if (e.target === oldBox) oldBox.close(); // a tap outside
      });
      async function reopen(subject, file, open) {
        await fetch("/api/reopen", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject, file, open }),
        });
        if (open) {
          oldBox.close();
          current = subject;
          if (location.hash.slice(1) !== subject) location.hash = subject;
        }
        await load();
      }

      function fileCard(f) {
        f.note.pages = f.note.pages || {};
        const name = f.file.split("/").pop();
        const card = $("section", {
          class:
            "file" +
            (f.note.kind === "skip" ? " skipped" : "") +
            (f.pictures.length && !unfolded.has(f.file) ? " folded" : ""),
        });
        // Fold / unfold the page pictures (the file's information stays)
        const fold = $("button", {
          type: "button",
          class: "fold",
          onclick: () => {
            if (unfolded.has(f.file)) unfolded.delete(f.file);
            else unfolded.add(f.file);
            card.classList.toggle("folded", !unfolded.has(f.file));
            foldLabel();
          },
        });
        const foldLabel = () => {
          const open = unfolded.has(f.file);
          const n = f.pictures.length;
          const ticked = Object.values(f.note.pages).filter(
            (p) => p.pick,
          ).length;
          fold.textContent = open
            ? "Hide pages ▴"
            : `Show ${n} page${n === 1 ? "" : "s"}${ticked ? ` · ${ticked} for this lesson` : ""} ▾`;
          fold.setAttribute("aria-expanded", open);
        };
        const meta = [
          f.date,
          f.kind,
          f.pages ? f.pages + " p." : "",
          ...f.hints,
        ]
          .filter(Boolean)
          .join(" · ");
        card.append(
          $(
            "div",
            { class: "top" },
            $("h2", { text: name, dir: "auto" }),
            f.reopened ? $("span", { class: "tag-old", text: "old file" }) : "",
            f.reopened
              ? $("button", {
                  type: "button",
                  class: "fold",
                  text: "✕ Take out",
                  title: "Back to the used files",
                  onclick: () => reopen(current, f.file, false),
                })
              : "",
            f.pictures.length ? fold : "",
          ),
          $(
            "div",
            { class: "head" },
            $("div", {
              class: "meta",
              text: f.file.split("/").slice(0, -1).join(" / ") + " · " + meta,
            }),
            fileFields(f, () =>
              card.classList.toggle("skipped", f.note.kind === "skip"),
            ),
          ),
        );
        if (f.pictures.length) {
          const grid = $("div", { class: "pages" });
          // The bar above the pages: all / none on «This lesson» and how many are for this lesson or kept
          const nPick = $("span", { class: "n-pick" });
          const nKeep = $("span", { class: "n-keep" });
          const recount = () => {
            const ps = Object.values(f.note.pages);
            nPick.textContent = `${ps.filter((p) => p.pick).length} for this lesson`;
            const k = ps.filter((p) => p.keep).length;
            nKeep.textContent = k ? `${k} kept for later` : "";
            foldLabel();
          };
          f.pictures.forEach((pic, i) =>
            grid.append(pageBox(f, pic, i + 1, recount)),
          );
          const tickAll = (on) => {
            f.pictures.forEach((_, i) => {
              const pn = f.note.pages[i + 1] || (f.note.pages[i + 1] = {});
              pn.pick = on;
            });
            save(f.file);
            render();
          };
          recount();
          card.append(
            $(
              "div",
              { class: "ticks" },
              f.pictures.length > 1
                ? $("button", {
                    text: "All: this lesson",
                    onclick: () => tickAll(true),
                  })
                : "",
              f.pictures.length > 1
                ? $("button", {
                    text: "None",
                    onclick: () => tickAll(false),
                  })
                : "",
              nPick,
              nKeep,
            ),
            grid,
          );
        } else if (f.ext !== "pdf") {
          // A video or photo has no page pictures: one tick for the whole file (kept as page 1)
          const pn = f.note.pages[1] || (f.note.pages[1] = {});
          const chip = $("button", {
            type: "button",
            "data-v": "pick",
            text: pn.used ? `Use again (used: ${pn.used})` : "This lesson",
            onclick: () => {
              pn.pick = !pn.pick;
              chip.classList.toggle("on", pn.pick);
              chip.setAttribute("aria-pressed", pn.pick);
              save(f.file);
              updateBuild();
            },
          });
          chip.classList.toggle("on", !!pn.pick);
          chip.setAttribute("aria-pressed", !!pn.pick);
          card.append(
            $("div", { class: "single" }, $("div", { class: "chips" }, chip)),
          );
        }
        return card;
      }

      // A file's Goes to / What is it? / Note for Claude, on its card and in the page popup. onKind: after the kind changes.
      function fileFields(f, onKind = () => {}) {
        const kind = $("select", {
          onchange: (e) => {
            f.note.kind = e.target.value;
            onKind();
            save(f.file);
          },
        });
        for (const [v, t] of KINDS) {
          const o = $("option", { value: v, text: t });
          if ((f.note.kind || "") === v) o.selected = true;
          kind.append(o);
        }
        const target = $("input", {
          list: "targets",
          placeholder: "e.g. Lesson 4-3, Unit 2 Week 5",
          value: f.note.target || "",
          oninput: (e) => {
            f.note.target = e.target.value;
            save(f.file);
          },
        });
        const text = $("textarea", {
          placeholder: "What the teacher said, words you can read…",
          oninput: (e) => {
            f.note.text = e.target.value;
            save(f.file);
          },
        });
        text.value = f.note.text || "";
        return $(
          "div",
          { class: "fields" },
          $("label", {}, "Goes to", target),
          $("label", {}, "What is it?", kind),
          $("label", { class: "wide" }, "Note for Claude", text),
        );
      }

      // big: the box drawn in the page's popup (the picture doesn't open it again)
      function pageBox(f, pic, n, recount, big = false) {
        const pn = f.note.pages[n] || (f.note.pages[n] = {});
        const box = $("div", { class: "page" + (pn.pick ? " picked" : "") });
        // The tags on the picture: one for each chip that is on
        const tags = $("div", { class: "tags" });
        const showTags = () =>
          tags.replaceChildren(
            ...PAGE_CHIPS.filter(([k]) => pn[k]).map(([k, , tag]) =>
              $("span", { class: "tag", "data-v": k, text: tag }),
            ),
          );
        const extra = $("div", { class: "extra" });
        const drawExtra = () => {
          extra.replaceChildren();
          if (pn.keep)
            extra.append(
              $("input", {
                list: "targets",
                placeholder: "Which lesson? (if you know)",
                value: pn.target || "",
                oninput: (e) => {
                  pn.target = e.target.value;
                  save(f.file);
                },
              }),
            );
          const t = $("textarea", {
            placeholder: "Note for this page",
            oninput: (e) => {
              pn.text = e.target.value;
              save(f.file);
            },
          });
          t.value = pn.text || "";
          extra.append(t);
        };
        // Each chip turns on and off by itself: a page can be for this lesson and also kept for later
        const chips = $("div", { class: "chips" });
        for (const [k, label] of PAGE_CHIPS) {
          const b = $("button", {
            type: "button",
            "data-v": k,
            text: k === "pick" && pn.used ? "Use again" : label,
            onclick: () => {
              pn[k] = !pn[k];
              b.classList.toggle("on", pn[k]);
              b.setAttribute("aria-pressed", pn[k]);
              box.classList.toggle("picked", !!pn.pick);
              showTags();
              if (k === "keep") drawExtra();
              save(f.file);
              updateBuild();
              recount();
            },
          });
          b.classList.toggle("on", !!pn[k]);
          b.setAttribute("aria-pressed", !!pn[k]);
          chips.append(b);
        }
        showTags();
        drawExtra();
        box.append(
          $(
            "div",
            { class: "thumb" },
            $("img", {
              src: "/img/" + pic.split("/").map(encodeURIComponent).join("/"),
              loading: big ? "eager" : "lazy",
              alt: "page " + n,
              onclick: () => big || openBig(f, n),
            }),
            tags,
          ),
          $("div", {
            class: "n",
            text: [
              f.pictures.length > 1 ? "Page " + n : "",
              pn.used ? "used: " + pn.used : "",
            ]
              .filter(Boolean)
              .join(" · "),
          }),
          chips,
          extra,
        );
        return box;
      }

      // A page opened big: its picture and every control of its card. ‹ › (arrow keys, a swipe) go through all the
      // subject's pages, file after file. ✕, Esc or a tap on the dark edge closes; the cards redraw then.
      let bigAt = -1; // place in bigList() while open
      const bigList = () =>
        (data.subjects.find((x) => x.id === current)?.files || []).flatMap(
          (f) => f.pictures.map((pic, i) => [f, pic, i + 1]),
        );
      function openBig(f, n) {
        bigAt = bigList().findIndex(([g, , m]) => g === f && m === n);
        drawBig();
      }
      function moveBig(d) {
        const to = bigAt + d;
        if (to >= 0 && to < bigList().length) {
          bigAt = to;
          drawBig();
        }
      }
      function closeBig() {
        bigAt = -1;
        document.getElementById("big").hidden = true;
        document.body.classList.remove("big");
        render();
      }
      function drawBig() {
        const list = bigList();
        if (!list[bigAt]) return closeBig();
        const [f, pic, n] = list[bigAt];
        const arrow = (d, cls, label, text) => {
          const b = $("button", {
            type: "button",
            class: "arrow " + cls,
            "aria-label": label,
            text,
            onclick: () => moveBig(d),
          });
          b.disabled = !list[bigAt + d];
          return b;
        };
        const close = $("button", {
          type: "button",
          class: "close",
          "aria-label": "Close",
          onclick: closeBig,
        });
        close.innerHTML = ICON_CLOSE;
        const box = pageBox(f, pic, n, () => {}, true);
        // One column beside the picture: the file's fields, then the page's own controls (moved from its box)
        box.append(
          $(
            "div",
            { class: "side" },
            $("h3", { text: "File" }),
            fileFields(f),
            $("h3", { text: "Page" }),
            ...box.querySelectorAll(".chips, .extra"),
          ),
        );
        const thumb = box.querySelector(".thumb");
        thumb.append(
          arrow(-1, "prev", "Previous page", "‹"),
          arrow(1, "next", "Next page", "›"),
        );
        let x0 = null; // swipe on the picture
        thumb.addEventListener("touchstart", (e) => {
          x0 = e.touches[0].clientX;
        });
        thumb.addEventListener("touchend", (e) => {
          const dx = e.changedTouches[0].clientX - x0;
          if (x0 !== null && Math.abs(dx) > 60) moveBig(dx < 0 ? 1 : -1);
          x0 = null;
        });
        const big = document.getElementById("big");
        big.replaceChildren(
          $(
            "div",
            { class: "box" },
            $(
              "div",
              { class: "bar" },
              $(
                "h2",
                { dir: "auto" },
                f.file.split("/").pop(),
                $("small", {
                  text: `Page ${n} of ${f.pictures.length} · ${bigAt + 1} / ${list.length}`,
                }),
              ),
              close,
            ),
            box,
          ),
        );
        big.hidden = false;
        document.body.classList.add("big");
      }
      document.getElementById("big").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeBig();
      });
      document.addEventListener("keydown", (e) => {
        if (bigAt < 0 || e.target.matches("input, textarea, select")) return;
        if (e.key === "Escape") closeBig();
        else if (e.key === "ArrowLeft") moveBig(-1);
        else if (e.key === "ArrowRight") moveBig(1);
      });

      async function poll() {
        await load();
        const s = data.subjects.find((x) => x.id === current);
        if (s && s.preparing === "running") setTimeout(poll, 3000);
      }

      window.addEventListener("hashchange", route);
      load();
    </script>
  </body>
</html>
