<!doctype html><meta charset="utf-8" />
<!-- Every Learn card of a dictation side by side (copied next to the page by cards.sh). ?p=page.html&n=items -->
<body style="margin: 0; display: grid; grid-template-columns: repeat(5, 320px)">
  <script>
    const P = new URLSearchParams(location.search),
      n = +P.get("n"),
      wait = (ms) => new Promise((r) => setTimeout(r, ms));
    for (let i = 0; i < n; i++) {
      const w = document.createElement("div"),
        f = document.createElement("iframe");
      w.style.cssText = "width:320px;height:300px;overflow:hidden";
      f.style.cssText =
        "width:800px;height:750px;border:0;transform:scale(.4);transform-origin:0 0";
      f.src = P.get("p") + "?x=" + i;
      w.appendChild(f);
      document.body.appendChild(w);
      f.onload = async () => {
        const d = f.contentDocument;
        await wait(300);
        d.querySelector("#mode-learn").click();
        await wait(200);
        for (let k = 0; k < i; k++) {
          d.querySelector("#nextCard").click();
          await wait(50);
        }
      };
    }
  </script>
</body>
