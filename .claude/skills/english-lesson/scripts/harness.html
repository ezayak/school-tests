<!doctype html><meta charset="utf-8" />
<body style="margin: 0">
  <iframe id="f" style="width: 1280px; height: 900px; border: 0"></iframe>
  <pre id="out"></pre>
  <script>
    const PAGE = new URLSearchParams(location.search).get("p");
    const f = document.getElementById("f"),
      out = document.getElementById("out");
    const log = (s) => (out.textContent += s + "\n");
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let errs = [];
    async function load() {
      f.src = PAGE + "?t=" + Math.random();
      await new Promise((r) => (f.onload = r));
      f.contentWindow.onerror = (m, s, l) => errs.push(m + " @" + l);
      f.contentWindow.speechSynthesis &&
        (f.contentWindow.speechSynthesis.speak = () => {});
      await wait(200);
      return f.contentDocument;
    }
    const q = (d, s) => d.querySelector(s);
    async function play(d) {
      let steps = 0;
      for (let n = 0; n < 400; n++) {
        await wait(60);
        if (!q(d, "#homeBtn")) return steps; // the score screen
        const nx = q(d, "#nextBtn");
        if (nx) {
          nx.click();
          steps++;
          continue;
        }
        const ag = q(d, "#againBtn");
        if (ag) {
          ag.click();
          continue;
        }
        const yes = q(d, "#yes");
        if (yes) {
          yes.click();
          continue;
        }
        const show = q(d, "#showBtn");
        if (show) {
          show.click();
          continue;
        }
        const hint = q(d, ".tw.hint");
        if (hint) {
          hint.click();
          continue;
        }
        // Math (shared/math.js): a column sum → Check until the answer is shown; the number pad → type 1 and ✓ (2 wrong tries show the answer)
        const go = q(d, "#goCol");
        if (go) {
          go.click();
          continue;
        }
        const colCk = q(d, "#chkBtn");
        if (colCk && q(d, ".mx-pad")) {
          q(d, '.mx-pad [data-k="1"]').click(); // Check needs a digit in the boxes
          colCk.click();
          continue;
        }
        if (q(d, ".mx-pad") && q(d, "#nv")) {
          q(d, '.mx-pad [data-k="1"]').click();
          q(d, '.mx-pad [data-k="ok"]').click();
          continue;
        }
        const ck = q(d, "#checkBtn");
        // choose all (multi): tap one answer so Check works; a wrong first try then shows the answer
        const mo = q(d, ".mopt:not([disabled])");
        if (mo && ck && ck.disabled) {
          mo.click();
          continue;
        }
        if (ck && !ck.disabled) {
          ck.click();
          continue;
        }
        const ml = [...d.querySelectorAll("[data-l]")].find(
          (b) => !b.querySelector(".tag"),
        );
        if (ml) {
          ml.click();
          await wait(30);
          const mr = [...d.querySelectorAll("[data-r]")].find(
            (b) => !b.querySelector(".tag"),
          );
          mr && mr.click();
          continue;
        }
        const w = q(d, "[data-w]");
        if (w) {
          const before = d.querySelectorAll("[data-w]").length;
          w.click();
          await wait(30);
          for (const c of d.querySelectorAll(".scol")) {
            c.click();
            await wait(60);
            if (d.querySelectorAll("[data-w]").length < before) break;
          }
          continue;
        }
        // a word search: find a word that is not found yet and tap its first and last letters
        const ws = q(d, "#ws");
        const left = ws
          ? [...d.querySelectorAll("#wsl li:not(.ok)")].map((li) =>
              li.textContent.toUpperCase().replace(/[^A-Z0-9]/g, ""),
            )
          : [];
        if (left.length) {
          const cells = [...ws.querySelectorAll(".wc")];
          const at = (r, c) =>
            cells.find((x) => +x.dataset.r === r && +x.dataset.c === c);
          const n = Math.round(Math.sqrt(cells.length));
          let hit = null;
          for (let r = 0; r < n && !hit; r++)
            for (let c = 0; c < n && !hit; c++)
              for (const [dr, dc] of [
                [0, 1],
                [1, 0],
                [1, 1],
              ])
                for (const w of [left[0], [...left[0]].reverse().join("")]) {
                  let ok = true;
                  for (let i = 0; i < w.length && ok; i++) {
                    const x = at(r + dr * i, c + dc * i);
                    ok = x && x.textContent === w[i];
                  }
                  if (ok && !hit)
                    hit = [
                      at(r, c),
                      at(r + dr * (w.length - 1), c + dc * (w.length - 1)),
                    ];
                }
          if (hit) {
            for (const el of hit) {
              const b = el.getBoundingClientRect();
              ws.dispatchEvent(
                new d.defaultView.PointerEvent("pointerdown", {
                  bubbles: true,
                  clientX: b.left + b.width / 2,
                  clientY: b.top + b.height / 2,
                }),
              );
              await wait(30);
            }
            continue;
          }
        }
        const help = q(d, "#helpBtn");
        if (help && !ws) {
          help.click();
          continue;
        }
        const opt = [
          ...d.querySelectorAll(".opt:not([disabled]):not(.wrong):not(.no)"),
        ][0];
        if (opt) {
          opt.click();
          continue;
        }
        const tile = [
          ...d.querySelectorAll(
            '.tile[data-from="bank"], .tile:not([disabled]):not([data-from]), .card-opt:not([disabled])',
          ),
        ][0];
        if (tile) {
          if (tile.classList.contains("stp")) {
            const r = tile.getBoundingClientRect(),
              W = f.contentWindow;
            const o = {
              bubbles: true,
              clientX: r.left + 5,
              clientY: r.top + 5,
              pointerId: 1,
            };
            tile.dispatchEvent(new W.PointerEvent("pointerdown", o));
            tile.dispatchEvent(new W.PointerEvent("pointerup", o));
          } else tile.click();
          continue;
        }
        // a "do it" item in a simulator that can finish its own mission (Mini Outlook/Edge: shared/netsim.js)
        const sb = q(d, "#simbox");
        if (sb && sb.__sim && sb.__sim.solve && !sb.__solving) {
          sb.__solving = true;
          await sb.__sim.solve();
          continue;
        }
      }
      return (
        "STUCK at " +
        (q(d, ".qnum") || {}).textContent +
        " · " +
        (q(d, ".q, .qtext") || {}).textContent
      );
    }
    (async () => {
      let d = await load();
      log("title: " + d.title + " · errors on load: " + errs.length);
      for (const tab of ["learn", "play", "exercises", "ex"]) {
        d = await load();
        const tb = q(d, `[data-tab="${tab}"]`);
        if (!tb) continue;
        tb.click();
        await wait(100);
        const secs = [...d.querySelectorAll("[data-sec]")].map(
          (b) => b.dataset.sec,
        );
        for (const s of secs.length ? secs : [null]) {
          d = await load();
          q(d, `[data-tab="${tab}"]`).click();
          await wait(80);
          if (s !== null) {
            q(d, `[data-sec="${s}"]`).click();
            await wait(80);
          }
          const ids = [...d.querySelectorAll("[data-x],[data-g],[data-d]")].map(
            (b) => b.id,
          );
          log(`${tab} · section ${s}: ${ids.join(", ")}`);
          for (const id of ids) {
            if (!/^(x|g)-/.test(id)) continue;
            d = await load();
            q(d, `[data-tab="${tab}"]`).click();
            await wait(60);
            if (s !== null) {
              q(d, `[data-sec="${s}"]`).click();
              await wait(60);
            }
            errs = [];
            f.contentWindow.onerror = (m, src, l) => errs.push(m + " @" + l);
            q(d, "#" + id).click();
            const r = await play(d);
            log(
              `  ${id}: ${r} steps${errs.length ? " · ERRORS " + errs.join(" | ") : ""}`,
            );
          }
        }
      }
      log("DONE");
      document.title = "done";
    })();
  </script>
</body>
