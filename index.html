<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2440">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>

<title>Study Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: graph-paper page, one section per grade, a row per term/period, subject cards inside */
:root{
  --paper:#F2F6FC; --grid:#DCE6F3; --card:#FFFFFF; --ink:#1B2440; --muted:#56637F; --hl:#FFE14D;
  --sci:#F2B705; --ss:#D93A3A; --fr:#2E9E4F; --en:#3474CF; --ssa:#D63F96; --rel:#E6DFCF; --other:#8A5CC9;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111827;--grid:#1B2540;--card:#19223A;--ink:#EAF0FF;--muted:#A1ADC9;--hl:#FFD84D;--sci:#FFD23F;--ss:#FF6B6B;--fr:#4ED07A;--en:#6FA2F0;--ssa:#F27AC0;--rel:#F3EEE2;--other:#B48CF0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111827;--grid:#1B2540;--card:#19223A;--ink:#EAF0FF;--muted:#A1ADC9;--hl:#FFD84D;--sci:#FFD23F;--ss:#FF6B6B;--fr:#4ED07A;--en:#6FA2F0;--ssa:#F27AC0;--rel:#F3EEE2;--other:#B48CF0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
header{display:flex;flex-direction:column;gap:10px}
h1{font-size:clamp(2.6rem,8vw,4rem);line-height:.95}
h1 span{color:var(--fr)}
.sub{color:var(--muted);margin:0;max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
a:focus-visible{outline:3px solid var(--fr);outline-offset:3px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.grade-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
#list{display:flex;flex-direction:column;gap:44px}
.grade{display:flex;flex-direction:column;gap:16px}
.grade>h2{font-size:2rem;display:flex;align-items:baseline;gap:10px}
.grade>h2 small{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:700}
.period{display:flex;flex-direction:column;gap:12px}
.period h3{font-size:1.2rem;display:inline-flex;align-self:flex-start;padding:2px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--hl);color:#1B2440}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px;color:var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s;border-top:10px solid var(--c)}
.game:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.game .subj{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:color-mix(in srgb,var(--c) 65%,var(--ink))}
.game.light-c .subj{color:var(--muted)}
.game .t{font-family:var(--display);font-size:1.5rem;line-height:1.05}
.game .l{font-weight:700;font-size:.95rem}
.game .tp{color:var(--muted);font-size:.92rem;margin:0}
.game .meta{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px}
.game .go{font-family:var(--display);color:var(--ink);font-size:1rem}
.empty{color:var(--muted)}
.install{font-family:var(--display);font-size:1.05rem;border:2.5px solid var(--ink);border-radius:12px;padding:8px 16px;background:var(--hl);color:#1B2440;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.ios-tip{color:var(--muted);font-size:.92rem;margin:0}
footer{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Study <span>Games</span></h1>
    <p class="sub">Picture quizzes, matching and sentence-building games for school tests. Pick a grade, then a game. Questions are shuffled every time you play.</p>
    <div class="tools">
      <div class="grade-row">
        <div class="filters" id="filters" role="group" aria-label="Show grade"></div>
        <button type="button" id="installBtn" class="install" hidden>⬇ Install app</button>
      </div>
      <div class="filters" id="subjects" role="group" aria-label="Show subject"></div>
    </div>
  </header>
  <div id="list"></div>
  <footer>To add a game, put its file in <code>grade-N/term-N/&lt;period&gt;/</code> and add one line to <code>games.js</code>.</footer>
</main>
<script src="games.js"></script>
<script src="index.js"></script>
</body>
</html>
