<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2440">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>

<title>Study Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="index.css">
</head>
<body>
<main class="wrap">
  <header>
    <div class="hero">
      <h1>Study <span>Games</span></h1>
      <div class="hero-end">
        <button type="button" id="installBtn" class="install" hidden>⬇ Install app</button>
        <div class="school" id="school" role="group" aria-label="School"></div>
      </div>
    </div>
    <div class="tools">
      <div class="filters grades" id="filters" role="group" aria-label="Show grade"></div>
      <div class="filters subjects" id="subjects" role="group" aria-label="Show subject"></div>
    </div>
  </header>
  <div id="list"></div>
  <footer>To add a game, put its file in <code>grade-N/term-N/&lt;period&gt;/</code> and add one line to <code>games.js</code>.</footer>
</main>
<script src="games.js"></script>
<script src="index.js"></script>
</body>
</html>
