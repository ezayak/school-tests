        const tiles = (q) => {
          const n = q.ps.length,
            cols = n > 3 ? 2 : n,
            rows = Math.ceil(n / cols),
            w = (320 - 6 * (cols + 1)) / cols,
            h = (180 - 6 * (rows + 1)) / rows;
          return (
            SKY +
            q.ps
              .map((p, i) => {
                const x = 6 + (i % cols) * (w + 6),
                  y = 6 + Math.floor(i / cols) * (h + 6);
                return `<rect class="f-card" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>${tx(x + 14, y + h / 2, "ABCD"[i], "lbl-big")}<image href="${IMG(p)}" x="${x + 28}" y="${y + 3}" width="${w - 31}" height="${h - 6}" preserveAspectRatio="xMidYMid meet"/>`;
              })
              .join("")
          );
        };
        // emoji picture: each group of emoji in its own slot, so a long row never runs off the picture
        const emo = (e) => {
          const g = e.split(" "),
            s = Math.min(
              80,
              280 /
                g.length /
                Math.max(...g.map((x) => x.replace(/[️‍]/g, "").length / 2)),
            );
          return (
            SKY +
            g
              .map((x, i) =>
                em(160 + (i - (g.length - 1) / 2) * (300 / g.length), 90, s, x),
              )
              .join("")

            p: "copper",
            q: "Copper is used to make…",
            o: ["Coins", "Steel", "Electricity"],
          },
          {
            l: 3,
            p: "us-forest",
            q: "The United States has forests and rich…",
            o: ["soil", "ice", "sand"],
            x: "It also has minerals, coal and iron.",
          },
          {
            l: 3,
            p: "us-farm",
            q: "In the United States, land is used for mining and…",
            o: ["raising animals", "building volcanoes", "making snow"],
          },
          {
            l: 3,
            p: "earth",
            q: "It takes the Earth so long to make many natural resources, so there is a ___ supply of them.",
            o: ["limited", "never-ending", "huge"],
          },
          {
            l: 3,
            p: "us-forest",
            q: "___ are natural resources that can be replaced in a short time.",
            o: [
              "Renewable resources",
              "Non-renewable resources",
              "Industrial regions",
            ],
          },
          {
            l: 3,
            p: "logs",
            q: "Renewable resources can grow again or come back, such as…",
            o: ["Trees and soil", "Oil and natural gas", "Coal and iron"],
          },
          {
            l: 3,
            p: "nonrenewable",
            q: "Non-renewable resources are those that…",
            o: [
              "Take a long time to replace or cannot be replaced after they are used",
              "Can be replaced in a short time",
              "Grow again quickly",
            ],
          },
          {
            l: 3,
            p: "nr-air",
            q: "___ is a renewable resource.",
            o: ["Air", "Oil", "Gas"],
          },
          {
            l: 3,
            p: "e-wind",
            q: "Wind power is a renewable energy source that…",
            o: [
              "Does not harm the environment",
              "Makes the air dirty",
              "Comes from coal",
            ],
          },
          // renewable or non-renewable? (booklet p. 13)
          ...[
            ["Coal", "e-coal", 1],
            ["Hydropower", "e-hydro", 0],
            ["Sun", "e-solar", 0],
            ["Biomass", "e-biomass", 0],
            ["Nuclear", "e-nuclear", 1],
            ["Wind", "e-wind", 0],
            ["Waves", "", 0],
            ["Oil", "e-oil", 1],
            ["Natural gas", "e-gas", 1],
            ["Geothermal", "e-geothermal", 0],
          ].map(([w, p, c]) => ({
            l: 3,
            ...(p ? { p } : { e: "🌊" }),
            q: `Renewable or non-renewable? "${w}"`,
            o: RN,
            c,
            k: 1,
          })),
          {
            l: 3,
            p: "conserve",
            q: '___ means "save and protect".',
            o: ["Conservation", "Renewable", "Industrial"],
          },
          {
            l: 3,
            p: "earth",
            q: "People conserve resources so that…",
            o: [
              "Everyone has enough natural resources to live",
              "Factories can close",
              "Resources run out quickly",
            ],
          },
          {
            l: 3,
            p: "recycling",
            q: "People conserve resources by…",
            o: [
              "Using less, being careful and recycling",
              "Using more of these resources",
              "Throwing everything away",
            ],
          },
          {
            l: 3,
            p: "recycling",
            q: "Recycle means…",
            o: [
              "To use an item again",
              "To throw an item away",
              "To dig under the ground",
            ],
          },
          // true or false (booklet C)
          {
            l: 3,
            p: "copper",
            q: '"Copper is used to make coins."',
            o: TF,
            k: 1,
          },
          {
            l: 3,
            p: "conserve",
            q: '"People conserve resources by using more of these resources."',
            o: TF,
            c: 1,
            k: 1,
            x: "People conserve resources by using LESS of them.",
          },
          {
            l: 3,
            p: "recycling",
            q: '"Recycle means to use an item again."',
            o: TF,
            k: 1,
          },
          {
            l: 3,
            p: "nonrenewable",
            q: '"Non-renewable resources are natural resources that can be replaced in a short time."',
            o: TF,
            c: 1,
            k: 1,
            x: "That is RENEWABLE resources. Non-renewable ones take a long time or cannot be replaced.",
          },
          {
            l: 3,
            p: "oil-pumps",
            q: '"Some products are made from resources found underground."',
            o: TF,
            k: 1,
          },
          // where does it go? (Graded HW 2)
          ...[
            ["Sunlight", "hw-sunlight", 0],
            ["Soil", "hw-soil", 0],
            ["Water", "hw-water", 0],
            ["Plants", "hw-plants", 0],
            ["Carrot", "hw-carrot", 1],
            ["Apple", "hw-apple", 1],
            ["Lettuce", "hw-lettuce", 1],
            ["Banana", "hw-banana", 1],
            ["Clothes", "hw-clothes", 2],
            ["Chair", "hw-chair", 2],
          ].map(([w, p, c]) => ({
            l: 3,
            p,
            q: `Where does it go? "${w}"`,
            o: HW,
            c,
            k: 1,
          })),
        ];

        const MT = [
          {
            l: 2,
            t: "Match each word to its meaning",
            p: [
              [
                "🌦️",
                "Weather",
                "The condition of the air at a place right now",
              ],
              [
                "🌍",
                "Climate",
                "The weather of a place over a long period of time",
              ],
              ["⛰️", "Elevation", "The height"],
              ["🌿", "Vegetation", "Kinds of plant life that grow"],
            ],
          },
          {
            l: 2,
            t: "Match each word to its meaning",
            p: [
              ["🌡️", "Temperature", "How hot or cold it is"],
              ["🌧️", "Precipitation", "The amount of rain or snow that falls"],
              [
                "🐿️",
                "Ecosystem",
                "Plants and animals interact and work together",
              ],
              ["🔴", "Equator", "The line around the middle of the Earth"],
            ],
          },
          {
            l: 2,
            t: "Match each climate to what it is like",
            p: [
              [
                "🌴",
                "Tropical climate",
                "Warm and hot, no winter, near the equator",
              ],
              ["🍂", "Temperate climate", "Warmer summers and colder winters"],
              ["🐻‍❄️", "Arctic climate", "Very cold"],
            ],
          },
          {
            l: 2,
            t: "Match each place to an animal or plant that lives there",
            p: [
              ["🌲", "Forests", "Bears, deer and raccoons"],
              ["🌾", "Grasslands", "Prairie dogs"],
              ["❄️", "Tundra", "Caribou"],
              ["🏜️", "Deserts", "Saguaro cactuses"],
            ],
          },
          {
            l: 2,
            t: "Match each word to its meaning",
            p: [
              [
                "🌪️",
                "Natural hazard",
                "A natural event that changes the land or environment",
              ],
              [
                "🏚️",
                "Natural disaster",
                "Causes damage to people, buildings and bridges",
              ],
              [
                "🌋",
                "Volcano",
                "A mountain that erupts molten rock, gases and ash",
              ],
              ["🏠", "Earthquake", "A violent shaking of the earth"],
            ],
          },
          {
            l: 2,
            t: "Match each type of vegetation to where it is or what it is like",
            p: [
              ["🌲", "Forests", "Plenty of rainfall"],
              ["🏜️", "Deserts", "The driest places on Earth"],
              ["❄️", "Tundra", "Mostly around the Arctic Circle"],
              ["🌾", "Grasslands", "Dry climates of the Western Great Plains"],
            ],
          },
          {
            l: 3,
            t: "Match each word to its meaning",
            p: [
              [
                "🌍",
                "Natural resources",
                "Found in nature and can be used by people",
              ],
              ["🌳", "Renewable resources", "Can be replaced in a short time"],
              [
                "🛢️",
                "Non-renewable resources",
                "Take a long time or cannot be replaced",
              ],
              ["🛡️", "Conservation", "Save and protect"],
              ["♻️", "Recycle", "Use an item again"],
            ],
          },
          {
            l: 3,
            t: "Match each word to its meaning",
            p: [
              [
                "🚜",
                "Agricultural region",
                "Much flat land and rich soil for farming",
              ],
              ["🏭", "Industrial region", "Many kinds of factories"],
              ["⛽", "Pumping", "Takes oil and natural gas from underground"],
              ["👕", "Cotton", "Made into fabric for clothing"],
            ],
          },
          {
            l: 3,
            t: "Match each resource to what it is used for",
            p: [
              ["⚫", "Coal", "Helps make electricity"],
              ["🔨", "Iron", "Makes steel"],
              ["🪙", "Copper", "Makes coins"],
              ["🛢️", "Oil", "Fuel (gasoline) and plastic"],
            ],
          },
        ];

        const LESSONS = [
          { n: 0, l: "All lessons" },
          { n: 2, l: "L2 · Weather, climate & nature" },
          { n: 3, l: "L3 · Earth's resources" },
        ];
        const PAIRC = [
          "var(--ke)",
          "var(--pe)",
          "var(--cool)",
          "var(--heat)",
          "var(--green)",
        ];
        const pool = () => {
          const n = LESSONS[lesIdx].n;
          return {
            mc: MC.filter((q) => !n || q.l === n),
            mt: MT.filter((q) => !n || q.l === n),
          };
        };
        const LENS = [
          { mc: 8, mt: 2, l: "Quick · 10" },
          { mc: 16, mt: 4, l: "Normal · 20" },
          { mc: 0, mt: 0, l: "All" },
        ];
        const store = (k, v) => {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        };
        let lenIdx = 1,
          lesIdx = 0;
        try {
          const v = localStorage.getItem("g3ssq-len");
          if (v !== null && LENS[+v]) lenIdx = +v;
        } catch (e) {}
        try {
          const v = localStorage.getItem("g3ssq-lesson");
          if (v !== null && LESSONS[+v]) lesIdx = +v;
        } catch (e) {}

        const S = { list: [], i: 0, score: 0, max: 0, miss: [] };
        const app = document.getElementById("app");
        const { esc, shuf, pick, star } = Kit;
        const bolt =
          '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="#1B2440"/></svg>';
        const scene = (q) =>
          q.p
            ? `<img class="scene pic fit" src="${IMG(q.p)}" alt="Picture for the question">`
            : `<div class="scene" role="img" aria-label="Picture for the question"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">${q.ps ? tiles(q) : emo(q.e)}</svg></div>`;

        function start() {
          const L = LENS[lenIdx],
            P = pool();
          const mc = shuf(P.mc)
            .slice(0, L.mc || P.mc.length)
            .map((q) => ({ type: "mc", ...q }));
          const mt = shuf(P.mt)
            .slice(0, L.mt || P.mt.length)
            .map((q) => ({ type: "mt", ...q }));
          let list = shuf(mc.concat(mt));
          // avoid two matching rounds in a row when possible
          for (let i = 1; i < list.length; i++) {
            if (list[i].type === "mt" && list[i - 1].type === "mt") {
              const j = list.findIndex((q, k) => k > i && q.type === "mc");
              if (j > 0) [list[i], list[j]] = [list[j], list[i]];
            }
          }
          S.list = list;
          S.i = 0;
          S.score = 0;
          S.miss = [];
          S.max = list.reduce(
            (t, q) => t + (q.type === "mc" ? 1 : q.p.length),
            0,
          );
          render();
        }

        function hud() {
          const pct = Math.round((S.i / S.list.length) * 100);
          return `<div class="hud"><span class="qnum">Question ${S.i + 1} of ${S.list.length}</span><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div><span class="score" aria-label="Points">${bolt}<b id="pts">${S.score}</b></span></div>`;
        }

        function render() {
          if (!S.list.length) return home();
          if (S.i >= S.list.length) return end();
          const q = S.list[S.i];
          q.type === "mc" ? renderMC(q) : renderMT(q);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function home() {
          const P = pool(),
            n = P.mc.length + P.mt.length;
          app.innerHTML = `<section class="card pop">
    <div class="topbar"><a class="back" href="../../../index.html">← All games</a><span class="eyebrow">Grade 3 Social Studies · Final revision</span></div>
    <h1 class="hero-title"><span class="p">Social Studies</span> <span class="k">Quest</span></h1>
    ${scene({ p: "earth-resources" })}
    <p class="howto">Ready? Look at each picture, then choose the right answer. In matching rounds, tap a word and then tap its meaning. The questions are mixed up every time you play.</p>
    <div class="chips"><span class="chip pe">Weather, climate &amp; nature</span><span class="chip ke">Using Earth’s resources</span></div>
    <div class="row"><span class="eyebrow">Which lessons?</span><div class="seg" role="group" aria-label="Lessons">${LESSONS.map((l, i) => `<button type="button" id="les-${i}" data-les="${i}" aria-pressed="${i === lesIdx}">${l.l}</button>`).join("")}</div></div>
    <div class="row"><span class="eyebrow">How many questions?</span><div class="seg" role="group" aria-label="Number of questions">${LENS.map((l, i) => `<button type="button" id="len-${i}" data-len="${i}" aria-pressed="${i === lenIdx}">${i === LENS.length - 1 ? "All · " + n : l.l}</button>`).join("")}</div></div>
    <div class="row"><button class="btn big" id="startBtn" type="button">Start</button></div>
  </section>`;
          app.querySelectorAll("[data-len]").forEach(
            (b) =>
              (b.onclick = () => {
                lenIdx = +b.dataset.len;
                store("g3ssq-len", lenIdx);
                home();
              }),
          );
          app.querySelectorAll("[data-les]").forEach(
            (b) =>
              (b.onclick = () => {
                lesIdx = +b.dataset.les;
                store("g3ssq-lesson", lesIdx);
                home();
              }),
          );
          document.getElementById("startBtn").onclick = start;
        }

        function renderMC(q) {
          let opts = q.o.map((t, i) => ({ t, ok: i === (q.c || 0) }));
          if (!q.k) opts = shuf(opts);
          const long = opts.some((o) => o.t.length > 34);
          app.innerHTML = `${hud()}<section class="card pop">
    <span class="qtype mc">${q.o === TF ? "True or false" : "Choose the answer"}</span>
    ${scene(q)}
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts ${long ? "long" : ""}">${opts.map((o, i) => `<button type="button" class="opt" id="opt-${i}" data-i="${i}"><span class="L">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fbx"></div>
  </section>`;
          const btns = [...app.querySelectorAll(".opt")];
          btns.forEach(
            (b) =>
              (b.onclick = () => {
                const o = opts[+b.dataset.i];
                btns.forEach((x, i) => {
                  x.disabled = true;
                  if (opts[i].ok) x.classList.add("right");
                  else if (x !== b) x.classList.add("dim");
                });
                if (o.ok) {
                  S.score++;
                } else {
                  b.classList.add("wrong");
                  S.miss.push({
                    q: q.q,
                    your: o.t,
                    right: opts.find((z) => z.ok).t,
                  });
                }
                document.getElementById("pts").textContent = S.score;
                document.getElementById("fbx").innerHTML =
                  `<div class="fb ${o.ok ? "ok" : "no"}"><b>${o.ok ? pick(["Correct!", "Great job!", "You got it!", "Nice work!"]) : "Not quite."}</b><span>${o.ok ? "" : "The answer is <strong>" + esc(opts.find((z) => z.ok).t) + "</strong>. "}${esc(q.x || "")}</span></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn next" id="nextBtn" type="button">${S.i + 1 < S.list.length ? "Next" : "See my score"}</button></div>`;
                const n = document.getElementById("nextBtn");
                n.onclick = () => {
                  S.i++;
                  render();
                };
                n.focus({ preventScroll: true });
              }),
          );
        }

        function renderMT(q) {
          const left = shuf(q.p.map((p, i) => ({ i, ic: p[0], t: p[1] })));
          const right = shuf(q.p.map((p, i) => ({ i, t: p[2] })));
          const pair = {}; // leftIdx -> rightIdx
          let sel = null,
            checked = false;
          app.innerHTML = `${hud()}<section class="card pop">
    <span class="qtype mt">Matching · ${q.p.length} points</span>
    <p class="qtext">${esc(q.t)}</p>
    <p class="hint">Tap a word on the left, then tap its meaning on the right. Tap again to undo.</p>
    <div class="match"><div class="mcol" id="colL"></div><div class="mcol" id="colR"></div></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my matches</button></div></div>
  </section>`;
          const colL = document.getElementById("colL"),
            colR = document.getElementById("colR");
          function draw() {
            colL.innerHTML = left
              .map((l, k) => {
                const p = pair[l.i] !== undefined;
                const ok = checked && pair[l.i] === l.i;
                const cls = checked
                  ? ok
                    ? "ok"
                    : "no"
                  : sel === l.i
                    ? "sel"
                    : "";
                return `<button type="button" class="mi ${cls}" id="ml-${k}" data-l="${l.i}" ${checked ? "disabled" : ""}><span class="ic">${l.ic}</span><span class="tx">${esc(l.t)}${checked && !ok ? `<span class="fix">→ ${esc(q.p[l.i][2])}</span>` : ""}</span>${p ? `<span class="tag" style="background:${PAIRC[k % PAIRC.length]}">${k + 1}</span>` : ""}</button>`;
              })
              .join("");
            colR.innerHTML = right
              .map((r, k) => {
                const li = Object.keys(pair).find((x) => pair[x] === r.i);
                const lk =
                  li !== undefined ? left.findIndex((x) => x.i === +li) : -1;
                const cls =
                  checked && li !== undefined
                    ? +li === r.i
                      ? "ok"
                      : "no"
                    : "";
                return `<button type="button" class="mi ${cls}" id="mr-${k}" data-r="${r.i}" ${checked ? "disabled" : ""}><span class="tx">${esc(r.t)}</span>${lk >= 0 ? `<span class="tag" style="background:${PAIRC[lk % PAIRC.length]}">${lk + 1}</span>` : ""}</button>`;
              })
              .join("");
            colL.querySelectorAll("[data-l]").forEach(
              (b) =>
                (b.onclick = () => {
                  const li = +b.dataset.l;
                  if (pair[li] !== undefined) {
                    delete pair[li];
                    sel = li;
                  } else sel = sel === li ? null : li;
                  draw();
                }),
            );
            colR.querySelectorAll("[data-r]").forEach(
              (b) =>
                (b.onclick = () => {
                  const ri = +b.dataset.r;
                  const owner = Object.keys(pair).find((x) => pair[x] === ri);
                  if (sel === null) {
                    if (owner !== undefined) {
                      delete pair[owner];
                      draw();
                    }
                    return;
                  }
                  if (owner !== undefined) delete pair[owner];
                  pair[sel] = ri;
                  sel = null;
                  draw();
                }),
            );
            const cb = document.getElementById("checkBtn");
            if (cb) cb.disabled = Object.keys(pair).length < q.p.length;
          }
          draw();
          document.getElementById("checkBtn").onclick = () => {
            checked = true;
            let got = 0;
            q.p.forEach((p, i) => {
              if (pair[i] === i) got++;
              else
                S.miss.push({
                  q: "Match: " + p[1],
                  your: q.p[pair[i]][2],
                  right: p[2],
                });
            });
            S.score += got;
            document.getElementById("pts").textContent = S.score;
            draw();
            const all = got === q.p.length;
            document.getElementById("fbx").innerHTML =
              `<div class="fb ${all ? "ok" : "no"}"><b>${all ? "All matched!" : got + " of " + q.p.length + " correct"}</b><span>${all ? "Every pair is right. Great job!" : "Check the green and red boxes. The red ones show the right meaning under the word."}</span></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn next" id="nextBtn" type="button">${S.i + 1 < S.list.length ? "Next" : "See my score"}</button></div>`;
            const n = document.getElementById("nextBtn");
            n.onclick = () => {
              S.i++;
              render();
            };
            n.focus({ preventScroll: true });
          };
        }

        function end() {
          const pct = Math.round((S.score / S.max) * 100);
          const st = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
          const msg =
            pct === 100
              ? "Perfect score! You are ready for the exam."
              : pct >= 90
                ? "Excellent! Almost perfect."
                : pct >= 70
                  ? "Good work! Look at the review below and play again."
                  : pct >= 50
                    ? "Not bad. Read the review below, then try again."
                    : "Keep practicing. Read the review below and play again.";
          app.innerHTML = `<section class="card pop">
    <span class="eyebrow">Your score</span>
    <div class="big-score">${S.score}<small> / ${S.max} points</small></div>
    <div class="stars">${[0, 1, 2].map((i) => star(i < st)).join("")}</div>
    <h2>${pct}% · ${msg}</h2>
    <div class="row"><button class="btn big" id="againBtn" type="button">Play again</button><button class="btn ghost" id="homeBtn" type="button">Back to start</button></div>
  </section>
  ${S.miss.length ? `<section class="card"><h3>Let's review (${S.miss.length})</h3><ul class="review">${S.miss.map((m) => `<li><div class="q">${esc(m.q)}</div><div class="a">You chose: <s>${esc(m.your)}</s><br>Right answer: <em>${esc(m.right)}</em></div></li>`).join("")}</ul></section>` : ""}`;
          document.getElementById("againBtn").onclick = start;
          document.getElementById("homeBtn").onclick = () => {
            S.list = [];
            home();
          };
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        Quiz.watch(app);
        home();
      })();
    </script>
  </body>
</html>
