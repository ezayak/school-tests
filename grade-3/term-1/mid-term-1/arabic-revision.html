<title>Arabic Revision</title>

<style>
/* Layout: one worksheet card on graph paper; picture on top, answers below, energy meter as progress */
:root{
  --paper:#F2F6FC; --grid:#DCE6F3; --card:#FFFFFF; --ink:#1B2440; --muted:#56637F;
  --ke:#E8661A; --pe:#14899A; --heat:#DD3B34; --cool:#3474CF; --good:#1C8F4E; --bad:#CF3E3E; --hl:#FFE14D;
  --sky:#E4F0FB; --ground:#C6DBAE; --grass:#8DC46C; --wood:#C48955; --water:#5AB0E2; --rock:#9AA3AE;
  --deep:#0E2A47; --metal:#B9C3CD; --road:#5B6170; --glow:#9BE7FF;
  --red:#E0443A; --blue:#2F6FD0; --green:#2C9B4F; --sand:#F2D08A; --sand2:#E7B964; --snow:#F7FAFD; --wheat:#E9D58A;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1B2540; --card:#19223A; --ink:#EAF0FF; --muted:#A1ADC9;
  --ke:#FF8A3D; --pe:#39C2D3; --heat:#FF6A5F; --cool:#6FA2F0; --good:#3CCB7F; --bad:#FF6B6B; --hl:#FFD84D;
  --sky:#1E2C47; --ground:#2C4231; --grass:#3E6E3B; --wood:#8E6440; --water:#2F7FB0; --rock:#6C7480;
  --deep:#06162A; --metal:#6F7A86; --road:#383E4B; --glow:#7FDcff;
  --red:#FF6A5F; --blue:#6FA2F0; --green:#3CCB7F; --sand:#B8924A; --sand2:#A07C38; --snow:#DCE4EE; --wheat:#8F7F3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1B2540; --card:#19223A; --ink:#EAF0FF; --muted:#A1ADC9;
  --ke:#FF8A3D; --pe:#39C2D3; --heat:#FF6A5F; --cool:#6FA2F0; --good:#3CCB7F; --bad:#FF6B6B; --hl:#FFD84D;
  --sky:#1E2C47; --ground:#2C4231; --grass:#3E6E3B; --wood:#8E6440; --water:#2F7FB0; --rock:#6C7480;
  --deep:#06162A; --metal:#6F7A86; --road:#383E4B; --glow:#7FDcff;
  --red:#FF6A5F; --blue:#6FA2F0; --green:#3CCB7F; --sand:#B8924A; --sand2:#A07C38; --snow:#DCE4EE; --wheat:#8F7F3E; color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45;
  padding-inline:16px; padding-block:20px 40px; min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
.btn{font-family:var(--display);font-size:1.25rem;border:2.5px solid var(--ink);border-radius:14px;padding:12px 26px;background:var(--hl);color:#1B2440;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.big{font-size:1.6rem;padding:14px 44px}

/* start */
.hero-title{font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95}
.hero-title .k{color:var(--ke)} .hero-title .p{color:var(--pe)}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--card)}
.chip.pe{background:color-mix(in srgb,var(--pe) 22%,var(--card))}
.chip.ke{background:color-mix(in srgb,var(--ke) 22%,var(--card))}
.chip.ht{background:color-mix(in srgb,var(--heat) 18%,var(--card))}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--ink);border-radius:12px;padding:8px 16px;background:var(--card);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.back{align-self:flex-start;font-weight:700;color:var(--muted);text-decoration:none;font-size:.95rem}.back:hover{color:var(--ink);text-decoration:underline}
.howto{color:var(--muted);margin:0;max-width:60ch}

/* hud */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:1.15rem}
.meter{flex:1 1 160px;min-width:0;height:18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pe),var(--ke));transition:width .4s ease}
.score{font-family:var(--display);font-size:1.15rem;border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--hl);color:#1B2440;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.score svg{width:16px;height:16px}

/* scene */
.scene{width:100%;max-width:100%;aspect-ratio:16/9;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;display:block;background:var(--sky)}
.scene svg{width:100%;height:100%;display:block}
.qtype{display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);align-self:flex-start}
.qtype.mc{background:color-mix(in srgb,var(--pe) 22%,var(--card))}
.qtype.mt{background:color-mix(in srgb,var(--ke) 22%,var(--card))}
.qtext{font-size:1.3rem;font-weight:700;margin:0;text-wrap:pretty}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 14px;min-height:56px;font-weight:700;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);background:color-mix(in srgb,var(--hl) 30%,var(--card))}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1rem}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 22%,var(--card));border-color:var(--good)}
.opt.right .L{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad)}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}

.fb{border-radius:14px;padding:12px 16px;border:2.5px solid;display:flex;flex-direction:column;gap:4px}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fb b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.next{align-self:flex-end}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 14px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 12px;min-height:58px;font-weight:700;transition:transform .08s,background .15s}
.mi:hover:not(:disabled){transform:translateY(-2px)}
.mi .ic{font-family:var(--emoji);font-size:1.7rem;line-height:1;flex:none}
.mi .tx{min-width:0;overflow-wrap:anywhere}
.mi.sel{background:var(--hl);color:#1B2440;transform:translateY(-2px)}
.mi .tag{position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:#fff}
.mi.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.mi.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.mi .fix{display:block;font-weight:400;font-size:.9rem;color:var(--muted);margin-top:2px}
.mi:disabled{cursor:default}
@media (max-width:480px){.match{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px}.mi{padding:8px;font-size:.92rem}.mi .ic{font-size:1.35rem}}
.hint{color:var(--muted);margin:0}

/* end */
.big-score{font-family:var(--display);font-size:clamp(3rem,12vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
.big-score small{font-size:.4em;color:var(--muted)}
.stars{display:flex;gap:6px}
.stars svg{width:48px;height:48px}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border:2px solid var(--grid);border-left:6px solid var(--bad);border-radius:10px;padding:10px 12px;background:var(--card)}
.review .q{font-weight:700}
.review .a{color:var(--muted);font-size:.95rem}
.review .a em{font-style:normal;color:var(--good);font-weight:700}
.review .a s{color:var(--bad)}

/* svg scene classes */
.f-sky{fill:var(--sky)} .f-ground{fill:var(--ground)} .f-grass{fill:var(--grass)} .f-wood{fill:var(--wood)} .f-water{fill:var(--water)}
.f-rock{fill:var(--rock)} .f-deep{fill:var(--deep)} .f-metal{fill:var(--metal)} .f-road{fill:var(--road)} .f-ink{fill:var(--ink)} .f-card{fill:var(--card)}
.f-ke{fill:var(--ke)} .f-pe{fill:var(--pe)} .f-heat{fill:var(--heat)} .f-cool{fill:var(--cool)} .f-glow{fill:var(--glow)}
.f-hl{fill:var(--hl)} .f-sand{fill:var(--sand)} .f-sand2{fill:var(--sand2)} .f-snow{fill:var(--snow)} .f-wheat{fill:var(--wheat)} .st-hl{stroke:var(--hl);fill:none} .f-red{fill:var(--red)} .f-blue{fill:var(--blue)} .f-green{fill:var(--green)}
.st-ink{stroke:var(--ink);fill:none} .st-ke{stroke:var(--ke);fill:none} .st-pe{stroke:var(--pe);fill:none} .st-heat{stroke:var(--heat);fill:none}
.st-cool{stroke:var(--cool);fill:none} .st-green{stroke:var(--green);fill:none} .st-wave{stroke:var(--cool);fill:none} .st-glow{stroke:var(--glow);fill:none} .st-card{stroke:var(--card);fill:none} .st-wood{stroke:var(--wood);fill:none}
.lbl{font:700 13px var(--body);fill:var(--ink)} .lbl-big{font:400 18px var(--display);fill:var(--ink)}
.lbl-ke{font:400 18px var(--display);fill:var(--ke)} .lbl-heat{font:700 13px var(--body);fill:var(--heat)} .lbl-light{font:700 13px var(--body);fill:#EAF6FF}
.emo{font-family:var(--emoji)}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-3px)}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.wob,.pop{animation:none}.meter i{transition:none}}
.defs{position:absolute;width:0;height:0;overflow:hidden}
</style>
<style>
/* Arabic revision additions */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2.5px solid var(--ink);border-radius:16px;background:var(--card);padding:14px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.mode:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.mode:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mode .mi-ic{font-family:var(--emoji);font-size:1.8rem;line-height:1}
.mode b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.mode small{color:var(--muted);font-size:.88rem}
.abtn{font-family:var(--display);font-size:1.15rem;border:2.5px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);display:inline-flex;gap:8px;align-items:center}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Arabic Typesetting","Times New Roman",serif;font-weight:700;line-height:1.5}
.hero-ar{font-size:1.6rem;color:var(--muted)}
.mi.word{justify-content:center;font-size:1.6rem;font-weight:700}
.mi .ic{font-size:2rem}
.opt.aro{justify-content:center;font-size:1.7rem;min-height:64px}
.opt.aro .L{font-family:var(--display);font-size:1rem}
.en-word{font-family:var(--display);font-size:1.6rem;text-align:center;margin:0}
.fb .ar{font-size:1.3rem}
.review .ar{font-size:1.15rem}
.mi .fix .ar{font-size:1.1rem}
.lab{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--muted)}
/* folder tabs: the chosen tab joins the panel below (its bottom border hides the panel's top line) */
.ftabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end;margin-bottom:-2.5px;position:relative}
.ftabs button{font-family:var(--display);font-size:1.15rem;line-height:1.15;border:2.5px solid var(--ink);border-radius:14px 14px 0 0;background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--muted);padding:8px 8px 7px}
.ftabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);padding-block:13px 9px}
.panel{border:2.5px solid var(--ink);border-radius:0 0 16px 16px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px}
.tabbox{--panel:color-mix(in srgb,var(--hl) 12%,var(--card))}
.ftabs .ts{display:none}
@media (max-width:480px){.ftabs button{font-size:.95rem;padding-inline:4px}.panel{padding:12px}
  .ftabs .ti,.ftabs .tl{display:none}.ftabs .ts{display:inline}} /* phones: no icons, short labels */
.tab-sub{color:var(--muted);font-size:1.15rem;margin-bottom:-6px}
.note{color:var(--muted);font-size:.9rem;margin:0}
.sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted);font-family:var(--body)}
.mi.word .tx{text-align:center}
.mi .tx>.ar{font-size:1.35rem}
.match{grid-template-columns:repeat(2,minmax(0,1fr))} /* equal columns, also on phones */
.sent{font-size:1.8rem;text-align:center;margin:0}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--muted);color:var(--good)}
.psg{border:2px solid var(--grid);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--hl) 8%,var(--card))}
.psg summary,.eng summary{cursor:pointer;font-weight:700}
.ptext{font-size:1.35rem;line-height:2;margin:8px 0}
.eng p{margin:6px 0;color:var(--muted)}
.seqs .tx{flex:1;text-align:right;font-size:1.25rem}
.seqs .sub{text-align:left}
.slot{border:2.5px dashed var(--muted);border-radius:14px;padding:14px;text-align:center}
#bank{padding-top:12px;border-top:2px dashed var(--grid)}
.opt.aro small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);margin-inline-start:4px}
</style>

<script>

 {k:'plant',ic:'🌱',t:"Maryam's plant",w:[

  ['معلمة','teacher (woman)','👩‍🏫'],['زملاء','classmates','🧒👧'],['حلم','dream','💭'],['تحكي','tells a story','🗣️'],['فازت','she won','🥇'],
  ['والد','father','👨'],['بجواري','next to me','🧔👧'],['أخطاء','mistakes','❌'],['محاولة','a try','🔁'],['ينجح','succeeds','✅'],['يتعلم','learns','🧠']]},
 {k:'hero',ic:'🦸',t:'The hidden hero',w:[

 {k:'poem',ic:'🐝',t:'Poem',w:[

  ['الوقت','time','⏰'],['يتقن','does it well','⭐'],['سعى','worked hard','💪'],['الناجح','the successful one','🏅'],['العمل','work','🛠️']]},
 {k:'race',ic:'🐢',t:'Rabbit & tortoise',w:[

  ['يحتفل','celebrates','🎉'],['خط النهاية','finish line','🏁']]},
 {k:'more',ic:'✈️',t:'More words',w:[

  ['أسود','black','⚫'],['القراءة','reading','📖'],['أصدقائي','my friends','👫'],['درجات','marks (grades)','💯'],['أخي','my brother','👦']]},

const ALL=TOPICS.flatMap(t=>t.w);
const MIX=20; // words in a "Mix" game

/* GRAMMAR from the sheet. Pairs: [left, right, left English, right English, emoji]. */

  const nextPart=()=>{const t=parts.shift();if(!t){reading=false;return}player.src=TTS_URL+encodeURIComponent(t);player.defaultPlaybackRate=player.playbackRate=rate;player.play().catch(()=>{})};
  player.onended=nextPart;nextPart()}
function say(text,slow){hush();if(voice){try{const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=slow?.55:.75;speechSynthesis.speak(u)}catch(e){}}else if(navigator.onLine)sayOnline(text,slow)}

/* ---------- home: pick a topic and a game ---------- */

 {k:'match',ic:'🧩',t:'Word match',d:'Match each Arabic word to its picture and English meaning'},
 {k:'quiz',ic:'🖼️',t:'Picture quiz',d:'Look at the picture, choose the Arabic word'},
];
const GMODES=[
 {k:'opp',ic:'🔄',t:'Opposites',d:'مضاد · match each word to its opposite'},
 {k:'plu',ic:'👥',t:'One & many',d:'مفرد وجمع · match one to many'},
 {k:'qw',ic:'❓',t:'Question words',d:'هل · ما · من · لماذا · أين'},
 {k:'pw',ic:'👉',t:'Pointing words',d:'هذا · تلك · هؤلاء · أولئك'},
];
const SMODES=[
 {k:'read',ic:'📖',t:'Read & answer',d:'Listen or read a story, then answer like on the sheet'},
 {k:'order',ic:'🔢',t:'Story order',d:'Put the sentences in order: beginning to end'},
 {k:'poem',ic:'🐝',t:'Finish the poem',d:'نشيد أسرار النجاح · choose the missing word'},
];
const MODE_NAME={match:'Word match',quiz:'Picture quiz',opp:'Opposites',plu:'One & many',qw:'Question words',pw:'Pointing words',read:'Read & answer',order:'Story order',poem:'Finish the poem'};
const modeBtns=ms=>`<div class="modes">${ms.map(m=>`<button type="button" class="mode" id="mode-${m.k}" data-m="${m.k}"><span class="mi-ic">${m.ic}</span><b>${m.t}</b><small>${m.d}</small></button>`).join('')}</div>`;
// home tabs: one per kind of game
const TABS=[{k:'words',ic:'🔤',t:'Words',ms:MODES},{k:'gram',ic:'✏️',t:'Grammar',sub:'الأساليب والتراكيب',ms:GMODES},{k:'stories',ic:'📖',t:'Stories & poem',short:'Stories',sub:'القراءة والاستماع',ms:SMODES}];
let tab=store.get('ar3-tab','words'); if(!TABS.some(t=>t.k===tab))tab='words';
function home(still){ // still===true: switching tab/words, so no pop animation
  hush();
  const tps=[{k:'mix',ic:'🎲',t:`Mix · ${MIX} words`},...TOPICS.map(t=>({k:t.k,ic:t.ic,t:`${t.t} · ${t.w.length}`}))];

    <a class="back" href="../../../index.html">← All games</a>
    <span class="eyebrow">Grade 3 Arabic · Mid-term revision</span>
    <h1 class="hero-title"><span class="p">Arabic</span> <span class="k">Revision</span></h1>
    <div class="hero-ar ar" lang="ar" dir="rtl">مراجعة لغة عربية</div>
    <p class="howto">Ready? Pick a tab, then choose a game.</p>
    <div class="tabbox"><div class="ftabs" role="group" aria-label="Kind of game">${TABS.map(t=>`<button type="button" id="tab-${t.k}" data-tab="${t.k}" aria-pressed="${tab===t.k}"><span class="ti">${t.ic} </span>${t.short?`<span class="tl">${esc(t.t)}</span><span class="ts">${esc(t.short)}</span>`:esc(t.t)}</button>`).join('')}</div>
    <div class="panel">
    ${T.sub?`<div class="ar tab-sub" lang="ar" dir="rtl">${esc(T.sub)}</div>`:''}
    ${tab==='words'?`<div class="row"><span class="lab">Words</span><div class="seg" role="group" aria-label="Words">${tps.map(t=>`<button type="button" id="tp-${t.k}" data-tp="${t.k}" aria-pressed="${topic===t.k}">${t.ic} ${esc(t.t)}</button>`).join('')}</div></div>`:''}

/* ---------- shared game state ---------- */
const S={mode:null,list:[],i:0,score:0,max:0,miss:[]};
const words=()=>topic==='mix'?shuf(ALL).slice(0,MIX):shuf(TOPICS.find(t=>t.k===topic).w);
function hud(label){
  const pct=Math.round(S.i/Math.max(1,S.list.length)*100);
  return `<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to games">←</button><span class="qnum">${label}</span><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div><span class="score" aria-label="Points">${bolt}<b id="pts">${S.score}</b></span></div>`;
}
function bindHome(){const h=document.getElementById('homeBtn');if(h)h.onclick=home}
function startMode(m,story){
  S.mode=m;S.i=0;S.score=0;S.miss=[];
  tab=TABS.find(t=>t.ms.some(x=>x.k===m)).k;store.set('ar3-tab',tab); // back to this game's tab afterwards
  if(m==='read'){if(!story)return chooseStory();S.story=story;S.list=story.qs;S.max=story.qs.length;return storyIntro()}
  const pairs=p=>p.map(([lA,rA,lE,rE,ic])=>({ic,lA,lE,rA,rE}));
  if(m==='match')S.list=chunk(words().map(w=>({ic:w.p,lE:w.e,rA:w.a})),5);
  else if(m==='opp')S.list=chunk(shuf(pairs(OPP)),4);
  else if(m==='plu')S.list=chunk(shuf(pairs(PLU)),5);
  else if(m==='qw'){S.list=shuf(QW);S.opts=QW_OPTS}
  else if(m==='pw'){S.list=shuf(PW);S.opts=PW_OPTS}
  else if(m==='poem'){S.list=POEM.slice();S.opts=POEM_OPTS}
  else if(m==='order')S.list=ORDER.slice();
  else S.list=words();
  S.max=S.list.reduce((t,x)=>t+(Array.isArray(x)?x.length:x.s?x.s.length:1),0);
  next(true);
}
// split into rounds of n; a tiny last round joins the one before
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));if(r.length>1&&r[r.length-1].length<3)r[r.length-2].push(...r.pop());return r}
function next(first){if(!first)S.i++;if(S.i>=S.list.length)return end();({match,opp:match,plu:match,quiz,qw:gram,pw:gram,poem:gram,read:readQ,order})[S.mode]();window.scrollTo({top:0,behavior:'smooth'})}
function fb(ok,html){return `<div class="fb ${ok?'ok':'no'}"><b>${ok?pick(['Correct!','Great job!','You got it!','Super!','ممتاز!']):'Not quite.'}</b><span>${html}</span></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn next" id="nextBtn" type="button">${S.i+1<S.list.length?'Next':'See my score'}</button></div>`}
function bindNext(){const n=document.getElementById('nextBtn');n.onclick=()=>next();n.focus({preventScroll:true})}

/* ---------- MATCHING (Word match, Opposites, One & many) ----------
   round item: {ic, lA?: left Arabic, lE: left English, rA: right Arabic, rE?: right English} */
const PAIRC=['var(--ke)','var(--pe)','var(--cool)','var(--heat)','var(--green)','var(--ink)'];
const MATCH_TXT={
  match:['Match each picture to its Arabic word.','Tap a picture on the left, then tap the Arabic word on the right.'],
  opp:['Match each word to its opposite (مضاد).','Tap a word on the left, then tap its opposite on the right.'],
  plu:['Match one (مفرد) to many (جمع).','Tap a word on the left, then tap its plural on the right.']};
function match(){
  const round=S.list[S.i],[title,how]=MATCH_TXT[S.mode];
  const left=shuf(round.map((w,i)=>({i,w})));const right=shuf(round.map((w,i)=>({i,w})));
  const pair={};let sel=null,checked=false;
  app.innerHTML=`${hud(`Round ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mt">${MODE_NAME[S.mode]} · ${round.length} points</span>
    <p class="qtext">${esc(title)}</p>
    <p class="hint">${esc(how)} Tap again to undo.</p>
    <div class="match"><div class="mcol" id="colL"></div><div class="mcol" id="colR"></div></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my matches</button></div></div>
  </section>`;
  bindHome();
  const colL=document.getElementById('colL'),colR=document.getElementById('colR');
  function draw(){
    colL.innerHTML=left.map((l,k)=>{const p=pair[l.i]!==undefined;const ok=checked&&pair[l.i]===l.i;const cls=checked?(ok?'ok':'no'):(sel===l.i?'sel':'');
      return `<button type="button" class="mi ${cls}" id="ml-${k}" data-l="${l.i}" ${checked?'disabled':''}><span class="ic">${l.w.ic}</span><span class="tx">${l.w.lA?ar(l.w.lA)+`<span class="sub">${esc(l.w.lE)}</span>`:esc(l.w.lE)}${checked&&!ok?`<span class="fix">→ ${ar(l.w.rA)}</span>`:''}</span>${p?`<span class="tag" style="background:${PAIRC[k%PAIRC.length]}">${k+1}</span>`:''}</button>`}).join('');
    colR.innerHTML=right.map((r,k)=>{const li=Object.keys(pair).find(x=>pair[x]===r.i);const lk=li!==undefined?left.findIndex(x=>x.i===+li):-1;const cls=checked&&li!==undefined?(+li===r.i?'ok':'no'):'';
      return `<button type="button" class="mi word ${cls}" id="mr-${k}" data-r="${r.i}" ${checked?'disabled':''}><span class="tx">${ar(r.w.rA)}${checked&&r.w.rE?`<span class="sub">${esc(r.w.rE)}</span>`:''}</span>${lk>=0?`<span class="tag" style="background:${PAIRC[lk%PAIRC.length]}">${lk+1}</span>`:''}</button>`}).join('');
    colL.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const li=+b.dataset.l;if(pair[li]!==undefined){delete pair[li];sel=li}else sel=(sel===li?null:li);draw()});
    colR.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ri=+b.dataset.r;const owner=Object.keys(pair).find(x=>pair[x]===ri);
      if(sel===null){if(owner!==undefined){delete pair[owner];draw()}else say(round[ri].rA);return}
      if(owner!==undefined)delete pair[owner];pair[sel]=ri;sel=null;say(round[ri].rA);draw()});
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=Object.keys(pair).length<round.length;
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    checked=true;let got=0;
    round.forEach((w,i)=>{if(pair[i]===i)got++;else S.miss.push({q:`${w.ic} ${w.lA?ar(w.lA)+' · ':''}${esc(w.lE)}`,your:round[pair[i]].rA,right:w.rA})});
    S.score+=got;document.getElementById('pts').textContent=S.score;draw();
    document.getElementById('fbx').innerHTML=fb(got===round.length,got===round.length?'Every pair is right!':`${got} of ${round.length} correct. The red ones show the right answer.`);bindNext();
  };
}

/* ---------- PICTURE QUIZ: picture + English → choose the Arabic word ---------- */
function quiz(){
  const w=S.list[S.i];
  const pool=n=>shuf(n.filter(x=>x.a!==w.a));
  const same=pool(TOPICS.find(t=>t.k===w.k).w),other=pool(ALL.filter(x=>x.k!==w.k));
  const opts=shuf([w,...same.concat(other).slice(0,2)]);
  app.innerHTML=`${hud(`Question ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mc">Picture quiz</span>
    ${scene(w)}
    <p class="en-word">${esc(w.e)}</p>
    <p class="qtext">Which Arabic word is it?</p>
    <div class="opts">${opts.map((o,i)=>`<button type="button" class="opt aro" id="opt-${i}" data-i="${i}"><span class="L">${'ABC'[i]}</span>${ar(o.a)}</button>`).join('')}</div>
    <div id="fbx"></div>
  </section>`;
  bindHome();
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i],ok=o===w;
    btns.forEach((x,i)=>{x.disabled=true;if(opts[i]===w)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(ok)S.score++;else{b.classList.add('wrong');S.miss.push({q:`${w.p} ${esc(w.e)}`,your:o.a,right:w.a})}
    document.getElementById('pts').textContent=S.score;
    say(w.a);
    document.getElementById('fbx').innerHTML=fb(ok,`${ar(w.a)} = ${esc(w.e)} ${w.p}`);bindNext();
  });
}

/* ---------- FILL THE GAP (Question words, Pointing words) ---------- */
function gram(){
  const it=S.list[S.i],O=S.opts;
  const sent=g=>esc(it.q).replace('___',`<span class="gap">${g?esc(g):'&nbsp;'}</span>`);
  app.innerHTML=`${hud(`Question ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mc">${MODE_NAME[S.mode]}</span>
    ${S.mode==='pw'?pwScene(it):box(em(120,90,84,it.ic)+em(232,84,72,'❓'),it.x)}
    <p class="qtext">Choose the word for the gap:</p>
    <p class="sent ar" lang="ar" dir="rtl" id="sent">${sent()}</p>
    <div class="opts">${O.map(([a,e],i)=>`<button type="button" class="opt aro" id="opt-${i}" data-i="${i}"><span class="L">${'ABCDE'[i]}</span>${ar(a)}<small>${esc(e)}</small></button>`).join('')}</div>
    <div id="fbx"></div>
  </section>`;
  bindHome();
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    const a=O[+b.dataset.i][0],ok=a===it.a;
    btns.forEach((x,i)=>{x.disabled=true;if(O[i][0]===it.a)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(ok)S.score++;else{b.classList.add('wrong');S.miss.push({q:ar(it.q),your:a,right:it.a})}
    document.getElementById('pts').textContent=S.score;
    document.getElementById('sent').innerHTML=sent(it.a);
    say(it.q.replace('___',it.a));
    document.getElementById('fbx').innerHTML=fb(ok,`The answer is ${ar(it.a)}. ${esc(it.x)}`);bindNext();
  });
}

/* ---------- READ & ANSWER: a story, then the sheet's questions ---------- */
const psg=(st,open)=>`<details class="psg" ${open?'open':''}><summary>📖 The story</summary><p class="ar ptext" lang="ar" dir="rtl">${esc(st.text).replace(/\n/g,'<br>')}</p><details class="eng"><summary>Show in English</summary><p>${esc(st.en)}</p></details></details>`;
function chooseStory(){
  hush();
  app.innerHTML=`<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to games">←</button><span class="qnum">Read &amp; answer</span></div>
  <section class="card pop"><p class="qtext">Which story?</p>
    <div class="modes">${STORIES.map((s,i)=>`<button type="button" class="mode" id="st-${s.k}" data-st="${i}"><span class="mi-ic">${s.ic}</span><b>${esc(s.t)}</b><small>${s.listen?'Listening · ':''}${s.qs.length} questions</small></button>`).join('')}</div>
  </section>`;
  bindHome();
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>startMode('read',STORIES[+b.dataset.st]));
}
function storyIntro(){
  const st=S.story,sp=canSpeak();
  app.innerHTML=`<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to games">←</button><span class="qnum">${st.ic} ${esc(st.t)}</span></div>
  <section class="card pop">
    <span class="qtype mc">${st.listen&&sp?'Listen, then answer':'Read, then answer'}</span>
    ${sp?`<div class="row"><button type="button" class="abtn" id="say1">🔊 Listen</button><button type="button" class="abtn" id="say2">🐢 Slowly</button><button type="button" class="abtn" id="pauseBtn">⏸ Pause</button><button type="button" class="abtn" id="stopBtn">⏹ Stop</button></div>`:''}
    ${psg(st,true)}
    ${st.listen&&!sp?'<p class="note">This is the listening story (نص الاستماع). Connect to the internet to hear it, or ask someone to read it to you.</p>':''}
    <div class="row" style="justify-content:flex-end"><button class="btn big" id="goBtn" type="button">Start questions</button></div>
  </section>`;
  bindHome();
  if(sp){
    const pb=document.getElementById('pauseBtn');let paused=false;
    const setPaused=v=>{paused=v;pb.textContent=v?'▶ Resume':'⏸ Pause'};
    document.getElementById('say1').onclick=()=>{setPaused(false);say(st.text)};
    document.getElementById('say2').onclick=()=>{setPaused(false);say(st.text,true)};
    pb.onclick=()=>{if(paused)resumeVoice();else pauseVoice();setPaused(!paused)};
    document.getElementById('stopBtn').onclick=()=>{hush();setPaused(false)};
  }
  document.getElementById('goBtn').onclick=()=>{hush();next(true)};
}
function readQ(){
  const st=S.story,q=S.list[S.i];
  const opts=q.o?shuf(q.o.map((a,i)=>({a,ok:i===0}))):[{a:'صح',e:'true ✓',ok:q.tf},{a:'خطأ',e:'false ✗',ok:!q.tf}];
  app.innerHTML=`${hud(`Question ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mc">${q.o?'Choose the answer':'True ✓ or false ✗?'}</span>
    ${psg(st,false)}
    <p class="sent ar" lang="ar" dir="rtl">${esc(q.q)}</p>
    <div class="opts">${opts.map((o,i)=>`<button type="button" class="opt aro" id="opt-${i}" data-i="${i}"><span class="L">${'ABC'[i]}</span>${ar(o.a)}${o.e?`<small>${o.e}</small>`:''}</button>`).join('')}</div>
    <div id="fbx"></div>
  </section>`;
  bindHome();
  const btns=[...app.querySelectorAll('.opt')],right=opts.find(z=>z.ok).a;
  btns.forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    btns.forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(o.ok)S.score++;else{b.classList.add('wrong');S.miss.push({q:ar(q.q),your:o.a,right})}
    document.getElementById('pts').textContent=S.score;
    document.getElementById('fbx').innerHTML=fb(o.ok,esc(q.x).replace(/[؀-ۿ]+(?:\s+[؀-ۿ]+)*/g,ar));bindNext();
  });
}

/* ---------- STORY ORDER: tap the sentences from beginning to end ---------- */
function order(){
  const st=S.list[S.i],n=st.s.length;
  const bank=shuf(st.s.map((_,i)=>i));let line=[],checked=false;
  app.innerHTML=`${hud(`Story ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mt">Story order · ${n} points</span>
    <p class="qtext">Put the story in order: ${ar(st.t)}</p>
    <p class="hint">Tap the sentences in order, from the beginning to the end. Tap a numbered sentence to take it back.</p>
    <div class="mcol" id="line"></div>
    <div class="mcol" id="bank"></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my order</button></div></div>
  </section>`;
  bindHome();
  const tile=(i,k,cls)=>`<button type="button" class="mi seqs ${cls}" id="s-${i}" data-s="${i}" ${checked?'disabled':''}><span class="ic">${st.s[i][2]}</span><span class="tx ar" lang="ar" dir="rtl">${esc(st.s[i][0])}${checked?`<span class="sub" dir="ltr">${esc(st.s[i][1])}</span>`:''}</span>${k>=0?`<span class="tag" style="background:${PAIRC[k%PAIRC.length]}">${k+1}</span>`:''}</button>`;
  function draw(){
    document.getElementById('line').innerHTML=line.length?line.map((i,k)=>tile(i,k,checked?(i===k?'ok':'no'):'')).join(''):'<p class="hint slot">Your story starts here: tap the first sentence.</p>';
    document.getElementById('bank').innerHTML=bank.map(i=>tile(i,-1,'')).join('');
    app.querySelectorAll('#line [data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;line=line.filter(x=>x!==i);bank.push(i);draw()});
    app.querySelectorAll('#bank [data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;bank.splice(bank.indexOf(i),1);line.push(i);say(st.s[i][0]);draw()});
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=bank.length>0;
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    checked=true;let got=0;
    line.forEach((i,k)=>{if(i===k)got++;else S.miss.push({q:ar(st.s[i][0]),your:String(k+1),right:String(i+1),l:['You put it at number','Right number']})});
    S.score+=got;document.getElementById('pts').textContent=S.score;draw();
    document.getElementById('fbx').innerHTML=fb(got===n,`${got} of ${n} in the right place.<br>Title (العنوان): ${ar(st.t)} · ${esc(st.te)}<br>Beginning (البداية): ${ar(st.s[0][0])}<br>End (النهاية): ${ar(st.s[n-1][0])}`);bindNext();
  };
}

/* ---------- END ---------- */
function star(on){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="${on?'var(--hl)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/></svg>`}
function end(){
  const pct=Math.round(S.score/Math.max(1,S.max)*100);const st=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const msg=pct===100?'Perfect! You know all these words.':pct>=90?'Excellent!':pct>=70?'Good work! Look at the words below.':'Keep practising. Look at the words below, then play again.';
  app.innerHTML=`<section class="card pop">
    <span class="eyebrow">${MODE_NAME[S.mode]} · your score</span>
    <div class="big-score">${S.score}<small> / ${S.max} points</small></div>
    <div class="stars">${[0,1,2].map(i=>star(i<st)).join('')}</div>
    <h2>${pct}% · ${msg}</h2>
    <div class="row"><button class="btn big" id="againBtn" type="button">Play again</button><button class="btn ghost" id="modesBtn" type="button">Other games</button></div>
  </section>
  ${S.miss.length?`<section class="card"><h3>Let's review (${S.miss.length})</h3><ul class="review">${S.miss.map(m=>`<li><div class="q">${m.q}</div><div class="a">${m.l?m.l[0]:'You chose'}: <s>${ar(m.your)}</s><br>${m.l?m.l[1]:'Right answer'}: <em>${ar(m.right)}</em></div></li>`).join('')}</ul></section>`:''}`;
  document.getElementById('againBtn').onclick=()=>startMode(S.mode,S.mode==='read'?S.story:undefined);
  document.getElementById('modesBtn').onclick=home;
  window.scrollTo({top:0,behavior:'smooth'});
}

Quiz.watch(app);
home();
})();
</script>
</body></html>
