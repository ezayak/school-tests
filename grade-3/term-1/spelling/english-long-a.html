<style>
/* Layout: one worksheet card on graph paper; picture on top, answers below, energy meter as progress */
:root{
  --paper:#F2F6FC; --grid:#DCE6F3; --card:#FFFFFF; --ink:#1B2440; --muted:#56637F;
  --ke:#E8661A; --pe:#14899A; --heat:#DD3B34; --cool:#3474CF; --good:#1C8F4E; --bad:#CF3E3E; --hl:#FFE14D;
  --sky:#E4F0FB; --ground:#C6DBAE; --grass:#8DC46C; --wood:#C48955; --water:#5AB0E2; --rock:#9AA3AE;
  --deep:#0E2A47; --metal:#B9C3CD; --road:#5B6170; --glow:#9BE7FF;
  --red:#E0443A; --blue:#2F6FD0; --green:#2C9B4F; --sand:#F2D08A; --sand2:#E7B964; --snow:#F7FAFD; --wheat:#E9D58A;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1B2540; --card:#19223A; --ink:#EAF0FF; --muted:#A1ADC9;
  --ke:#FF8A3D; --pe:#39C2D3; --heat:#FF6A5F; --cool:#6FA2F0; --good:#3CCB7F; --bad:#FF6B6B; --hl:#FFD84D;
  --sky:#1E2C47; --ground:#2C4231; --grass:#3E6E3B; --wood:#8E6440; --water:#2F7FB0; --rock:#6C7480;
  --deep:#06162A; --metal:#6F7A86; --road:#383E4B; --glow:#7FDcff;
  --red:#FF6A5F; --blue:#6FA2F0; --green:#3CCB7F; --sand:#B8924A; --sand2:#A07C38; --snow:#DCE4EE; --wheat:#8F7F3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1B2540; --card:#19223A; --ink:#EAF0FF; --muted:#A1ADC9;
  --ke:#FF8A3D; --pe:#39C2D3; --heat:#FF6A5F; --cool:#6FA2F0; --good:#3CCB7F; --bad:#FF6B6B; --hl:#FFD84D;
  --sky:#1E2C47; --ground:#2C4231; --grass:#3E6E3B; --wood:#8E6440; --water:#2F7FB0; --rock:#6C7480;
  --deep:#06162A; --metal:#6F7A86; --road:#383E4B; --glow:#7FDcff;
  --red:#FF6A5F; --blue:#6FA2F0; --green:#3CCB7F; --sand:#B8924A; --sand2:#A07C38; --snow:#DCE4EE; --wheat:#8F7F3E; color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45;
  padding-inline:16px; padding-block:20px 40px; min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
.btn{font-family:var(--display);font-size:1.25rem;border:2.5px solid var(--ink);border-radius:14px;padding:12px 26px;background:var(--hl);color:#1B2440;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.big{font-size:1.6rem;padding:14px 44px}

/* start */
.hero-title{font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95}
.hero-title .k{color:var(--ke)} .hero-title .p{color:var(--pe)}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--card)}
.chip.pe{background:color-mix(in srgb,var(--pe) 22%,var(--card))}
.chip.ke{background:color-mix(in srgb,var(--ke) 22%,var(--card))}
.chip.ht{background:color-mix(in srgb,var(--heat) 18%,var(--card))}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--ink);border-radius:12px;padding:8px 16px;background:var(--card);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.back{align-self:flex-start;font-weight:700;color:var(--muted);text-decoration:none;font-size:.95rem}.back:hover{color:var(--ink);text-decoration:underline}
.howto{color:var(--muted);margin:0;max-width:60ch}

/* hud */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:1.15rem}
.meter{flex:1 1 160px;min-width:0;height:18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pe),var(--ke));transition:width .4s ease}
.score{font-family:var(--display);font-size:1.15rem;border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--hl);color:#1B2440;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.score svg{width:16px;height:16px}

/* scene */
.scene{width:100%;max-width:100%;aspect-ratio:16/9;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;display:block;background:var(--sky)}
.scene svg{width:100%;height:100%;display:block}
.qtype{display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);align-self:flex-start}
.qtype.mc{background:color-mix(in srgb,var(--pe) 22%,var(--card))}
.qtype.mt{background:color-mix(in srgb,var(--ke) 22%,var(--card))}
.qtext{font-size:1.3rem;font-weight:700;margin:0;text-wrap:pretty}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 14px;min-height:56px;font-weight:700;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);background:color-mix(in srgb,var(--hl) 30%,var(--card))}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1rem}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 22%,var(--card));border-color:var(--good)}
.opt.right .L{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad)}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}

.fb{border-radius:14px;padding:12px 16px;border:2.5px solid;display:flex;flex-direction:column;gap:4px}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fb b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.next{align-self:flex-end}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 14px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);padding:10px 12px;min-height:58px;font-weight:700;transition:transform .08s,background .15s}
.mi:hover:not(:disabled){transform:translateY(-2px)}
.mi .ic{font-family:var(--emoji);font-size:1.7rem;line-height:1;flex:none}
.mi .tx{min-width:0;overflow-wrap:anywhere}
.mi.sel{background:var(--hl);color:#1B2440;transform:translateY(-2px)}
.mi .tag{position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:#fff}
.mi.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.mi.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.mi .fix{display:block;font-weight:400;font-size:.9rem;color:var(--muted);margin-top:2px}
.mi:disabled{cursor:default}
@media (max-width:480px){.match{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px}.mi{padding:8px;font-size:.92rem}.mi .ic{font-size:1.35rem}}
.hint{color:var(--muted);margin:0}

/* end */
.big-score{font-family:var(--display);font-size:clamp(3rem,12vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
.big-score small{font-size:.4em;color:var(--muted)}
.stars{display:flex;gap:6px}
.stars svg{width:48px;height:48px}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border:2px solid var(--grid);border-left:6px solid var(--bad);border-radius:10px;padding:10px 12px;background:var(--card)}
.review .q{font-weight:700}
.review .a{color:var(--muted);font-size:.95rem}
.review .a em{font-style:normal;color:var(--good);font-weight:700}
.review .a s{color:var(--bad)}

/* svg scene classes */
.f-sky{fill:var(--sky)} .f-ground{fill:var(--ground)} .f-grass{fill:var(--grass)} .f-wood{fill:var(--wood)} .f-water{fill:var(--water)}
.f-rock{fill:var(--rock)} .f-deep{fill:var(--deep)} .f-metal{fill:var(--metal)} .f-road{fill:var(--road)} .f-ink{fill:var(--ink)} .f-card{fill:var(--card)}
.f-ke{fill:var(--ke)} .f-pe{fill:var(--pe)} .f-heat{fill:var(--heat)} .f-cool{fill:var(--cool)} .f-glow{fill:var(--glow)}
.f-hl{fill:var(--hl)} .f-sand{fill:var(--sand)} .f-sand2{fill:var(--sand2)} .f-snow{fill:var(--snow)} .f-wheat{fill:var(--wheat)} .st-hl{stroke:var(--hl);fill:none} .f-red{fill:var(--red)} .f-blue{fill:var(--blue)} .f-green{fill:var(--green)}
.st-ink{stroke:var(--ink);fill:none} .st-ke{stroke:var(--ke);fill:none} .st-pe{stroke:var(--pe);fill:none} .st-heat{stroke:var(--heat);fill:none}
.st-cool{stroke:var(--cool);fill:none} .st-green{stroke:var(--green);fill:none} .st-wave{stroke:var(--cool);fill:none} .st-glow{stroke:var(--glow);fill:none} .st-card{stroke:var(--card);fill:none} .st-wood{stroke:var(--wood);fill:none}
.lbl{font:700 13px var(--body);fill:var(--ink)} .lbl-big{font:400 18px var(--display);fill:var(--ink)}
.lbl-ke{font:400 18px var(--display);fill:var(--ke)} .lbl-heat{font:700 13px var(--body);fill:var(--heat)} .lbl-light{font:700 13px var(--body);fill:#EAF6FF}
.emo{font-family:var(--emoji)}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-3px)}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.wob,.pop{animation:none}.meter i{transition:none}}
.defs{position:absolute;width:0;height:0;overflow:hidden}
</style>
<style>
/* Spelling game additions */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2.5px solid var(--ink);border-radius:16px;background:var(--card);padding:14px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.mode:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.mode:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mode .mi-ic{font-family:var(--emoji);font-size:1.8rem;line-height:1}
.mode b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.mode small{color:var(--muted);font-size:.88rem}
.opts-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.og-right{margin-left:auto}
.og{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.opts-row .lab{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fc .scene.ls{max-width:clamp(170px,calc((100vh - 640px) * 1.78),340px)}
.fc .scene.small{max-width:clamp(200px,calc((100vh - 560px) * 1.78),400px)}
.thumbs .scene{border-width:2px;border-radius:10px}
@media (max-width:520px){.thumbs{grid-template-columns:repeat(3,1fr)}.thumbs .scene:nth-child(n+7){display:none}}
.fc{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.fc .scene{max-width:520px}
.fc-word{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.05;letter-spacing:.02em;min-height:1.1em;overflow-wrap:anywhere}
.fc-word.sent{font-size:clamp(1.6rem,6vw,2.3rem)}
.fc-word .m{color:var(--ke);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.fc-hidden{font-family:var(--display);font-size:1.4rem;color:var(--muted);border:2.5px dashed var(--muted);border-radius:14px;padding:12px 22px;background:transparent}
.tr{font-size:1.15rem;color:var(--muted);font-weight:700}
.tr[dir="rtl"]{font-size:1.3rem}
.pat{display:inline-block;font-weight:700;font-size:.85rem;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:color-mix(in srgb,var(--ke) 18%,var(--card))}
.audio{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.abtn{font-family:var(--display);font-size:1.15rem;border:2.5px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);display:inline-flex;gap:8px;align-items:center}
.abtn .e{font-family:var(--emoji)}
.abtn.big{font-size:1.4rem;padding:14px 26px;background:var(--hl);color:#1B2440}
.nav{display:flex;justify-content:space-between;gap:10px;width:100%}
.spell-in{font:700 1.6rem var(--body);letter-spacing:.06em;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;width:100%;text-align:center}
.spell-in:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.dots{font-family:var(--display);font-size:1.4rem;letter-spacing:.35em;color:var(--muted);text-align:center}
.diff{font:700 1.6rem var(--body);letter-spacing:.06em;text-align:center;overflow-wrap:anywhere}
.diff .ok{color:var(--good)} .diff .bad{color:var(--bad);text-decoration:underline}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:10px;border:2.5px dashed var(--ink);border-radius:14px;background:color-mix(in srgb,var(--hl) 10%,var(--card))}
.slots.over{background:color-mix(in srgb,var(--hl) 40%,var(--card))}
.slots.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.slots.no{border-style:solid;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.slots .ph{color:var(--muted);font-weight:700;align-self:center}
.letters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}
.tile.let{min-width:52px;font-size:1.7rem;padding:6px 12px;text-align:center}
.mi .pic{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.mi .pic .scene{width:100%;max-width:150px;border-width:2px;border-radius:10px}
.mi .pic .tr{font-size:.95rem}
.mi.word{justify-content:center;font-family:var(--display);font-size:1.35rem;font-weight:400}
.note{color:var(--muted);font-size:.9rem;margin:0}
</style>

<svg class="defs" aria-hidden="true"><defs>
  <marker id="ah-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker>
  <marker id="ah-ke" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ke"/></marker>
  <marker id="ah-pe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-pe"/></marker>
  <marker id="ah-heat" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-heat"/></marker>
  <marker id="ah-cool" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-cool"/></marker>
  <marker id="ah-hl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-hl"/></marker>
</defs></svg>
<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   WORD LIST — to make a new spelling game, copy this file and change
   only this LIST block.
   item fields:
     w    : the word or sentence (exactly as it should be spelled)
     type : "word" (default) or "sentence"
     pic  : a drawing name from PICS below, OR
     img  : a picture file, e.g. "images/toad.png" (AI-generated pictures work great)
     emoji: a single emoji used as the picture
     tr   : translations shown under the picture, e.g. {uk:"…", ar:"…"}
   ===================================================================== */
const LIST={
  title:"Long A Words",
  subtitle:"Grade 3 English · Spelling",
  lang:"en-US",                      // voice language
  pattern:"Long a: ai · ay · a_e · eigh · ey",
  langs:{uk:"Українська",ar:"العربية"},
  items:[
    {w:"plain", pic:"plain", tr:{uk:"рівнина",ar:"سهل"}},
    {w:"fail",  pic:"fail",  tr:{uk:"провалити",ar:"يفشل"}},
    {w:"grain", pic:"grain", tr:{uk:"зерно",ar:"حبوب"}},
    {w:"paint", pic:"paint", tr:{uk:"фарба",ar:"دهان"}},
    {w:"tray",  pic:"tray",  tr:{uk:"піднос",ar:"صينية"}},
    {w:"gray",  pic:"gray",  tr:{uk:"сірий",ar:"رمادي"}},
    {w:"state", pic:"state", tr:{uk:"штат",ar:"ولاية"}},
    {w:"fake",  pic:"fake",  tr:{uk:"підробка",ar:"مزيَّف"}},
    {w:"weigh", pic:"weigh", tr:{uk:"зважувати",ar:"يَزِن"}},
    {w:"they",  pic:"they",  tr:{uk:"вони",ar:"هم"}},
    {w:"I like to braid my hair.", type:"sentence", pic:"braid", tr:{uk:"Я люблю заплітати волосся в косу.",ar:"أحبّ أن أضفر شعري."}},
    {w:"A snail moves very slowly.", type:"sentence", pic:"snail", tr:{uk:"Равлик рухається дуже повільно.",ar:"الحلزون يتحرّك ببطء شديد."}},
    {w:"The trees sway in the wind.", type:"sentence", pic:"sway", tr:{uk:"Дерева гойдаються на вітрі.",ar:"تتمايل الأشجار في الريح."}},

(function(){
/* ---------- drawing helpers ---------- */
const em=(x,y,s,c,ex='')=>`<text class="emo" x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${ex}>${c}</text>`;

const ml=(x,y,d=1,c='ink')=>[0,1,2].map(i=>`<line class="st-${c}" x1="${x}" y1="${y-10+i*10}" x2="${x+d*(14+(i%2)*10)}" y2="${y-10+i*10}" stroke-width="3" stroke-linecap="round"/>`).join('');

const USP="M28,52 L118,42 L196,46 L226,34 L246,52 L276,44 L298,58 L284,80 L276,104 L262,118 L262,150 L246,140 L222,128 L196,138 L170,160 L150,136 L120,130 L94,142 L70,122 L44,110 L30,84 Z";
const PICS={

paint:()=>SKY+G(150,'wood')+`${em(120,96,92,'🎨')}${em(232,90,66,'🖌️')}<rect class="f-cool" x="250" y="120" width="40" height="30" rx="4"/>`,
tray:()=>SKY+G(150,'wood')+`<rect class="f-metal" x="50" y="112" width="220" height="16" rx="8"/><rect class="f-metal" x="36" y="104" width="24" height="12" rx="4"/><rect class="f-metal" x="260" y="104" width="24" height="12" rx="4"/>${em(120,88,44,'☕')}${em(180,92,36,'🍪')}${em(222,90,36,'🍎')}`,

state:()=>SKY+`<path class="f-sand" d="${USP}"/><path class="st-ink" d="${USP}" stroke-width="2.5"/><polygon class="f-heat" points="130,96 166,96 170,130 150,136 126,126"/><path class="st-ink" d="M130,96 L166,96 L170,130 L150,136 L126,126Z" stroke-width="2"/>${em(150,114,18,'⭐')}`,

weigh:()=>SKY+G(150,'wood')+`${em(160,88,100,'⚖️')}`,
they:()=>SKY+G(150)+`${em(54,100,56,'🧒')}${em(90,90,36,'👉','transform="scale(-1 1) translate(-180 0)"')}${em(200,102,58,'👦')}${em(250,102,58,'👧')}${em(225,40,28,'💬')}`,
braid:()=>SKY+G(150)+`${em(140,90,96,'👧')}${[0,1,2,3,4].map(i=>`<circle class="f-wood" cx="${190+i*3}" cy="${96+i*12}" r="8"/>`).join('')}<circle class="f-heat" cx="204" cy="156" r="5"/>`,
snail:()=>SKY+G(140,'grass')+`<path class="st-ink" d="M20,138 L170,138" stroke-width="3" stroke-dasharray="3 8" opacity=".5"/>${em(206,112,72,'🐌')}${em(70,60,30,'⏳')}`,
sway:()=>SKY+G(150,'grass')+`${em(110,90,84,'🌳','transform="rotate(14 110 140)"')}${em(220,96,72,'🌳','transform="rotate(12 220 140)"')}${wv(10,40,90,5,24,'cool',3)}${wv(20,64,80,5,24,'cool',3)}`,
storm:()=>`<rect class="f-deep" width="320" height="180"/>${G(150)}<rect class="f-wood" x="110" y="80" width="110" height="70"/><polygon class="f-heat" points="100,82 165,40 230,82"/><rect class="f-hl" x="130" y="98" width="34" height="28"/>${em(147,112,20,'👨‍👩‍👧')}<rect class="f-wood" x="180" y="110" width="22" height="40"/>${em(60,36,46,'⛈️')}${em(270,40,40,'🌧️')}${[30,60,250,280,300].map(x=>`<line class="st-cool" x1="${x}" y1="80" x2="${x-8}" y2="110" stroke-width="3"/>`).join('')}`,
race:()=>SKY+G(150)+`<line class="st-ink" x1="60" y1="80" x2="60" y2="150" stroke-width="3"/>${em(72,72,30,'🏁')}${em(150,104,56,'🏃')}${em(240,104,56,'🏃‍♀️')}${em(140,40,28,'⏱️')}${tx(160,40,'12 s','lbl-big','start')}${em(230,40,28,'⏱️')}${tx(250,40,'12 s','lbl-big','start')}`,
};
const drawPic=(it,cls='scene')=>{
  if(it.img)return `<div class="${cls}" role="img" aria-label="Picture"><img src="${esc(it.img)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  const inner=it.pic&&PICS[it.pic]?PICS[it.pic]():SKY+em(160,92,96,it.emoji||'❓');
  return `<div class="${cls}" role="img" aria-label="Picture"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">${inner}</svg></div>`};

/* ---------- utilities ---------- */
const app=document.getElementById('app');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KID=(()=>{try{const q=new URLSearchParams(location.search).get('name');if(q)return q.slice(0,30);return localStorage.getItem('st-name')||''}catch(e){return ''}})();
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const WORDS=LIST.items.filter(i=>i.type!=='sentence');
const SENTS=LIST.items.filter(i=>i.type==='sentence');
const bolt='<svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="#1B2440"/></svg>';
let trLang=store.get('sp-tr','off'); if(trLang!=='off'&&!(LIST.langs||{})[trLang])trLang='off';
let slow=store.get('sp-voice','normal')==='slow';

const trHTML=it=>{if(trLang==='off'||!it.tr||!it.tr[trLang])return '';const rtl=['ar','he','fa','ur'].includes(trLang);return `<div class="tr" dir="${rtl?'rtl':'ltr'}" lang="${trLang}">${esc(it.tr[trLang])}</div>`};

/* ---------- voice ---------- */
const TTS='speechSynthesis' in window;
let voice=null;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();const L=LIST.lang.toLowerCase(),P=L.split('-')[0];
  voice=vs.find(v=>v.lang.toLowerCase()===L&&v.localService)||vs.find(v=>v.lang.toLowerCase()===L)||vs.find(v=>v.lang.toLowerCase().startsWith(P))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,forceSlow){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LIST.lang;if(voice)u.voice=voice;u.rate=(forceSlow??slow)?0.55:0.9;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
const spoken=it=>it.type==='sentence'?it.w:it.w; // could add pauses later

/* ---------- long-vowel pattern highlight ---------- */
function marked(w){
  const e=esc(w);
  if(/\s/.test(w))return e;
  let m;
  if((m=w.match(/eigh|oa|ow|ou|ai|ay|ey|ee|ea|igh|oe|ue|ew/)))return esc(w.slice(0,m.index))+`<span class="m">${esc(m[0])}</span>`+esc(w.slice(m.index+m[0].length));
  if(/^[a-z]*[aeiou][^aeiou]e$/i.test(w)){const i=w.length-3;return esc(w.slice(0,i))+`<span class="m">${esc(w[i])}</span>`+esc(w.slice(i+1,-1))+`<span class="m">e</span>`}
  if((m=w.match(/old|olt|ost|oll/)))return esc(w.slice(0,m.index))+`<span class="m">o</span>`+esc(w.slice(m.index+1));
  return e;
}

/* ---------- home ---------- */
const MODES=[
 {k:'learn',ic:'📇',t:'Learn',d:'Flash cards: picture with word, or picture only'},
 {k:'match',ic:'🧩',t:'Match',d:'Match each picture to its word'},
 {k:'listen',ic:'🎧',t:'Listen & spell',d:'Hear words and/or sentences, then type them'},
 {k:'build',ic:'🔤',t:'Build the word',d:'Drag the letters into the right order'},
];
function home(){
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const langs=Object.entries(LIST.langs||{});
  app.innerHTML=`<section class="card pop">
    <a class="back" href="../../../index.html">← All games</a>
    <span class="eyebrow">${esc(LIST.subtitle)}</span>
    <h1 class="hero-title"><span class="p">Spelling:</span> <span class="k">${esc(LIST.title)}</span></h1>
    <div class="thumbs">${WORDS.slice(0,10).map(it=>drawPic(it)).join('')}</div>
    <p class="howto">Ready${KID?', '+esc(KID):''}? Pick a mode. ${LIST.pattern?`<span class="pat">${esc(LIST.pattern)}</span>`:''}</p>
    <div class="modes">${MODES.map(m=>`<button type="button" class="mode" id="mode-${m.k}" data-m="${m.k}"><span class="mi-ic">${m.ic}</span><b>${m.t}</b><small>${m.d}</small></button>`).join('')}</div>
    <div class="opts-row">
      ${langs.length?`<div class="og"><span class="lab">Translation</span><div class="seg" role="group" aria-label="Translation">${[['off','Off'],...langs].map(([k,n])=>`<button type="button" id="tr-${k}" data-tr="${k}" aria-pressed="${trLang===k}" title="${esc(n)}" aria-label="${esc(n)}">${k==='off'?'Off':esc(({uk:'UA'})[k]||k.toUpperCase())}</button>`).join('')}</div></div>`:''}
      <div class="og og-right"><span class="lab">Voice</span><div class="seg" role="group" aria-label="Voice speed"><button type="button" id="sp-norm" data-sp="0" aria-pressed="${!slow}">Normal</button><button type="button" id="sp-slow" data-sp="1" aria-pressed="${slow}">🐢 Slow</button></div></div>
    </div>
    ${TTS?'':'<p class="note">This browser cannot speak words aloud, so “Listen & spell” shows the picture instead.</p>'}
  </section>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
  app.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{trLang=b.dataset.tr;store.set('sp-tr',trLang);home()});
  app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{slow=b.dataset.sp==='1';store.set('sp-voice',slow?'slow':'normal');home()});
}

/* ---------- shared game state ---------- */
const S={mode:null,list:[],i:0,score:0,max:0,miss:[]};
const MODE_NAME={learn:'Learn',match:'Match',listen:'Listen & spell',build:'Build the word'};
function hud(label){
  const pct=Math.round(S.i/Math.max(1,S.list.length)*100);
  return `<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to modes">←</button><span class="qnum">${label}</span><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="width:${pct}%"></i></div>${S.mode==='learn'?'':`<span class="score" aria-label="Points">${bolt}<b id="pts">${S.score}</b></span>`}</div>`;
}
function bindHome(){const h=document.getElementById('homeBtn');if(h)h.onclick=home}
function startMode(m,opt){
  S.mode=m;S.i=0;S.score=0;S.miss=[];
  if(m==='learn'){S.list=LIST.items.slice();S.learnSet='all';S.showWord=store.get('sp-show','1')==='1';return learn()}
  if(m==='match'){const w=shuf(WORDS);S.list=[];for(let i=0;i<w.length;i+=5)S.list.push(w.slice(i,i+5));if(S.list.length>1&&S.list[S.list.length-1].length<3){const last=S.list.pop();S.list[S.list.length-1].push(...last)}S.max=WORDS.length;return match()}
  if(m==='listen'){if(SENTS.length&&!opt)return chooseListen();const k=opt||'words';S.lsKind=k;S.list=k==='words'?shuf(WORDS):k==='sentences'?shuf(SENTS):shuf(WORDS).concat(shuf(SENTS));S.max=S.list.length;return listen()}
  if(m==='build'){S.list=shuf(WORDS);S.max=S.list.length;return build()}
}
function chooseListen(){
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const opts=[['words','🔤','Words',`${WORDS.length} words`],['sentences','📝','Sentences',`${SENTS.length} sentences`],['both','⭐','Both',`${WORDS.length+SENTS.length} in total`]];
  app.innerHTML=`<div class="hud"><button type="button" class="abtn" id="homeBtn" aria-label="Back to modes">←</button><span class="qnum">Listen &amp; spell</span></div>
  <section class="card pop">
    <p class="qtext">What do you want to practise?</p>
    <div class="modes">${opts.map(([k,ic,t,d])=>`<button type="button" class="mode" id="lsk-${k}" data-k="${k}"><span class="mi-ic">${ic}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>
  </section>`;
  bindHome();
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>startMode('listen',b.dataset.k));
}
function next(){S.i++;if(S.i>=S.list.length)return end();({match,listen,build})[S.mode]()}
function fb(ok,html){return `<div class="fb ${ok?'ok':'no'}"><b>${ok?pick(['Correct!','Great job!','You got it!','Super!']):'Not quite.'}</b><span>${html}</span></div><div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn next" id="nextBtn" type="button">${S.i+1<S.list.length?'Next':'See my score'}</button></div>`}
function bindNext(){const n=document.getElementById('nextBtn');n.onclick=next;n.focus({preventScroll:true})}

/* ---------- LEARN ---------- */
function learn(){
  const set=S.learnSet==='words'?WORDS:S.learnSet==='sentences'?SENTS:LIST.items;
  if(S.i>=set.length)S.i=0; if(S.i<0)S.i=set.length-1;
  const it=set[S.i];S.list=set;S.revealed=false;
  const sent=it.type==='sentence';
  app.innerHTML=`${hud(`Card ${S.i+1} of ${set.length}`)}<section class="card pop fc">
    <div class="opts-row" style="justify-content:center">
      <div class="seg" role="group" aria-label="Cards">${[['all','All'],['words','Words'],['sentences','Sentences']].filter(([k])=>k!=='sentences'||SENTS.length).map(([k,n])=>`<button type="button" id="ls-${k}" data-ls="${k}" aria-pressed="${S.learnSet===k}">${n}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="Show word"><button type="button" id="sw-1" data-sw="1" aria-pressed="${S.showWord}">Picture + word</button><button type="button" id="sw-0" data-sw="0" aria-pressed="${!S.showWord}">Picture only</button></div>
    </div>
    ${drawPic(it)}
    ${trHTML(it)}
    <div id="wordBox">${S.showWord?`<div class="fc-word ${sent?'sent':''}">${sent?esc(it.w):marked(it.w)}</div>`:`<button type="button" class="fc-hidden" id="reveal">Tap to see the ${sent?'sentence':'word'}</button>`}</div>
    <div class="audio"><button type="button" class="abtn" id="say1"><span class="e">🔊</span> Listen</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    <div class="nav"><button type="button" class="btn ghost" id="prevBtn">← Back</button><button type="button" class="btn" id="nextCard">Next →</button></div>
  </section>`;
  bindHome();
  app.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{S.learnSet=b.dataset.ls;S.i=0;learn()});
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{S.showWord=b.dataset.sw==='1';store.set('sp-show',S.showWord?'1':'0');learn()});
  const rv=document.getElementById('reveal');if(rv)rv.onclick=()=>{document.getElementById('wordBox').innerHTML=`<div class="fc-word ${sent?'sent':''}">${sent?esc(it.w):marked(it.w)}</div>`;say(spoken(it),false)};
  document.getElementById('say1').onclick=()=>say(spoken(it),false);
  document.getElementById('say2').onclick=()=>say(spoken(it),true);
  document.getElementById('prevBtn').onclick=()=>{S.i--;learn()};
  document.getElementById('nextCard').onclick=()=>{S.i++;learn()};
}

/* ---------- MATCH (words only) ---------- */
const PAIRC=['var(--ke)','var(--pe)','var(--cool)','var(--heat)','var(--green)','var(--ink)'];
function match(){
  const round=S.list[S.i];
  const left=shuf(round.map((it,i)=>({i,it})));const right=shuf(round.map((it,i)=>({i,w:it.w})));
  const pair={};let sel=null,checked=false;
  app.innerHTML=`${hud(`Round ${S.i+1} of ${S.list.length}`)}<section class="card pop">
    <span class="qtype mt">Match · ${round.length} points</span>
    <p class="qtext">Match each picture to its word.</p>
    <p class="hint">Tap a picture, then tap its word. Tap again to undo.</p>
    <div class="match"><div class="mcol" id="colL"></div><div class="mcol" id="colR"></div></div>
    <div id="fbx"><div class="row" style="justify-content:flex-end"><button class="btn" id="checkBtn" type="button" disabled>Check my matches</button></div></div>
  </section>`;
  bindHome();
  const colL=document.getElementById('colL'),colR=document.getElementById('colR');
  function draw(){
    colL.innerHTML=left.map((l,k)=>{const p=pair[l.i]!==undefined;const ok=checked&&pair[l.i]===l.i;const cls=checked?(ok?'ok':'no'):(sel===l.i?'sel':'');
      return `<button type="button" class="mi ${cls}" id="ml-${k}" data-l="${l.i}" ${checked?'disabled':''} aria-label="Picture ${k+1}"><span class="pic">${drawPic(l.it)}${trHTML(l.it)}${checked&&!ok?`<span class="fix">→ ${esc(l.it.w)}</span>`:''}</span>${p?`<span class="tag" style="background:${PAIRC[k%PAIRC.length]}">${k+1}</span>`:''}</button>`}).join('');
    colR.innerHTML=right.map((r,k)=>{const li=Object.keys(pair).find(x=>pair[x]===r.i);const lk=li!==undefined?left.findIndex(x=>x.i===+li):-1;const cls=checked&&li!==undefined?(+li===r.i?'ok':'no'):'';
      return `<button type="button" class="mi word ${cls}" id="mr-${k}" data-r="${r.i}" ${checked?'disabled':''}><span class="tx">${esc(r.w)}</span>${lk>=0?`<span class="tag" style="background:${PAIRC[lk%PAIRC.length]}">${lk+1}</span>`:''}</button>`}).join('');
    colL.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const li=+b.dataset.l;if(pair[li]!==undefined){delete pair[li];sel=li}else sel=(sel===li?null:li);draw()});
    colR.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ri=+b.dataset.r;const owner=Object.keys(pair).find(x=>pair[x]===ri);
      if(sel===null){if(owner!==undefined){delete pair[owner];draw()}else say(round[ri].w,false);return}
      if(owner!==undefined)delete pair[owner];pair[sel]=ri;sel=null;draw()});
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=Object.keys(pair).length<round.length;
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    checked=true;let got=0;
    round.forEach((it,i)=>{if(pair[i]===i)got++;else S.miss.push({q:'Picture of “'+it.w+'”',your:round[pair[i]].w,right:it.w})});
    S.score+=got;document.getElementById('pts').textContent=S.score;draw();
    document.getElementById('fbx').innerHTML=fb(got===round.length,got===round.length?'Every pair is right!':`${got} of ${round.length} correct. The red ones show the right word.`);bindNext();
  };
}

/* ---------- LISTEN & SPELL ---------- */
const norm=s=>s.trim().replace(/\s+/g,' ').replace(/[’‘]/g,"'");
const normLoose=s=>norm(s).toLowerCase().replace(/[.,!?;:"]/g,'').trim();
function diffHTML(typed,right){
  const a=typed,b=right;let out='';
  for(let i=0;i<b.length;i++){const ok=a[i]!==undefined&&a[i].toLowerCase()===b[i].toLowerCase();out+=`<span class="${ok?'ok':'bad'}">${esc(b[i])===' '?'&nbsp;':esc(b[i])}</span>`}
  return out;
}
function listen(){
  const it=S.list[S.i];const sent=it.type==='sentence';let hint=!TTS;
  app.innerHTML=`${hud(`${sent?'Sentence':'Word'} ${S.i+1} of ${S.list.length}`)}<section class="card pop fc">
    <span class="qtype dr">Listen & spell</span>
    <p class="qtext">${sent?'Listen and write the sentence.':'Listen and spell the word.'}</p>
    <div class="audio"><button type="button" class="abtn big" id="say1"><span class="e">🔊</span> Play</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    <div id="hintBox" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px">${hint?drawPic(it,'scene ls')+trHTML(it):''}</div>
    ${sent?'':`<div class="dots" aria-label="${it.w.length} letters">${'_ '.repeat(it.w.length).trim()}</div>`}
    <input class="spell-in" id="spell" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…" aria-label="Your spelling">
    <div class="row" style="justify-content:center;gap:10px">${hint?'':'<button type="button" class="btn ghost" id="hintBtn">🖼️ Show picture</button>'}<button type="button" class="btn" id="checkBtn">Check</button></div>
    <div id="fbx" style="width:100%;display:flex;flex-direction:column;gap:10px"></div>
  </section>`;
  bindHome();
  document.getElementById('say1').onclick=()=>say(spoken(it));
  document.getElementById('say2').onclick=()=>say(spoken(it),true);
  const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>{document.getElementById('hintBox').innerHTML=drawPic(it,'scene ls')+trHTML(it);hb.remove()};
  const inp=document.getElementById('spell');inp.focus({preventScroll:true});
  setTimeout(()=>say(spoken(it)),350);
  let done=false;
  const check=()=>{
    if(done)return;const v=inp.value;if(!v.trim()){inp.focus();return}
    done=true;inp.disabled=true;{const cb=document.getElementById('checkBtn');if(cb&&cb.parentElement)cb.parentElement.remove();const d=document.querySelector('.fc .dots');if(d)d.remove();}
    const strict=norm(v)===norm(it.w), loose=normLoose(v)===normLoose(it.w);
    const ok=sent?loose:strict||normLoose(v)===normLoose(it.w);
    if(ok)S.score++;else S.miss.push({q:(sent?'Sentence':'Word')+' (listen)',your:v,right:it.w});
    document.getElementById('pts').textContent=S.score;
    let tip='';if(ok&&sent&&!strict)tip=' Remember the capital letter at the start and the full stop at the end.';
    document.getElementById('fbx').innerHTML=(ok?'':`<div class="diff">${diffHTML(norm(v),it.w)}</div>`)+fb(ok,ok?`${esc(it.w)}${tip}`:`The correct spelling is <strong>${esc(it.w)}</strong>. Letters in red are the ones to fix.`);
    if(!ok||!hint)document.getElementById('hintBox').innerHTML=drawPic(it,'scene ls')+trHTML(it);
    const hb2=document.getElementById('hintBtn');if(hb2)hb2.remove();
    bindNext();
  };
  document.getElementById('checkBtn').onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
}

/* ---------- BUILD THE WORD (drag letters) ---------- */
function build(){
  const it=S.list[S.i];const target=it.w.split('');
  let bank=shuf(target.map((t,i)=>({t,i})));for(let n=0;n<6&&bank.map(b=>b.t).join('')===it.w;n++)bank=shuf(bank);
  let line=[];let done=false;
  app.innerHTML=`${hud(`Word ${S.i+1} of ${S.list.length}`)}<section class="card pop fc">
    <span class="qtype dr">Build the word</span>
    ${drawPic(it,'scene small')}${trHTML(it)}
    <div class="audio"><button type="button" class="abtn" id="say1"><span class="e">🔊</span> Listen</button><button type="button" class="abtn" id="say2"><span class="e">🐢</span> Slowly</button></div>
    <div class="slots" id="line" aria-label="Your word"></div>
    <div class="letters" id="bank" aria-label="Letters"></div>
    <p class="hint">Drag the letters onto the line, or tap them.</p>
    <div id="fbx" style="width:100%;display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:center"><button class="btn" id="checkBtn" type="button" disabled>Check my word</button></div></div>
  </section>`;
  bindHome();
  document.getElementById('say1').onclick=()=>say(it.w,false);
  document.getElementById('say2').onclick=()=>say(it.w,true);
  const L=document.getElementById('line'),B=document.getElementById('bank');
  function draw(){
    L.innerHTML=line.length?line.map((w,k)=>`<button type="button" class="tile let" id="tl-${k}" data-from="line" data-k="${k}">${esc(w.t)}</button>`).join(''):'<span class="ph">Drop the letters here</span>';
    B.innerHTML=bank.map((w,k)=>`<button type="button" class="tile let" id="tb-${k}" data-from="bank" data-k="${k}">${esc(w.t)}</button>`).join('');
    if(done){L.querySelectorAll('.tile').forEach(t=>t.disabled=true);return}
    document.querySelectorAll('#line .tile,#bank .tile').forEach(bindTile);
    const cb=document.getElementById('checkBtn');if(cb)cb.disabled=bank.length>0;
  }
  function move(from,k,to,idx){const src=from==='line'?line:bank;const [w]=src.splice(k,1);const dst=to==='line'?line:bank;
    if(idx!=null&&from===to&&idx>k)idx--;if(idx==null||idx>dst.length)idx=dst.length;dst.splice(idx,0,w);draw()}
  function insertIndex(x,y){let idx=0;for(const t of L.querySelectorAll('.tile')){const r=t.getBoundingClientRect();if(y<r.top-4)break;if(y<=r.bottom+4&&x<r.left+r.width/2)break;idx++}return idx}
  function bindTile(el){
    el.onpointerdown=e=>{
      if(done)return;e.preventDefault();
      const from=el.dataset.from,k=+el.dataset.k,sx=e.clientX,sy=e.clientY;let ghost=null;const r=el.getBoundingClientRect();const ox=sx-r.left,oy=sy-r.top;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const inLine=ev=>{const lr=L.getBoundingClientRect();return ev.clientX>=lr.left&&ev.clientX<=lr.right&&ev.clientY>=lr.top-10&&ev.clientY<=lr.bottom+10};
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=el.cloneNode(true);ghost.classList.add('drag');ghost.removeAttribute('id');document.body.appendChild(ghost);el.classList.add('ghost')}
        if(ghost){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';L.classList.toggle('over',inLine(ev))}};
      const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);L.classList.remove('over');
        if(!ghost){from==='bank'?move('bank',k,'line',null):move('line',k,'bank',null);return}
        ghost.remove();el.classList.remove('ghost');
        if(inLine(ev))move(from,k,'line',insertIndex(ev.clientX,ev.clientY));else if(from==='line')move('line',k,'bank',null);else draw()};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    };
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const from=el.dataset.from,k=+el.dataset.k;from==='bank'?move('bank',k,'line',null):move('line',k,'bank',null)}};
  }
  draw();
  document.getElementById('checkBtn').onclick=()=>{
    done=true;const mine=line.map(w=>w.t).join('');const ok=mine===it.w;
    if(ok)S.score++;else S.miss.push({q:'Build the word',your:mine,right:it.w});
    document.getElementById('pts').textContent=S.score;L.classList.add(ok?'ok':'no');draw();
    document.getElementById('fbx').innerHTML=fb(ok,ok?`<strong>${esc(it.w)}</strong>`:`The correct spelling is <strong>${esc(it.w)}</strong>.`);
    if(ok)say(it.w,false);
    bindNext();
  };
}

/* ---------- END ---------- */
function star(on){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="${on?'var(--hl)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/></svg>`}
function end(){
  const pct=Math.round(S.score/Math.max(1,S.max)*100);const st=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const msg=pct===100?'Perfect spelling!':pct>=90?'Excellent!':pct>=70?'Good work! Practise the words below.':'Keep practising. Try the Learn cards, then play again.';
  app.innerHTML=`<section class="card pop">
    <span class="eyebrow">${MODE_NAME[S.mode]} · your score</span>
    <div class="big-score">${S.score}<small> / ${S.max} points</small></div>
    <div class="stars">${[0,1,2].map(i=>star(i<st)).join('')}</div>
    <h2>${pct}% · ${msg}</h2>
    <div class="row"><button class="btn big" id="againBtn" type="button">Play again</button><button class="btn ghost" id="modesBtn" type="button">Other modes</button></div>
  </section>
  ${S.miss.length?`<section class="card"><h3>Let's review (${S.miss.length})</h3><ul class="review">${S.miss.map(m=>`<li><div class="q">${esc(m.q)}</div><div class="a">You wrote: <s>${esc(m.your)}</s><br>Right spelling: <em>${esc(m.right)}</em></div></li>`).join('')}</ul></section>`:''}`;
  document.getElementById('againBtn').onclick=()=>startMode(S.mode,S.mode==='listen'?S.lsKind:undefined);
  document.getElementById('modesBtn').onclick=home;
  window.scrollTo({top:0,behavior:'smooth'});
}

home();
})();
</script>
